<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Triangle Battle Arena - 联机版</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0c10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Helvetica,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (game && game.touchMode) game.setupJoysticks();
}
window.addEventListener("resize", resize);

function triPoints(x, y, r, angle) {
  return [
    [x + Math.cos(angle) * r, y + Math.sin(angle) * r],
    [x + Math.cos(angle + 2.4) * r, y + Math.sin(angle + 2.4) * r],
    [x + Math.cos(angle - 2.4) * r, y + Math.sin(angle - 2.4) * r],
  ];
}
function drawTri(x, y, r, angle, fill) {
  const p = triPoints(x, y, r, angle);
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  ctx.lineTo(p[1][0], p[1][1]);
  ctx.lineTo(p[2][0], p[2][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}
const now = () => performance.now() / 1000;
function drawHpBar(x, y, hp, maxHp, color = "#ff2e63") {
  const bw = 42, bh = 5;
  const bx = x - bw / 2, by = y - 32;
  ctx.fillStyle = "#2b2d42"; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = color; ctx.fillRect(bx, by, (bw * hp) / maxHp, bh);
}
const SPEED_MULT = 1.7;

class Bullet {
  constructor(x, y, angle, speed = 10, radius = 5, color = "#00fff5", piercing = false) {
    this.x = x; this.y = y;
    this.dx = Math.cos(angle); this.dy = Math.sin(angle);
    this.speed = speed * SPEED_MULT;
    this.radius = radius; this.color = color; this.piercing = piercing;
    this.active = true; this.lockOnTarget = null; this.damageMult = 1;
    this.fromHelper = false; this.ownerId = null;
  }
  update() {
    if (this.lockOnTarget && this.lockOnTarget.isAlive) {
      const d = Math.hypot(this.lockOnTarget.x - this.x, this.lockOnTarget.y - this.y);
      if (d < 140) {
        const ang = Math.atan2(this.lockOnTarget.y - this.y, this.lockOnTarget.x - this.x);
        this.dx = Math.cos(ang); this.dy = Math.sin(ang);
      }
    }
    this.x += this.dx * this.speed; this.y += this.dy * this.speed;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) this.active = false;
  }
  draw() {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color; ctx.fill();
  }
}

class StrongBullet {
  constructor(x, y, angle) {
    this.x = x; this.y = y;
    this.dx = Math.cos(angle); this.dy = Math.sin(angle);
    this.speed = 17 * SPEED_MULT; this.radius = 14;
    this.active = true; this.lockOnTarget = null; this.damageMult = 1;
    this.fromHelper = false; this.piercing = true; this.ownerId = null;
  }
  update() {
    if (this.lockOnTarget && this.lockOnTarget.isAlive) {
      const d = Math.hypot(this.lockOnTarget.x - this.x, this.lockOnTarget.y - this.y);
      if (d < 140) {
        const ang = Math.atan2(this.lockOnTarget.y - this.y, this.lockOnTarget.x - this.x);
        this.dx = Math.cos(ang); this.dy = Math.sin(ang);
      }
    }
    this.x += this.dx * this.speed; this.y += this.dy * this.speed;
    if (this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30) this.active = false;
  }
  draw() {
    const r = this.radius;
    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = this.fromHelper ? "#bbbbbb" : "#ff2e63"; ctx.fill();
    ctx.beginPath(); ctx.arc(this.x, this.y, r / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
  }
}

class Rocket {
  constructor(x, y, target, speed = 6.5, color = "#1a3a8a", fromHelper = false) {
    this.x = x; this.y = y;
    this.radius = 7; this.size = 8;
    this.speed = speed * SPEED_MULT; this.color = color;
    this.spawnTime = now(); this.lifetime = 2.5; this.active = true;
    this.angle = target ? Math.atan2(target.y - y, target.x - x) : 0;
    this.damage = 1; this.fromHelper = fromHelper; this.ownerId = null;
  }
  update() {
    const elapsed = now() - this.spawnTime;
    if (elapsed > this.lifetime) { this.active = false; return; }
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    if (this.x < 5 || this.x > W - 5 || this.y < 5 || this.y > H - 5) this.active = false;
  }
  draw() { drawTri(this.x, this.y, this.size, this.angle, this.color); }
}

class PlayerRed {
  constructor(x, y, hp = 20, ownerId = null) {
    this.ownerId = ownerId;
    this.x = x; this.y = y;
    this.radius = 18;
    this.baseSpeed = 5.8 * SPEED_MULT;
    this.angle = 0;
    this.maxHp = hp; this.hp = hp;
    this.isAlive = true; this.score = 0; this.kills = 0;
    this.strongBulletCd = 20; this.lastStrongBulletTime = -20;
    this.rocketCd = 3; this.lastRocketTime = -3;
    this.dashCd = 4; this.lastDashTime = -4; this.dashEndTime = 0;
    this.equipped = [];
    this.shieldHp = 0; this.shieldMax = 10; this.shieldCd = 30; this.shieldLastUsed = -30;
    this.strikePending = false; this.isStriking = false;
    this.strikeDir = [1, 0]; this.strikeTrail = [];
    this.strikeCd = 15; this.strikeLastUsed = -15;
    this.lockonActive = false; this.lockonSelecting = false;
    this.lockonPath = []; this.lockonCircles = [];
    this.lockonLocked = new Set();
    this.lockonCd = 25; this.lockonLastUsed = -25;
    this.fakeActive = false; this.fakeStart = 0; this.fakeDuration = 10;
    this.fakeCd = 20; this.fakeLastUsed = -20;
    this.fakeAbsorbed = 0; this.fakeOrbsAngle = 0;
    this.fakeMode = "follow";
    this.fakeOrbPositions = [null, null]; this.fakeOrbTargets = [null, null];
    this.fakeOrbLastShoot = 0;
    this.helpActive = false; this.helpStart = 0; this.helpDuration = 12;
    this.helpCd = 30; this.helpLastUsed = -30;
    this.helpers = [];
    this.damageTakenThisLife = 0;
    this.pvpMode = false; this.name = "Red";
  }
  hasSkill(key) {
    if (this.pvpMode && (key === "fake" || key === "help" || key === "lockon")) return false;
    return this.equipped.includes(key);
  }
  triggerDash() {
    const t = now();
    if (t - this.lastDashTime >= this.dashCd) {
      this.lastDashTime = t; this.dashEndTime = t + 0.18;
    }
  }
  fireStrongBullet(enemies) {
    const t = now();
    if (t - this.lastStrongBulletTime >= this.strongBulletCd) {
      this.lastStrongBulletTime = t;
      const sb = new StrongBullet(this.x, this.y, this.angle);
      sb.ownerId = this.ownerId;
      const targets = this.pvpMode ? Object.values(game.remotePlayers || {}) : enemies;
      let best = null, bestD = Infinity;
      for (const e of targets) {
        if (!e.isAlive) continue;
        const d = Math.hypot(e.x - this.x, e.y - this.y);
        if (d < bestD) { bestD = d; best = e; }
      }
      if (best) {
        sb.angle = Math.atan2(best.y - this.y, best.x - this.x);
        sb.dx = Math.cos(sb.angle); sb.dy = Math.sin(sb.angle);
      }
      return sb;
    }
    return null;
  }
  fireRockets(enemies) {
    if (this.pvpMode) return [];
    const t = now();
    if (t - this.lastRocketTime >= this.rocketCd) {
      const alive = enemies.filter(e => e.isAlive);
      if (!alive.length) return [];
      this.lastRocketTime = t;
      const rockets = [];
      for (let i = 0; i < 5; i++) {
        const target = alive[i % alive.length];
        const spread = (i - 2) * 0.35;
        const off = this.angle + spread;
        rockets.push(new Rocket(this.x + Math.cos(off) * 14, this.y + Math.sin(off) * 14, target, 5.5, "#1a3a8a", false));
      }
      return rockets;
    }
    return [];
  }
  activateShield() {
    const t = now();
    if (!this.hasSkill("shield")) return;
    if (this.shieldHp > 0) return;
    if (t - this.shieldLastUsed < this.shieldCd) return;
    this.shieldHp = this.shieldMax;
  }
  tryArmStrike() {
    const t = now();
    if (!this.hasSkill("strike")) return;
    if (this.isStriking) return;
    if (t - this.strikeLastUsed < this.strikeCd) return;
    this.strikePending = true;
  }
  beginStrike(angle) {
    this.isStriking = true;
    this.strikePending = false;
    this.strikeDir = [Math.cos(angle), Math.sin(angle)];
    this.strikeLastUsed = now();
    this.strikeTrail = [];
  }
  startCrashBounce(fromX, fromY) {
    const dx = this.x - fromX, dy = this.y - fromY;
    const d = Math.hypot(dx, dy) || 1;
    this.x += (dx / d) * 120; this.y += (dy / d) * 120;
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  activateLockon() {
    if (this.pvpMode) return;
    const t = now();
    if (!this.hasSkill("lockon")) return;
    if (t - this.lockonLastUsed < this.lockonCd) return;
    this.lockonSelecting = true; this.lockonActive = false;
  }
  commitLockon() {
    this.lockonLastUsed = now();
    this.lockonSelecting = false; this.lockonActive = true;
    const expire = now() + 2;
    for (const c of this.lockonPath) {
      this.lockonCircles.push({ x: c.x, y: c.y, r: c.r, expire });
      for (const e of game.enemies) {
        if (e.isAlive && Math.hypot(e.x - c.x, e.y - c.y) < c.r + e.radius) this.lockonLocked.add(e);
      }
    }
    this.lockonPath = [];
  }
  updateLockon() {
    const t = now();
    this.lockonCircles = this.lockonCircles.filter(c => c.expire > t);
    for (const e of [...this.lockonLocked]) {
      if (!e.isAlive) this.lockonLocked.delete(e);
    }
  }
  getLockonTargets() {
    if (!this.lockonActive || this.pvpMode) return [];
    const alive = [];
    for (const e of this.lockonLocked) if (e.isAlive) alive.push(e);
    return alive;
  }
  activateFake() {
    if (this.pvpMode) return;
    const t = now();
    if (!this.hasSkill("fake")) return;
    if (this.fakeActive) return;
    if (t - this.fakeLastUsed < this.fakeCd) return;
    this.fakeActive = true; this.fakeStart = t; this.fakeAbsorbed = 0;
    this.fakeMode = Math.random() < 0.5 ? "follow" : "attack";
    this.fakeOrbPositions = [null, null]; this.fakeOrbTargets = [null, null];
    this.fakeOrbLastShoot = 0; this.damageTakenThisLife = 0;
  }
  activateHelp() {
    if (this.pvpMode) return;
    const t = now();
    if (!this.hasSkill("help")) return;
    if (this.helpActive) return;
    if (t - this.helpLastUsed < this.helpCd) return;
    this.helpActive = true; this.helpStart = t; this.helpers = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const hx = this.x + Math.cos(a) * 60;
      const hy = this.y + Math.sin(a) * 60;
      this.helpers.push(new Helper(hx, hy, [...this.equipped]));
    }
  }
  move(dx, dy, aimAngle) {
    if (!this.isAlive) return;
    if (this.isStriking) return;
    let speedMult = 1.0;
    if (this.pvpMode) speedMult = 1.3;
    const speed = this.baseSpeed * speedMult * (now() < this.dashEndTime ? 2.6 : 1.0);
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x + dx * speed));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y + dy * speed));
    this.angle = aimAngle;
  }
  updateStrike() {
    if (!this.isStriking) return;
    const speed = 22 * SPEED_MULT;
    this.angle = Math.atan2(this.strikeDir[1], this.strikeDir[0]);
    this.x += this.strikeDir[0] * speed; this.y += this.strikeDir[1] * speed;
    if (this.x < this.radius || this.x > W - this.radius ||
        this.y < this.radius || this.y > H - this.radius) {
      this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
      this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
      this.isStriking = false; this.strikeTrail = [];
    }
    for (const tr of this.strikeTrail) tr.life -= 0.03;
    this.strikeTrail = this.strikeTrail.filter(t => t.life > 0);
  }
  updateFake() {
    if (!this.fakeActive) return;
    if (this.pvpMode) { this.fakeActive = false; return; }
    const t = now();
    this.fakeOrbsAngle += 0.1;
    if (this.fakeMode === "attack") {
      for (let i = 0; i < 2; i++) {
        let pos = this.fakeOrbPositions[i];
        if (!pos) {
          pos = { x: this.x + Math.cos(this.fakeOrbsAngle + i * Math.PI) * (this.radius || 20),
                  y: this.y + Math.sin(this.fakeOrbsAngle + i * Math.PI) * (this.radius || 20) };
          this.fakeOrbPositions[i] = pos;
        }
        if (!this.fakeOrbTargets[i] || !this.fakeOrbTargets[i].isAlive) {
          const alive = game.enemies.filter(e => e.isAlive);
          this.fakeOrbTargets[i] = alive.length ? alive[Math.floor(Math.random() * alive.length)] : null;
        }
        const tgt = this.fakeOrbTargets[i];
        if (tgt) {
          const dx = tgt.x - pos.x, dy = tgt.y - pos.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d > 40) { pos.x += (dx / d) * 4.5; pos.y += (dy / d) * 4.5; }
        }
      }
      if (t - this.fakeOrbLastShoot > 0.5) {
        this.fakeOrbLastShoot = t;
        for (let i = 0; i < 2; i++) {
          const pos = this.fakeOrbPositions[i];
          const tgt = this.fakeOrbTargets[i];
          if (pos && tgt && tgt.isAlive) {
            const ang = Math.atan2(tgt.y - pos.y, tgt.x - pos.x);
            const b = new Bullet(pos.x, pos.y, ang, 11, 4, "#c77dff", false);
            b.fromHelper = true; b.damageMult = 0.5;
            game.redBullets.push(b);
            this.fakeOrbPositions[i] = {
              x: this.x + Math.cos(this.fakeOrbsAngle * 2 + i * Math.PI * 1.4) * 80,
              y: this.y + Math.sin(this.fakeOrbsAngle * 2 + i * Math.PI * 1.4) * 80,
            };
            this.fakeOrbTargets[i] = null;
          }
        }
      }
    }
    if (t - this.fakeStart >= this.fakeDuration) {
      const diff = game.difficultyKey;
      const mult = (diff === "master" || diff === "hell") ? 0.5 : 1.0;
      const heal = Math.floor(this.fakeAbsorbed * 1.5 * mult);
      this.hp = Math.min(this.maxHp, this.hp + heal);
      this.fakeActive = false; this.fakeLastUsed = t; this.fakeAbsorbed = 0;
      this.fakeOrbPositions = [null, null]; this.fakeOrbTargets = [null, null];
      this.takeMandatoryDamage(1);
    }
  }
  takeMandatoryDamage(n) { this.hp -= n; if (this.hp <= 0) { this.hp = 0; this.isAlive = false; } }
  takeDamage(n = 1) {
    if (this.isStriking) return;
    if (this.fakeActive && !this.pvpMode) { this.fakeAbsorbed += n; return; }
    if (this.shieldHp > 0) {
      const absorbed = Math.min(this.shieldHp, n);
      this.shieldHp -= absorbed; n -= absorbed;
      if (this.shieldHp <= 0) { this.shieldHp = 0; this.shieldLastUsed = now(); }
    }
    if (n <= 0) return;
    this.hp -= n; this.damageTakenThisLife += n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  onKill() {
    this.kills++;
    if (!this.pvpMode && this.kills % 25 === 0) this.hp = Math.min(this.maxHp, this.hp + 10);
  }
}

class Helper {
  constructor(x, y, equipped) {
    this.x = x; this.y = y; this.radius = 12;
    this.baseSpeed = 5.0 * SPEED_MULT; this.angle = 0;
    this.equipped = equipped; this.maxHp = 25; this.hp = 25; this.isAlive = true;
    this.lastShot = 0; this.lastRocket = 0; this.lastShield = -30; this.lastBeam = 0;
    this.shieldHp = 0;
    this.roamAngle = Math.random() * Math.PI * 2; this.roamTimer = 0;
    this.skillTimer = Math.random() * 2;
    this.isStriking = false; this.strikeDir = [1, 0];
  }
  takeDamage(n) {
    if (this.isStriking) return;
    if (this.shieldHp > 0) {
      const absorbed = Math.min(this.shieldHp, n);
      this.shieldHp -= absorbed; n -= absorbed;
      if (this.shieldHp < 0) this.shieldHp = 0;
    }
    if (n <= 0) return;
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  update(target, enemies, redBullets, redRockets) {
    if (!this.isAlive || !target.isAlive) return;
    const t = now();
    this.roamTimer -= 0.016;
    if (this.roamTimer <= 0) { this.roamAngle = Math.random() * Math.PI * 2; this.roamTimer = 1 + Math.random() * 2; }
    const orbitX = target.x + Math.cos(this.roamAngle) * 140;
    const orbitY = target.y + Math.sin(this.roamAngle) * 140;
    const ox = orbitX - this.x, oy = orbitY - this.y;
    const od = Math.hypot(ox, oy) || 1;
    if (od > 20) { this.x += (ox / od) * this.baseSpeed; this.y += (oy / od) * this.baseSpeed; }
    let best = null, bestD = Infinity;
    for (const e of enemies) {
      if (!e.isAlive) continue;
      const ed = Math.hypot(e.x - this.x, e.y - this.y);
      if (ed < bestD) { bestD = ed; best = e; }
    }
    if (best) this.angle = Math.atan2(best.y - this.y, best.x - this.x);
    if (t - this.lastShot > 0.15) {
      this.lastShot = t;
      const b = new Bullet(this.x, this.y, this.angle, 11, 4, "#bbbbbb", false);
      b.fromHelper = true; b.damageMult = 0.5;
      redBullets.push(b);
    }
    this.skillTimer -= 0.016;
    if (this.skillTimer <= 0) {
      this.skillTimer = 2 + Math.random() * 3;
      const chosen = ["rocket", "beam", "shield", "dash"];
      const pick = chosen[Math.floor(Math.random() * chosen.length)];
      if (pick === "rocket" && t - this.lastRocket > 4 && best) {
        this.lastRocket = t;
        const r = new Rocket(this.x, this.y, best, 5.0, "#88aaff", true);
        r.damage = 0.5; redRockets.push(r);
      } else if (pick === "beam" && t - this.lastBeam > 6 && best) {
        this.lastBeam = t;
        const sb = new StrongBullet(this.x, this.y, this.angle);
        sb.fromHelper = true; sb.speed = 17 * SPEED_MULT * 0.7;
        game.redStrongBullets.push(sb);
      } else if (pick === "shield" && this.shieldHp <= 0 && t - this.lastShield > 30) {
        this.shieldHp = 5; this.lastShield = t;
      } else if (pick === "dash") {
        this.x += Math.cos(this.angle) * 30; this.y += Math.sin(this.angle) * 30;
      }
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    if (this.shieldHp > 0) {
      ctx.strokeStyle = "#06d6a0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2); ctx.stroke();
    }
    drawTri(this.x, this.y, this.radius, this.angle, "#888888");
    drawHpBar(this.x, this.y, this.hp, this.maxHp, "#bbbbbb");
  }
}

class YellowTriangle {
  constructor(x, y, hp = 77) {
    this.x = x; this.y = y; this.radius = 22;
    this.baseSpeed = 8.5 * SPEED_MULT; this.angle = 0;
    this.maxHp = hp; this.hp = hp; this.isAlive = true;
    this.preferredDistance = 260;
    this.attackMode = "aim"; this.modeTimer = 0; this.aimDuration = 0.3;
    this.rapidShootTimer = 0; this.rapidShootInterval = 0.1; this.rapidDuration = 3.0;
    this.rapidShootStarted = 0;
    this.powerChargeStart = 0; this.powerChargeDuration = 1.0; this.powerShootDone = false;
    this.isCharging = false; this.isDashing = false; this.chargeStart = 0;
    this.dashDir = [0, 0]; this.dashTravelled = 0; this.dashMaxDist = 0; this.dashHitDone = false;
    this.crashCooldownUntil = 0; this.trail = [];
    this.isDodging = false; this.dodgeDir = [0, 0]; this.dodgeStart = 0;
    this.dodgeDuration = 0.35; this.dodgeCooldown = 0;
    this.aimedAtDuration = 0; this.beingAimedAt = false;
    this.speedBoostUntil = 0; this.sidestepCooldown = 0; this.canShoot = true;
  }
  takeDamage(n = 1) { this.hp -= n; if (this.hp <= 0) { this.hp = 0; this.isAlive = false; } }
  tryDodge(threatX, threatY) {
    const t = now();
    if (t < this.dodgeCooldown) return false;
    if (this.isDodging || this.isDashing || this.isCharging) return false;
    const dx = this.x - threatX, dy = this.y - threatY;
