<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Triangle Battle Arena</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #0b0c10; color: #eee; font-family: Arial, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const now = () => performance.now() / 1000;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rand = (lo, hi) => lo + Math.random() * (hi - lo);

function drawTriangle(x, y, r, angle, color) {
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = angle + i * Math.PI * 2 / 3 - Math.PI / 2;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawBar(x, y, hp, maxHp, color = "#06d6a0") {
  const w = 42, h = 5;
  ctx.fillStyle = "#333";
  ctx.fillRect(x - w / 2, y - 31, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x - w / 2, y - 31, w * clamp(hp / Math.max(1, maxHp), 0, 1), h);
}

const DIFFICULTIES = {
  news:     { name: "NEWS",     hp: 20, yellow: 0, purple: 3, green: 2 },
  battlers: { name: "BATTLERS", hp: 60, yellow: 1, purple: 4, green: 2 },
  master:   { name: "MASTER",   hp: 30, yellow: 2, purple: 0, green: 3 },
  hell:     { name: "HELL",     hp: 20, yellow: 4, purple: 0, green: 0 }
};

const SKILLS = {
  shield: { name: "SHIELD", cost: 300 },
  strike: { name: "STRIKE", cost: 500 },
  lockon: { name: "LOCKON", cost: 100 },
  fake:   { name: "FAKE", cost: 400 },
  help:   { name: "HELP", cost: 600 }
};

class PeerLink {
  constructor(game) {
    this.game = game;
    this.peer = null;
    this.conn = null;
    this.isHost = false;
    this.roomCode = "";
  }

  close() {
    try { this.conn?.close(); } catch (_) {}
    try { this.peer?.destroy(); } catch (_) {}
    this.conn = null;
    this.peer = null;
    this.roomCode = "";
  }

  host() {
    return new Promise((resolve, reject) => {
      this.close();
      if (typeof Peer === "undefined") {
        reject(new Error("PeerJS 未加载"));
        return;
      }

      this.peer = new Peer();
      this.isHost = true;

      this.peer.on("open", id => {
        this.roomCode = id;
        resolve(id);
      });

      this.peer.on("connection", conn => {
        if (this.conn && this.conn.open) {
          conn.close();
          return;
        }
        this.attach(conn);
      });

      this.peer.on("error", reject);
    });
  }

  join(code) {
    return new Promise((resolve, reject) => {
      this.close();
      if (typeof Peer === "undefined") {
        reject(new Error("PeerJS 未加载"));
        return;
      }

      let settled = false;
      this.peer = new Peer();
      this.isHost = false;

      const fail = err => {
        if (settled) return;
        settled = true;
        this.close();
        reject(err instanceof Error ? err : new Error(String(err)));
      };

      this.peer.on("open", () => {
        const conn = this.peer.connect(code, { reliable: true });
        this.conn = conn;

        conn.on("open", () => {
          if (settled) return;
          settled = true;
          this.roomCode = code;
          this.attach(conn);
          resolve();
        });

        conn.on("error", fail);
        conn.on("close", () => {
          if (!settled) fail(new Error("连接已关闭"));
          else this.game.onDisconnected();
        });
      });

      this.peer.on("error", fail);
      setTimeout(() => {
        if (!settled) fail(new Error("连接超时"));
      }, 15000);
    });
  }

  attach(conn) {
    this.conn = conn;
    conn.on("data", msg => this.game.onMessage(msg));
    conn.on("close", () => this.game.onDisconnected());
  }

  send(msg) {
    if (this.conn?.open) {
      try { this.conn.send(msg); } catch (_) {}
    }
  }
}

class Game {
  constructor() {
    this.net = new PeerLink(this);

    this.state = "menu";
    this.device = "computer";
    this.touchMode = false;
    this.mode = "solo"; // solo | coop | pvp
    this.diffKey = "battlers";
    this.roomCode = "";
    this.status = "";

    this.players = {};
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];
    this.buttons = [];
    this.keys = {};
    this.mouse = { x: W / 2, y: H / 2, down: false };
    this.joy = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };

    this.lastShot = 0;
    this.lastRocket = 0;
    this.lastStateSend = 0;
    this.lastSnapshot = 0;
    this.lastSpawn = 0;
    this.score = 0;
    this.kills = 0;

    this.owned = {};
    this.equipped = [];
    this.returnFromShop = "difficulty";
    this.bindInput();
  }

  get myId() {
    return this.net.peer?.id || "local";
  }

  get player() {
    return this.players[this.myId] || null;
  }

  bindInput() {
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      const p = this.pointerPos(e);

      if (this.state !== "playing") {
        this.handleClick(p.x, p.y);
        return;
      }

      if (this.touchMode) {
        if (p.x < W / 2) {
          this.joy.active = true;
          this.joy.id = e.pointerId;
          this.joy.x = p.x;
          this.joy.y = p.y;
          this.joy.dx = 0;
          this.joy.dy = 0;
        } else {
          this.mouse.x = p.x;
          this.mouse.y = p.y;
          this.mouse.down = true;
        }
      } else {
        this.mouse.x = p.x;
        this.mouse.y = p.y;
        this.mouse.down = true;
      }
    }, { passive: false });

    canvas.addEventListener("pointermove", e => {
      const p = this.pointerPos(e);
      this.mouse.x = p.x;
      this.mouse.y = p.y;

      if (this.joy.active && this.joy.id === e.pointerId) {
        const dx = p.x - this.joy.x;
        const dy = p.y - this.joy.y;
        const n = Math.hypot(dx, dy) || 1;
        const max = Math.min(W, H) * 0.13;
        const scale = Math.min(1, max / n);
        this.joy.dx = dx / n * scale;
        this.joy.dy = dy / n * scale;
      }
    });

    const endPointer = e => {
      if (this.joy.id === e.pointerId) {
        this.joy.active = false;
        this.joy.id = null;
        this.joy.dx = 0;
        this.joy.dy = 0;
      }
      this.mouse.down = false;
    };

    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);

    window.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      this.keys[k] = true;

      if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
        e.preventDefault();
      }

      if (k === "escape") {
        if (this.state === "playing") this.leaveMatch();
        else if (this.state === "room") this.leaveRoom();
      }

      if (this.state === "playing" && this.player?.alive) {
        if (k === "q") this.activateShield(this.player);
        if (k === "e") this.fireRocket(this.player);
        if (k === "f") this.activateStrike(this.player);
        if (k === "c") this.fireStrongBullet(this.player);
      }
    });

    window.addEventListener("keyup", e => {
      this.keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener("contextmenu", e => e.preventDefault());
  }

  pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  addButton(x, y, w, h, label, action, color = "#00fff5") {
    this.buttons.push({ x, y, w, h, action });
    ctx.fillStyle = "#171827";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  handleClick(x, y) {
    for (const b of this.buttons) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.action();
        return;
      }
    }
  }

  async createRoom() {
    this.status = "正在创建房间…";
    try {
      this.roomCode = await this.net.host();
      this.state = "room";
      this.status = "房间已创建，把房间号发给朋友。";
    } catch (e) {
      this.status = "创建失败：" + (e.message || e);
    }
  }

  async joinRoom() {
    const code = prompt("请输入房间号：");
    if (!code?.trim()) return;

    this.status = "正在连接…";
    try {
      await this.net.join(code.trim());
      this.roomCode = code.trim();
      this.state = "room";
      this.status = "已连接，等待房主开始。";
    } catch (e) {
      this.status = "加入失败：" + (e.message || e);
    }
  }

  onDisconnected() {
    if (this.state === "playing") {
      this.status = "连接中断";
      this.state = "gameover";
    } else {
      this.status = "连接已断开";
    }
  }

  onMessage(msg) {
    if (!msg || typeof msg.type !== "string") return;

    if (msg.type === "start") {
      if (!DIFFICULTIES[msg.diff]) return;
      this.startMatch(msg.mode, msg.diff, false);
      return;
    }

    if (msg.type === "input") {
      if (!this.net.isHost || this.state !== "playing") return;
      const p = this.players[msg.id];
      if (!p || !p.alive) return;

      p.input = {
        dx: clamp(Number(msg.dx) || 0, -1, 1),
        dy: clamp(Number(msg.dy) || 0, -1, 1),
        angle: Number.isFinite(msg.angle) ? msg.angle : p.angle,
        firing: !!msg.firing,
        rocket: !!msg.rocket,
        shield: !!msg.shield,
        strike: !!msg.strike,
        strong: !!msg.strong
      };
      return;
    }

    if (msg.type === "snapshot") {
      if (this.net.isHost || this.state !== "playing") return;
      this.applySnapshot(msg.snapshot);
      return;
    }

    if (msg.type === "back") {
      if (this.net.isHost && this.state === "playing") this.endMatch();
      return;
    }

    if (msg.type === "start-request") {
      if (!this.net.isHost || this.state !== "room") return;
      this.startMatch(msg.mode || "coop", msg.diff || "battlers", true);
    }
  }

  serializeSnapshot() {
    return {
      mode: this.mode,
      score: this.score,
      players: Object.fromEntries(Object.entries(this.players).map(([id, p]) => [
        id, {
          x: p.x, y: p.y, angle: p.angle,
          hp: p.hp, maxHp: p.maxHp, alive: p.alive,
          name: p.name, shield: p.shield > 0
        }
      ])),
      enemies: this.enemies.map(e => ({
        kind: e.kind, x: e.x, y: e.y, angle: e.angle,
        hp: e.hp, maxHp: e.maxHp, radius: e.radius
      })),
      bullets: this.bullets.map(b => ({
        x: b.x, y: b.y, angle: b.angle,
        color: b.color, radius: b.radius
      })),
      rockets: this.rockets.map(r => ({
        x: r.x, y: r.y, angle: r.angle,
        color: r.color
      }))
    };
  }

  applySnapshot(s) {
    if (!s || typeof s !== "object") return;
    this.mode = s.mode || this.mode;
    this.score = Number(s.score) || 0;

    if (s.players && typeof s.players === "object") {
      for (const [id, p] of Object.entries(s.players)) {
        if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) continue;
        this.players[id] = { ...p, input: {} };
      }
    }

    this.enemies = Array.isArray(s.enemies) ? s.enemies : [];
    this.bullets = Array.isArray(s.bullets) ? s.bullets : [];
    this.rockets = Array.isArray(s.rockets) ? s.rockets : [];
  }

  startMatch(mode, diff, broadcast) {
    this.mode = mode;
    this.diffKey = diff;
    this.state = "playing";
    this.score = 0;
    this.kills = 0;
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];

    const localId = this.myId;
    const hp = mode === "pvp" ? 30 : DIFFICULTIES[diff].hp;
    this.players = {};

    this.players[localId] = this.makePlayer(localId, hp, this.net.isHost ? W * 0.25 : W * 0.75);

    if (this.net.isHost && this.net.conn?.open) {
      const opponentId = this.net.conn.peer;
      this.players[opponentId] = this.makePlayer(opponentId, hp, W * 0.75);
    }

    if (this.net.isHost || mode === "solo") this.spawnInitialEnemies();

    if (broadcast && this.net.isHost) {
      this.net.send({ type: "start", mode, diff });
    }

    this.status = "";
  }

  makePlayer(id, hp, x) {
    return {
      id, name: id === this.myId ? "You" : "Opponent",
      x: clamp(x, 30, W - 30), y: H / 2,
      angle: id === this.myId ? 0 : Math.PI,
      radius: 18, hp, maxHp: hp, alive: true,
      speed: 5, shield: 0, shieldUntil: 0,
      shieldCooldownUntil: 0, strikeUntil: 0,
      strongCooldownUntil: 0, rocketCooldownUntil: 0,
      input: { dx: 0, dy: 0, angle: 0, firing: false }
    };
  }

  spawnInitialEnemies() {
    if (this.mode === "pvp") return;
    const d = DIFFICULTIES[this.diffKey];
    for (let i = 0; i < d.yellow; i++) this.enemies.push(this.makeEnemy("yellow"));
    for (let i = 0; i < d.purple; i++) this.enemies.push(this.makeEnemy("purple"));
    for (let i = 0; i < d.green; i++) this.enemies.push(this.makeEnemy("green"));
  }

  makeEnemy(kind) {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = rand(30, W - 30); y = 25; }
    else if (edge === 1) { x = rand(30, W - 30); y = H - 25; }
    else if (edge === 2) { x = 25; y = rand(30, H - 30); }
    else { x = W - 25; y = rand(30, H - 30); }

    const stats = {
      yellow: { hp: 12, radius: 21, speed: 2.0, color: "#f9d56e" },
      purple: { hp: 6, radius: 20, speed: 1.8, color: "#9d4edd" },
      green: { hp: 8, radius: 18, speed: 2.2, color: "#06d6a0" }
    }[kind];

    return {
      kind, x, y, angle: 0, hp: stats.hp, maxHp: stats.hp,
      radius: stats.radius, speed: stats.speed, color: stats.color,
      shotAt: now() + rand(1, 3)
    };
  }

  activePlayers() {
    return Object.values(this.players).filter(p => p.alive);
  }

  targetFor(enemy) {
    const candidates = this.activePlayers();
    if (!candidates.length) return null;
    candidates.sort((a, b) => dist(enemy, a) - dist(enemy, b));
    return candidates[0];
  }

  damagePlayer(p, amount) {
    if (!p?.alive) return;
    if (p.shield > 0) {
      const blocked = Math.min(amount, p.shield);
      p.shield -= blocked;
      amount -= blocked;
    }
    if (amount <= 0) return;
    p.hp -= amount;
    if (p.hp <= 0) {
      p.hp = 0;
      p.alive = false;
    }
  }

  activateShield(p) {
    if (!p || !p.alive || time() < p.shieldCooldownUntil || p.shield > 0) return;
    p.shield = 10;
    p.shieldUntil = time() + 3;
    p.shieldCooldownUntil = time() + 15;
  }

  activateStrike(p) {
    if (!p?.alive || time() < p.strikeUntil) return;
    p.strikeUntil = time() + 1.2;
    p.x = clamp(p.x + Math.cos(p.angle) * 100, p.radius, W - p.radius);
    p.y = clamp(p.y + Math.sin(p.angle) * 100, p.radius, H - p.radius);

    if (this.net.isHost || this.mode === "solo") {
      for (const e of this.enemies) {
        if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 40) e.hp -= 5;
      }
    }

    if (this.mode === "pvp") {
      const opponent = Object.values(this.players).find(q => q.id !== p.id && q.alive);
      if (opponent && dist(p, opponent) < 55) this.damagePlayer(opponent, 5);
    }
  }

  fireStrongBullet(p) {
    if (!p?.alive || time() < p.strongCooldownUntil) return;
    p.strongCooldownUntil = time() + 5;
    this.spawnPlayerBullet(p, true);
  }

  fireRocket(p) {
    if (!p?.alive || time() < p.rocketCooldownUntil) return;
    p.rocketCooldownUntil = time() + 3;

    const target = this.mode === "pvp"
      ? Object.values(this.players).find(q => q.id !== p.id && q.alive)
      : this.enemies.filter(e => e.hp > 0).sort((a, b) => dist(p, a) - dist(p, b))[0];

    if (!target) return;
    this.rockets.push({
      x: p.x, y: p.y,
      angle: Math.atan2(target.y - p.y, target.x - p.x),
      speed: 8, radius: 8, damage: 3, owner: p.id,
      color: "#88aaff", life: 2
    });
  }

  spawnPlayerBullet(p, strong = false) {
    this.bullets.push({
      x: p.x + Math.cos(p.angle) * 22,
      y: p.y + Math.sin(p.angle) * 22,
      angle: p.angle,
      speed: strong ? 12 : 10,
      radius: strong ? 8 : 5,
      damage: strong ? 3 : 1,
      owner: p.id,
      enemy: false,
      color: strong ? "#ff2e63" : "#00fff5",
      life: 2
    });
  }

  readLocalInput() {
    let dx = 0, dy = 0;
    if (this.touchMode) {
      dx = this.joy.dx;
      dy = this.joy.dy;
    } else {
      if (this.keys.w || this.keys.arrowup) dy--;
      if (this.keys.s || this.keys.arrowdown) dy++;
      if (this.keys.a || this.keys.arrowleft) dx--;
      if (this.keys.d || this.keys.arrowright) dx++;
    }

    const n = Math.hypot(dx, dy);
    if (n > 1) { dx /= n; dy /= n; }

    const p = this.player;
    const angle = p
      ? Math.atan2(this.mouse.y - p.y, this.mouse.x - p.x)
      : 0;

    return {
      dx, dy, angle,
      firing: this.mouse.down,
      rocket: false, shield: false, strike: false, strong: false
    };
  }

  updateLocalPlayer() {
    const p = this.player;
    if (!p?.alive) return;

    const input = this.readLocalInput();
    const t = time();

    if (this.net.isHost || this.mode === "solo") {
      p.input = input;
      this.performInputActions(p, input);
    } else {
      if (t - this.lastStateSend > 0.04) {
        this.lastStateSend = t;
        this.net.send({ type: "input", id: this.myId, ...input });
      }
    }
  }

  performInputActions(p, input) {
    p.angle = input.angle;
    const speed = p.speed * (time() < p.strikeUntil ? 1.4 : 1);
    p.x = clamp(p.x + input.dx * speed, p.radius, W - p.radius);
    p.y = clamp(p.y + input.dy * speed, p.radius, H - p.radius);

    if (input.firing && time() - (p.lastShot || 0) > 0.12) {
      p.lastShot = time();
      this.spawnPlayerBullet(p);
    }

    if (time() < (input.rocketUntil || 0)) this.fireRocket(p);
    if (time() < (input.shieldUntil || 0)) this.activateShield(p);
    if (time() < (input.strikeUntil || 0)) this.activateStrike(p);
    if (time() < (input.strongUntil || 0)) this.fireStrongBullet(p);

    if (p.shield > 0 && time() > p.shieldUntil) p.shield = 0;
  }

  updateHost() {
    if (!this.net.isHost && this.mode !== "solo") return;

    const t = time();

    for (const p of Object.values(this.players)) {
      if (!p.alive) continue;

      if (p.id !== this.myId && p.input) {
        this.performInputActions(p, p.input);
        p.input.rocket = false;
        p.input.shield = false;
        p.input.strike = false;
        p.input.strong = false;
      }
    }

    if (this.mode !== "pvp") {
      if (t - this.lastSpawn > 5 && this.enemies.length < 12) {
        this.lastSpawn = t;
        this.enemies.push(this.makeEnemy(
          this.diffKey === "hell" || this.diffKey === "master"
            ? "yellow"
            : ["yellow", "purple", "green"][Math.floor(Math.random() * 3)]
        ));
      }

      for (const e of this.enemies) {
        const target = this.targetFor(e);
        if (!target) break;

        const angle = Math.atan2(target.y - e.y, target.x - e.x);
        e.angle = angle;

        const d = dist(e, target);
        if (d > 150) {
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;
        } else {
          e.x -= Math.cos(angle) * e.speed * 0.35;
          e.y -= Math.sin(angle) * e.speed * 0.35;
        }

        if (e.kind !== "yellow" && t >= e.shotAt) {
          e.shotAt = t + (e.kind === "green" ? 1.8 : 1.2);
          this.bullets.push({
            x: e.x, y: e.y, angle,
            speed: 6, radius: 5, damage: 1, owner: "enemy",
            enemy: true, color: e.kind === "green" ? "#1a3a8a" : "#c77dff",
            life: 3
          });
        }
      }
    }

    for (const b of this.bullets) {
      b.x += Math.cos(b.angle) * b.speed;
      b.y += Math.sin(b.angle) * b.speed;
      b.life -= 1 / 60;

      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        b.dead = true;
        continue;
      }

      if (this.mode === "pvp" && !b.enemy) {
        for (const p of Object.values(this.players)) {
          if (!p.alive || p.id === b.owner) continue;
          if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.radius) {
            this.damagePlayer(p, b.damage);
            b.dead = true;
            break;
          }
        }
      } else if (b.enemy) {
        for (const p of Object.values(this.players)) {
          if (!p.alive) continue;
          if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.radius) {
            this.damagePlayer(p, b.damage);
            b.dead = true;
            break;
          }
        }
      } else {
        for (const e of this.enemies) {
          if (e.hp <= 0) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
            e.hp -= b.damage;
            b.dead = true;
            if (e.hp <= 0) {
              this.score += 100;
              this.kills++;
            }
            break;
          }
        }
      }
    }

    this.bullets = this.bullets.filter(b => !b.dead);
    this.enemies = this.enemies.filter(e => e.hp > 0);

    for (const r of this.rockets) {
      r.x += Math.cos(r.angle) * r.speed;
      r.y += Math.sin(r.angle) * r.speed;
      r.life -= 1 / 60;

      if (r.life <= 0 || r.x < 0 || r.x > W || r.y < 0 || r.y > H) {
        r.dead = true;
        continue;
      }

      const targets = this.mode === "pvp"
        ? Object.values(this.players).filter(p => p.alive && p.id !== r.owner)
        : this.enemies;

      for (const target of targets) {
        if ((target.hp ?? target.hp) <= 0) continue;
        if (Math.hypot(target.x - r.x, target.y - r.y) < (target.radius || 20) + r.radius) {
          if (this.mode === "pvp") this.damagePlayer(target, r.damage);
          else target.hp -= r.damage;
          r.dead = true;
          break;
        }
      }
    }
    this.rockets = this.rockets.filter(r => !r.dead);

    const active = this.activePlayers();
    if (!active.length) {
      this.endMatch();
      return;
    }

    if (this.mode === "pvp") {
      const living = Object.values(this.players).filter(p => p.alive);
      if (living.length <= 1) this.endMatch();
    }

    if (t - this.lastSnapshot > 0.05) {
      this.lastSnapshot = t;
      this.net.send({ type: "snapshot", snapshot: this.serializeSnapshot() });
    }
  }

  update() {
    if (this.state !== "playing") return;

    this.updateLocalPlayer();
    this.updateHost();

    // In solo mode the host simulation above must also run.
    if (this.mode === "solo" && this.player?.alive === false) this.endMatch();
  }

  startSolo(diff) {
    this.net.close();
    this.net.isHost = true;
    this.mode = "solo";
    this.diffKey = diff;
    this.state = "playing";
    this.players = {};
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];
    this.score = 0;
    this.kills = 0;

    const p = this.makePlayer("local", DIFFICULTIES[diff].hp, W * 0.25);
    this.players.local = p;
    this.spawnInitialEnemies();

  requestStart(mode) {
    if (this.net.isHost) {

  endMatch() {
    if (this.state !== "playing") return;
    this.state = this.mode === "solo" ? "gameover" : "gameover";
  }

  leaveMatch() {
    if (this.mode !== "solo") this.net.send({ type: "back" });

  }

const game = new Game();

const originalUpdateHost = game.updateHost.bind(game);
game.updateHost = function() {
  if (!this.net.isHost && this.mode !== "solo") return;

  // Apply host/local player input.
  for (const p of Object.values(this.players)) {
    if (!p.alive) continue;

    if (p.id === this.myId || this.mode === "solo") {
      const input = this.readLocalInput();
      this.performInputActions(p, input);
      p.input = input;
    } else if (p.input) {
      this.performInputActions(p, p.input);
    }
  }

  const t = now();

  if (this.mode !== "pvp") {
    if (t - this.lastSpawn > 5 && this.enemies.length < 12) {
      this.lastSpawn = t;
      const kinds = ["yellow", "purple", "green"];
      const kind = this.diffKey === "hell" || this.diffKey === "master"
        ? "yellow"
        : kinds[Math.floor(Math.random() * kinds.length)];
      this.enemies.push(this.makeEnemy(kind));
    }

    for (const e of this.enemies) {
      const target = this.targetFor(e);
      if (!target) continue;

      const angle = Math.atan2(target.y - e.y, target.x - e.x);
      e.angle = angle;
      const d = dist(e, target);

      if (d > 150) {
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
      } else {
        e.x -= Math.cos(angle) * e.speed * 0.35;
        e.y -= Math.sin(angle) * e.speed * 0.35;
      }

      if (e.kind !== "yellow" && t >= e.shotAt) {
        e.shotAt = t + (e.kind === "green" ? 1.8 : 1.2);
        this.bullets.push({
          x: e.x, y: e.y, angle, speed: 6, radius: 5,
          damage: 1, owner: "enemy", enemy: true,
          color: e.kind === "green" ? "#1a3a8a" : "#c77dff", life: 3
        });
      }
    }
  }

  for (const b of this.bullets) {
    b.x += Math.cos(b.angle) * b.speed;
    b.y += Math.sin(b.angle) * b.speed;
    b.life -= 1 / 60;

    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      b.dead = true;
      continue;
    }

    if (this.mode === "pvp" && !b.enemy) {
      for (const p of Object.values(this.players)) {
        if (!p.alive || p.id === b.owner) continue;
        if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.radius) {
          this.damagePlayer(p, b.damage);
          b.dead = true;
          break;
        }
      }
    } else if (b.enemy) {
      for (const p of Object.values(this.players)) {
        if (!p.alive) continue;
        if (Math.hypot(p.x - b.x, p.y - b.y) < p.radius + b.radius) {
          this.damagePlayer(p, b.damage);
          b.dead = true;
          break;
        }
      }
    } else {
      for (const e of this.enemies) {
        if (e.hp <= 0) continue;
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
          e.hp -= b.damage;
          b.dead = true;
          if (e.hp <= 0) {
            this.score += 100;
            this.kills++;
          }
          break;
        }
      }
    }
  }

  this.bullets = this.bullets.filter(b => !b.dead);
  this.enemies = this.enemies.filter(e => e.hp > 0);

  for (const r of this.rockets) {
    r.x += Math.cos(r.angle) * r.speed;
    r.y += Math.sin(r.angle) * r.speed;
    r.life -= 1 / 60;

    if (r.life <= 0 || r.x < 0 || r.x > W || r.y < 0 || r.y > H) {
      r.dead = true;
      continue;
    }

    const targets = this.mode === "pvp"
      ? Object.values(this.players).filter(p => p.alive && p.id !== r.owner)
      : this.enemies;

    for (const target of targets) {
      if (target.hp <= 0) continue;
      if (Math.hypot(target.x - r.x, target.y - r.y) < (target.radius || 20) + r.radius) {
        if (this.mode === "pvp") this.damagePlayer(target, r.damage);
        else target.hp -= r.damage;
        r.dead = true;
        break;
      }
    }
  }
  this.rockets = this.rockets.filter(r => !r.dead);

  if (!this.activePlayers().length) {
    this.endMatch();
    return;
  }

  if (this.mode === "pvp" &&
      Object.values(this.players).filter(p => p.alive).length <= 1) {
    this.endMatch();
    return;
  }

  if (t - this.lastSnapshot > 0.05) {
    this.lastSnapshot = t;
    this.net.send({ type: "snapshot", snapshot: this.serializeSnapshot() });
  }
};

game.update = function() {
  if (this.state !== "playing") return;

  if (this.net.isHost || this.mode === "solo") {
    this.updateHost();
  } else {
    // Guests send controls; host performs the shared simulation.
    const input = this.readLocalInput();
    const t = now();
    if (t - this.lastStateSend > 0.04) {
      this.lastStateSend = t;
      this.net.send({
        type: "input",
        id: this.myId,
        dx: input.dx,
        dy: input.dy,
        angle: input.angle,
        firing: input.firing
      });
    }
  }

  if (this.player && !this.player.alive && this.state === "playing") {
    this.endMatch();
  }
};

game.onMessage = function(msg) {
  if (!msg || typeof msg.type !== "string") return;

  if (msg.type === "start") {
    if (!DIFFICULTIES[msg.diff]) return;
    this.startMatch(msg.mode, msg.diff, false);
    return;
  }

  if (msg.type === "start-request") {
    if (this.net.isHost && this.state === "room") {
      this.startMatch(msg.mode || "coop", msg.diff || "battlers", true);
    }
    return;
  }

  if (msg.type === "input") {
    if (!this.net.isHost || this.state !== "playing") return;
    const p = this.players[msg.id];
    if (!p || !p.alive) return;
    p.input = {
      dx: clamp(Number(msg.dx) || 0, -1, 1),
      dy: clamp(Number(msg.dy) || 0, -1, 1),
      angle: Number.isFinite(msg.angle) ? msg.angle : p.angle,
      firing: Boolean(msg.firing)
    };
    return;
  }

  if (msg.type === "snapshot") {
    if (!this.net.isHost && this.state === "playing") {
      this.applySnapshot(msg.snapshot);
    }
  }
};

game.startMatch = function(mode, diff, broadcast) {
  this.mode = mode;
  this.diffKey = diff;
  this.state = "playing";
  this.score = 0;
  this.kills = 0;
  this.enemies = [];
  this.bullets = [];
  this.rockets = [];
  this.players = {};

  const hp = mode === "pvp" ? 30 : DIFFICULTIES[diff].hp;
  const localX = this.net.isHost ? W * 0.25 : W * 0.75;
  this.players[this.myId] = this.makePlayer(this.myId, hp, localX);

  if (this.net.isHost && this.net.conn?.open) {
    const otherId = this.net.conn.peer;
    this.players[otherId] = this.makePlayer(otherId, hp, W * 0.75);
  }

  if (mode !== "pvp" && (this.net.isHost || mode === "solo")) {
    this.spawnInitialEnemies();
  }

  if (broadcast && this.net.isHost) {
    this.net.send({ type: "start", mode, diff });
  }
};

game.requestStart = function(mode) {
  if (this.net.isHost) {
    this.startMatch(mode, mode === "pvp" ? "master" : "battlers", true);
  } else {
    this.net.send({ type: "start-request", mode, diff: "battlers" });
  }
};

game.performInputActions = function(p, input) {
  p.angle = input.angle;
  p.x = clamp(p.x + input.dx * p.speed, p.radius, W - p.radius);
  p.y = clamp(p.y + input.dy * p.speed, p.radius, H - p.radius);

  if (input.firing && time() - (p.lastShot || 0) > 0.12) {
    p.lastShot = time();
    this.spawnPlayerBullet(p);
  }

  if (p.shieldRequest) {
    p.shieldRequest = false;
    this.activateShield(p);
  }
  if (p.strikeRequest) {
    p.strikeRequest = false;
    this.activateStrike(p);
  }
  if (p.strongRequest) {
    p.strongRequest = false;
    this.fireStrongBullet(p);
  }
  if (p.rocketRequest) {
    p.rocketRequest = false;
    this.fireRocket(p);
  }

  if (p.shield > 0 && time() > p.shieldUntil) p.shield = 0;
};

game.readLocalInput = function() {
  let dx = 0, dy = 0;
  if (this.touchMode) {
    dx = this.joy.dx;
    dy = this.joy.dy;
  } else {
    if (this.keys.w || this.keys.arrowup) dy--;
    if (this.keys.s || this.keys.arrowdown) dy++;
    if (this.keys.a || this.keys.arrowleft) dx--;
    if (this.keys.d || this.keys.arrowright) dx++;
  }

  const length = Math.hypot(dx, dy);
  if (length > 1) { dx /= length; dy /= length; }

  const p = this.player;
  return {
    dx, dy,
    angle: p ? Math.atan2(this.mouse.y - p.y, this.mouse.x - p.x) : 0,
    firing: !!this.mouse.down
  };
};

game.keyRequest = function(key) {
  const p = this.player;
  if (!p?.alive) return;

  if (key === "q") p.shieldRequest = true;
  if (key === "e") p.rocketRequest = true;
  if (key === "f") p.strikeRequest = true;
  if (key === "c") p.strongRequest = true;

  if (this.net.isHost || this.mode === "solo") {
    this.performInputActions(p, { ...this.readLocalInput(), firing: false });
  } else {
    const input = this.readLocalInput();
    this.net.send({
      type: "input", id: this.myId, ...input,
      shield: key === "q", rocket: key === "e",
      strike: key === "f", strong: key === "c"
    });
  }
};

const previousKeydown = window.onkeydown;
window.onkeydown = previousKeydown;

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["q", "e", "f", "c"].includes(k) && game.state === "playing") {
    game.keyRequest(k);
  }
});

game.leaveMatch = function() {
  if (this.mode !== "solo") this.net.send({ type: "back" });
  this.players = {};
  this.enemies = [];
  this.bullets = [];
  this.rockets = [];
  this.state = this.mode === "solo" ? "difficulty" : "room";
};

game.endMatch = function() {
  if (this.state === "playing") this.state = "gameover";
};

game.drawRoom = function() {
  this.buttons = [];
  ctx.textAlign = "center";
  ctx.fillStyle = "#00fff5";
  ctx.font = "bold 26px Arial";
  ctx.fillText("联机房间", W / 2, 55);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px monospace";
  ctx.fillText(this.roomCode || "连接中…", W / 2, 86);
  ctx.fillStyle = "#aaa";
  ctx.font = "13px Arial";
  ctx.fillText(this.status, W / 2, 112);
  ctx.fillText(this.net.conn?.open ? "玩家已连接" : "等待玩家加入…", W / 2, 138);

  const x = W / 2 - 125;
  if (this.net.isHost) {
    this.addButton(x, H * 0.48, 250, 50, "开始合作模式",
      () => this.requestStart("coop"), "#06d6a0");
    this.addButton(x, H * 0.48 + 62, 250, 50, "开始 1v1 PVP",
      () => this.requestStart("pvp"), "#ff2e63");
  } else {
    ctx.fillStyle = "#888";
    ctx.fillText("等待房主开始", W / 2, H * 0.52);
  }

  this.addButton(x, H * 0.48 + 130, 250, 48, "离开房间",
    () => this.leaveRoom(), "#888");
};

game.drawGameOver = function() {
  this.buttons = [];
  ctx.fillStyle = "rgba(0,0,0,.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff2e63";
  ctx.font = "bold 30px Arial";
  ctx.fillText("GAME OVER", W / 2, H / 2 - 42);
  ctx.fillStyle = "#ddd";
  ctx.font = "16px Arial";
  ctx.fillText(`Score: ${this.score}  Kills: ${this.kills}`, W / 2, H / 2);
  this.addButton(W / 2 - 110, H / 2 + 28, 220, 48,
    this.mode === "solo" ? "返回难度选择" : "返回房间",
    () => this.leaveMatch(), "#00fff5");
};

function frame() {
  game.update();
  game.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
