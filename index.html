<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Triangle Battle Arena</title>
<style>
html,body {
  margin:0; padding:0; width:100%; height:100%;
  background:#0b0c10; overflow:hidden; touch-action:none;
  user-select:none; -webkit-user-select:none;
  font-family:Helvetica,Arial,sans-serif;
}
canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, game;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (game) game.setupJoysticks();
}
window.addEventListener("resize", resize);

const now = () => performance.now() / 1000;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const SPEED_MULT = 1.7;

function triPoints(x, y, r, angle) {
  return [0, 2.4, -2.4].map(offset => [
    x + Math.cos(angle + offset) * r,
    y + Math.sin(angle + offset) * r
  ]);
}
function drawTri(x, y, r, angle, color) {
  const p = triPoints(x, y, r, angle);
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  ctx.lineTo(p[1][0], p[1][1]);
  ctx.lineTo(p[2][0], p[2][1]);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function drawHpBar(x, y, hp, maxHp, color="#ff2e63") {
  const w = 42, h = 5;
  ctx.fillStyle = "#2b2d42";
  ctx.fillRect(x-w/2, y-32, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x-w/2, y-32, w*clamp(hp/maxHp, 0, 1), h);
}

class Bullet {
  constructor(x, y, angle, speed=10, radius=5, color="#00fff5", piercing=false) {
    this.x=x; this.y=y;
    this.dx=Math.cos(angle); this.dy=Math.sin(angle);
    this.speed=speed*SPEED_MULT; this.radius=radius;
    this.color=color; this.piercing=piercing; this.active=true;
    this.damageMult=1; this.fromHelper=false;
    this.ownerId=null; this.lockOnTarget=null;
  }
  update() {
    if (this.lockOnTarget?.isAlive) {
      const d=Math.hypot(this.lockOnTarget.x-this.x,this.lockOnTarget.y-this.y);
      if (d<140) {
        const a=Math.atan2(this.lockOnTarget.y-this.y,this.lockOnTarget.x-this.x);
        this.dx=Math.cos(a); this.dy=Math.sin(a);
      }
    }
    this.x+=this.dx*this.speed; this.y+=this.dy*this.speed;
    if (this.x < -20 || this.x > W+20 || this.y < -20 || this.y > H+20)
      this.active=false;
  }
  draw() {
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill();
  }
}

class StrongBullet extends Bullet {
  constructor(x,y,angle) {
    super(x,y,angle,17,14,"#ff2e63",true);
    this.speed=17*SPEED_MULT;
  }
  draw() {
    ctx.fillStyle=this.fromHelper?"#bbb":"#ff2e63";
    ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(this.x,this.y,this.radius/2,0,Math.PI*2); ctx.fill();
  }
}

class Rocket {
  constructor(x,y,target,speed=6.5,color="#1a3a8a",fromHelper=false) {
    this.x=x; this.y=y; this.target=target;
    this.radius=7; this.size=8; this.speed=speed*SPEED_MULT;
    this.color=color; this.active=true; this.spawnTime=now();
    this.lifetime=2.5; this.damage=1; this.fromHelper=fromHelper;
    this.ownerId=null;
    this.angle=target ? Math.atan2(target.y-y,target.x-x) : 0;
  }
  update() {
    if (now()-this.spawnTime>this.lifetime) { this.active=false; return; }
    if (this.target?.isAlive) {
      const desired=Math.atan2(this.target.y-this.y,this.target.x-this.x);
      let delta=Math.atan2(Math.sin(desired-this.angle),Math.cos(desired-this.angle));
      this.angle+=clamp(delta,-0.06,0.06);
    }
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;
    if (this.x<5 || this.x>W-5 || this.y<5 || this.y>H-5)
      this.active=false;
  }
  draw() { drawTri(this.x,this.y,this.size,this.angle,this.color); }
}

class PlayerRed {
  constructor(x,y,hp=20,ownerId=null) {
    this.ownerId=ownerId; this.x=x; this.y=y; this.radius=18;
    this.baseSpeed=5.8*SPEED_MULT; this.angle=0;
    this.maxHp=hp; this.hp=hp; this.isAlive=true;
    this.score=0; this.kills=0; this.equipped=[];
    this.strongBulletCd=20; this.lastStrongBulletTime=-20;
    this.rocketCd=3; this.lastRocketTime=-3;
    this.dashCd=4; this.lastDashTime=-4; this.dashEndTime=0;
    this.shieldHp=0; this.shieldMax=10; this.shieldCd=30;
    this.shieldLastUsed=-30;
    this.strikePending=false; this.isStriking=false;
    this.strikeDir=[1,0]; this.strikeCd=15; this.strikeLastUsed=-15;
    this.lockonActive=false; this.lockonSelecting=false;
    this.lockonPath=[]; this.lockonCircles=[]; this.lockonLocked=new Set();
    this.lockonCd=25; this.lockonLastUsed=-25;
    this.fakeActive=false; this.fakeStart=0; this.fakeDuration=10;
    this.fakeCd=20; this.fakeLastUsed=-20; this.fakeAbsorbed=0;
    this.fakeOrbsAngle=0; this.fakeMode="follow";
    this.fakeOrbPositions=[null,null]; this.fakeOrbTargets=[null,null];
    this.fakeOrbLastShoot=0;
    this.helpActive=false; this.helpStart=0; this.helpDuration=12;
    this.helpCd=30; this.helpLastUsed=-30; this.helpers=[];
    this.pvpMode=false;
  }

  hasSkill(key) {
    if (this.pvpMode && ["fake","help","lockon"].includes(key)) return false;
    return this.equipped.includes(key);
  }
  move(dx,dy,aim) {
    if (!this.isAlive || this.isStriking) return;
    const speed=this.baseSpeed*(this.pvpMode?1.3:1)*
      (now()<this.dashEndTime?2.6:1);
    this.x=clamp(this.x+dx*speed,this.radius,W-this.radius);
    this.y=clamp(this.y+dy*speed,this.radius,H-this.radius);
    this.angle=aim;
  }
  triggerDash() {
    if (now()-this.lastDashTime>=this.dashCd) {
      this.lastDashTime=now(); this.dashEndTime=now()+0.18;
    }
  }
  fireStrongBullet(targets) {
    if (now()-this.lastStrongBulletTime<this.strongBulletCd) return null;
    this.lastStrongBulletTime=now();
    const b=new StrongBullet(this.x,this.y,this.angle);
    const target=targets.filter(t=>t.isAlive).sort((a,c)=>
      Math.hypot(a.x-this.x,a.y-this.y)-Math.hypot(c.x-this.x,c.y-this.y))[0];
    if (target) {
      b.angle=Math.atan2(target.y-this.y,target.x-this.x);
      b.dx=Math.cos(b.angle); b.dy=Math.sin(b.angle);
    }
    b.ownerId=this.ownerId;
    return b;
  }
  fireRockets(enemies) {
    if (this.pvpMode || now()-this.lastRocketTime<this.rocketCd) return [];
    const alive=enemies.filter(e=>e.isAlive);
    if (!alive.length) return [];
    this.lastRocketTime=now();
    return Array.from({length:5},(_,i)=>{
      const target=alive[i%alive.length];
      const angle=this.angle+(i-2)*0.35;
      return new Rocket(
        this.x+Math.cos(angle)*14,
        this.y+Math.sin(angle)*14,
        target,5.5,"#1a3a8a"
      );
    });
  }
  activateShield() {
    if (!this.hasSkill("shield") || this.shieldHp>0 ||
        now()-this.shieldLastUsed<this.shieldCd) return;
    this.shieldHp=this.shieldMax;
  }
  tryArmStrike() {
    if (this.hasSkill("strike") && !this.isStriking &&
        now()-this.strikeLastUsed>=this.strikeCd) this.strikePending=true;
  }
  beginStrike(angle) {
    this.isStriking=true; this.strikePending=false;
    this.strikeDir=[Math.cos(angle),Math.sin(angle)];
    this.strikeLastUsed=now();
  }
  startCrashBounce(x,y) {
    const dx=this.x-x,dy=this.y-y,d=Math.hypot(dx,dy)||1;
    this.x=clamp(this.x+dx/d*120,this.radius,W-this.radius);
    this.y=clamp(this.y+dy/d*120,this.radius,H-this.radius);
  }
  updateStrike() {
    if (!this.isStriking) return;
    this.x+=this.strikeDir[0]*22*SPEED_MULT;
    this.y+=this.strikeDir[1]*22*SPEED_MULT;
    if (this.x<this.radius||this.x>W-this.radius||
        this.y<this.radius||this.y>H-this.radius) {
      this.x=clamp(this.x,this.radius,W-this.radius);
      this.y=clamp(this.y,this.radius,H-this.radius);
      this.isStriking=false;
    }
  }
  activateLockon() {
    if (!this.hasSkill("lockon")||now()-this.lockonLastUsed<this.lockonCd) return;
    this.lockonSelecting=true; this.lockonActive=false;
  }
  commitLockon(enemies) {
    this.lockonLastUsed=now(); this.lockonSelecting=false; this.lockonActive=true;
    const expire=now()+2;
    for (const c of this.lockonPath) {
      this.lockonCircles.push({...c,expire});
      for (const e of enemies)
        if (e.isAlive&&Math.hypot(e.x-c.x,e.y-c.y)<c.r+e.radius)
          this.lockonLocked.add(e);
    }
    this.lockonPath=[];
  }
  activateFake() {
    if (!this.hasSkill("fake")||this.fakeActive||
        now()-this.fakeLastUsed<this.fakeCd) return;
    this.fakeActive=true; this.fakeStart=now(); this.fakeAbsorbed=0;
    this.fakeMode=Math.random()<0.5?"follow":"attack";
    this.fakeOrbPositions=[null,null]; this.fakeOrbTargets=[null,null];
  }
  activateHelp() {
    if (!this.hasSkill("help")||this.helpActive||
        now()-this.helpLastUsed<this.helpCd) return;
    this.helpActive=true; this.helpStart=now();
    this.helpers=Array.from({length:5},(_,i)=>{
      const a=i*Math.PI*2/5;
      return new Helper(this.x+Math.cos(a)*60,this.y+Math.sin(a)*60,[...this.equipped]);
    });
  }
  takeDamage(amount) {
    if (this.isStriking) return;
    if (this.fakeActive) { this.fakeAbsorbed+=amount; return; }
    const absorbed=Math.min(this.shieldHp,amount);
    this.shieldHp-=absorbed; amount-=absorbed;
    if (this.shieldHp===0&&absorbed>0) this.shieldLastUsed=now();
    this.hp-=amount;
    if (this.hp<=0) { this.hp=0; this.isAlive=false; }
  }
}

class Helper {
  constructor(x, y, equipped) {
    this.x = x; this.y = y; this.radius = 12;
    this.baseSpeed = 5 * SPEED_MULT; this.angle = 0;
    this.equipped = equipped; this.maxHp = 25; this.hp = 25;
    this.isAlive = true; this.lastShot = 0;
    this.lastRocket = 0; this.lastShield = -30; this.lastBeam = 0;
    this.shieldHp = 0; this.roamAngle = Math.random() * Math.PI * 2;
    this.roamTimer = 0; this.skillTimer = Math.random() * 2;
    this.isStriking = false;
  }

  takeDamage(n) {
    if (this.isStriking) return;
    const absorbed = Math.min(this.shieldHp, n);
    this.shieldHp -= absorbed;
    n -= absorbed;
    this.hp -= n;
    if (this.hp <= 0) {
      this.hp = 0;
      this.isAlive = false;
    }
  }

  update(owner, enemies) {
    if (!this.isAlive || !owner.isAlive) return;

    const t = now();
    this.roamTimer -= 0.016;
    if (this.roamTimer <= 0) {
      this.roamAngle = Math.random() * Math.PI * 2;
      this.roamTimer = 1 + Math.random() * 2;
    }

    const ox = owner.x + Math.cos(this.roamAngle) * 140 - this.x;
    const oy = owner.y + Math.sin(this.roamAngle) * 140 - this.y;
    const od = Math.hypot(ox, oy) || 1;
    if (od > 20) {
      this.x += ox / od * this.baseSpeed;
      this.y += oy / od * this.baseSpeed;
    }

    const target = enemies
      .filter(e => e.isAlive)
      .sort((a, b) =>
        Math.hypot(a.x - this.x, a.y - this.y) -
        Math.hypot(b.x - this.x, b.y - this.y)
      )[0];

    if (target) {
      this.angle = Math.atan2(target.y - this.y, target.x - this.x);
      if (t - this.lastShot > 0.15) {
        this.lastShot = t;
        const b = new Bullet(this.x, this.y, this.angle, 11, 4, "#bbbbbb");
        b.fromHelper = true;
        b.damageMult = 0.5;
        game.redBullets.push(b);
      }
    }

    this.skillTimer -= 0.016;
    if (this.skillTimer <= 0) {
      this.skillTimer = 2 + Math.random() * 3;
      const skill = ["rocket", "beam", "shield", "dash"][
        Math.floor(Math.random() * 4)
      ];

      if (skill === "rocket" && target && t - this.lastRocket > 4) {
        this.lastRocket = t;
        const r = new Rocket(this.x, this.y, target, 5, "#88aaff", true);
        r.damage = 0.5;
        game.redRockets.push(r);
      } else if (skill === "beam" && target && t - this.lastBeam > 6) {
        this.lastBeam = t;
        const b = new StrongBullet(this.x, this.y, this.angle);
        b.fromHelper = true;
        b.speed *= 0.7;
        game.redStrongBullets.push(b);
      } else if (skill === "shield" &&
                 this.shieldHp <= 0 && t - this.lastShield > 30) {
        this.shieldHp = 5;
        this.lastShield = t;
      } else if (skill === "dash") {
        this.x += Math.cos(this.angle) * 30;
        this.y += Math.sin(this.angle) * 30;
      }
    }

    this.x = clamp(this.x, this.radius, W - this.radius);
    this.y = clamp(this.y, this.radius, H - this.radius);
  }

  draw() {
    if (this.shieldHp > 0) {
      ctx.strokeStyle = "#06d6a0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    drawTri(this.x, this.y, this.radius, this.angle, "#888");
    drawHpBar(this.x, this.y, this.hp, this.maxHp, "#bbb");
  }
}

class YellowTriangle {
  constructor(x, y, hp = 77) {
    this.x = x; this.y = y; this.radius = 22;
    this.baseSpeed = 8.5 * SPEED_MULT; this.angle = 0;
    this.maxHp = hp; this.hp = hp; this.isAlive = true;
    this.preferredDistance = 260;
    this.attackMode = "aim";
    this.modeTimer = now() + 0.3;
    this.aimDuration = 0.3;
    this.rapidShootTimer = 0;
    this.rapidShootInterval = 0.1;
    this.rapidDuration = 3;
    this.rapidShootStarted = 0;
    this.powerChargeStart = 0;
    this.powerChargeDuration = 1;
    this.isCharging = false;
    this.isDashing = false;
    this.chargeStart = 0;
    this.dashDir = [0, 0];
    this.dashTravelled = 0;
    this.dashMaxDist = 0;
    this.dashHitDone = false;
    this.crashCooldownUntil = 0;
    this.trail = [];
    this.isDodging = false;
    this.dodgeDir = [0, 0];
    this.dodgeStart = 0;
    this.dodgeDuration = 0.35;
    this.dodgeCooldown = 0;
    this.aimedAtDuration = 0;
    this.beingAimedAt = false;
    this.speedBoostUntil = 0;
    this.sidestepCooldown = 0;
    this.canShoot = true;
  }

  takeDamage(n = 1) {
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }

  tryDodge(x, y) {
    const t = now();
    if (t < this.dodgeCooldown || this.isDodging ||
        this.isDashing || this.isCharging) return;

    const dx = this.x - x, dy = this.y - y;
    const d = Math.hypot(dx, dy) || 1;
    this.dodgeDir = [dx / d, dy / d];
    this.isDodging = true;
    this.dodgeStart = t;
    this.dodgeCooldown = t + 1.2;
  }

  trySidestep() {
    const t = now();
    if (t < this.sidestepCooldown || this.isDodging ||
        this.isDashing || this.isCharging) return;

    const side = Math.random() < 0.5 ? 1 : -1;
    this.dodgeDir = [-Math.sin(this.angle) * side,
                      Math.cos(this.angle) * side];
    this.isDodging = true;
    this.dodgeStart = t;
    this.dodgeDuration = 0.4;
    this.dodgeCooldown = t + 1.2;
    this.sidestepCooldown = t + 3.5;
  }

  tryDashThroughTarget(target) {
    const t = now();
    if (t < this.sidestepCooldown || this.isDodging ||
        this.isDashing || this.isCharging) return;

    const dx = target.x - this.x, dy = target.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.dodgeDir = [dx / d, dy / d];
    this.isDodging = true;
    this.dodgeStart = t;
    this.dodgeDuration = 0.3;
    this.dodgeCooldown = t + 1;
    this.sidestepCooldown = t + 4;
  }

  triggerCrash(target) {
    if (this.isCharging || this.isDashing) return;
    const dx = target.x - this.x, dy = target.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.attackMode = "crash";
    this.isCharging = true;
    this.chargeStart = now();
    this.dashDir = [dx / d, dy / d];
    this.dashMaxDist = Math.max(W, H) * 1.5;
    this.dashTravelled = 0;
    this.dashHitDone = false;
  }

  updateDash(target) {
    if (this.isCharging) {
      if (now() - this.chargeStart >= 0.4) {
        this.isCharging = false;
        this.isDashing = true;
      }
      return;
    }
    if (!this.isDashing) return;

    const speed = this.baseSpeed * 5;
    this.x += this.dashDir[0] * speed;
    this.y += this.dashDir[1] * speed;
    this.dashTravelled += speed;

    // Hit the selected player target.
    if (!this.dashHitDone && target?.isAlive &&
        Math.hypot(target.x - this.x, target.y - this.y) <
        this.radius + (target.radius || 18)) {
      if (target.isStriking && target.startCrashBounce) {
        target.startCrashBounce(this.x, this.y);
        this.startBounce();
      } else if (target.takeDamage) {
        target.takeDamage(5);
        this.dashHitDone = true;
      }
    }

    if (this.dashTravelled >= this.dashMaxDist ||
        this.x < this.radius || this.x > W - this.radius ||
        this.y < this.radius || this.y > H - this.radius) {
      this.isDashing = false;
      this.x = clamp(this.x, this.radius, W - this.radius);
      this.y = clamp(this.y, this.radius, H - this.radius);
      this.crashCooldownUntil = now() + 4;
      this.attackMode = "aim";
      this.modeTimer = now() + this.aimDuration;
    }
  }

  startBounce() {
    this.isDashing = false;
    this.isCharging = false;
    this.x = clamp(this.x - this.dashDir[0] * 150, this.radius, W - this.radius);
    this.y = clamp(this.y - this.dashDir[1] * 150, this.radius, H - this.radius);
    this.attackMode = "aim";
    this.modeTimer = now() + this.aimDuration;
    this.crashCooldownUntil = now() + 3;
  }

  update(target, enemyBullets) {
    if (!this.isAlive || !target?.isAlive) return;
    const t = now();
    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.angle = Math.atan2(dy, dx);

    if (this.isDodging) {
      if (t - this.dodgeStart >= this.dodgeDuration) {
        this.isDodging = false;
      } else {
        const speed = this.baseSpeed * 3;
        this.x += this.dodgeDir[0] * speed;
        this.y += this.dodgeDir[1] * speed;
        return;
      }
    }

    if (this.isCharging || this.isDashing) {
      this.updateDash(target);
      return;
    }

    let speed = this.baseSpeed;
    if (t < this.speedBoostUntil) speed *= 1.8;

    if (this.beingAimedAt) {
      this.aimedAtDuration += 0.016;
      if (this.aimedAtDuration > 1.2 && t > this.speedBoostUntil) {
        this.speedBoostUntil = t + 3;
        this.aimedAtDuration = 0;
      }
    } else {
      this.aimedAtDuration = Math.max(0, this.aimedAtDuration - 0.02);
    }

    if (dist < 400 && Math.random() < 0.01) this.trySidestep();
    if (dist < 250 && Math.random() < 0.008) this.tryDashThroughTarget(target);

    if (dist < this.preferredDistance - 25) {
      this.x -= dx / dist * speed * 0.6;
      this.y -= dy / dist * speed * 0.6;
    } else if (dist > this.preferredDistance + 25) {
      this.x += dx / dist * speed * 0.6;
      this.y += dy / dist * speed * 0.6;
    } else {
      this.x += -dy / dist * speed * 0.5;
      this.y += dx / dist * speed * 0.5;
    }

    if (this.attackMode === "aim" && t >= this.modeTimer) {
      this.attackMode = "rapid";
      this.rapidShootStarted = t;
      this.rapidShootTimer = t;
    } else if (this.attackMode === "rapid") {
      if (t - this.rapidShootStarted > this.rapidDuration) {
        this.attackMode = "power";
        this.powerChargeStart = t;
      } else if (this.canShoot && t - this.rapidShootTimer >= this.rapidShootInterval) {
        this.rapidShootTimer = t;
        enemyBullets.push(new Bullet(this.x, this.y, this.angle, 11, 6, "#ffe66d"));
      }
    } else if (this.attackMode === "power" &&
               t - this.powerChargeStart >= this.powerChargeDuration) {
      const b = new Bullet(this.x, this.y, this.angle, 22, 12, "#fff", true);
      b.damageMult = 2;
      enemyBullets.push(b);
      if (t > this.crashCooldownUntil && Math.random() < 0.5) {
        this.triggerCrash(target);
      } else {
        this.attackMode = "aim";
        this.modeTimer = t + this.aimDuration;
      }
    }

    this.x = clamp(this.x, this.radius, W - this.radius);
    this.y = clamp(this.y, this.radius, H - this.radius);
  }

  draw() {
    let color = "#f9d56e";
    if (this.attackMode === "power") color = "#ff8800";
    if (this.isDodging) color = "#aaffaa";
    if (this.isCharging) color = "#fff";
    if (this.isDashing) color = "#ff5500";

    drawTri(this.x, this.y, this.radius, this.angle, color);
    drawHpBar(this.x, this.y, this.hp, this.maxHp);

    if (this.isCharging) {
      ctx.strokeStyle = "#f00";
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x + this.dashDir[0] * 400,
                 this.y + this.dashDir[1] * 400);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

class PurpleTriangle {
  constructor(x, y) {
    this.x=x; this.y=y; this.radius=23; this.speed=3.6*SPEED_MULT;
    this.angle=0; this.maxHp=6; this.hp=6; this.isAlive=true;
    this.preferredDistance=300; this.lastShotTime=now();
    this.shotInterval=0.9;
  }
  takeDamage(n=1) {
    this.hp-=n;
    if (this.hp<=0) { this.hp=0; this.isAlive=false; }
  }
  update(target, bullets) {
    if (!this.isAlive || !target?.isAlive) return;
    const dx=target.x-this.x, dy=target.y-this.y;
    const d=Math.hypot(dx,dy)||1;
    this.angle=Math.atan2(dy,dx);

    if (d<this.preferredDistance-25) {
      this.x-=dx/d*this.speed; this.y-=dy/d*this.speed;
    } else if (d>this.preferredDistance+25) {
      this.x+=dx/d*this.speed; this.y+=dy/d*this.speed;
    } else {
      this.x+=dy/d*this.speed*0.6;
      this.y-=dx/d*this.speed*0.6;
    }

    if (now()-this.lastShotTime>=this.shotInterval) {
      this.lastShotTime=now();
      const b=new Bullet(this.x,this.y,this.angle,9,6,"#c77dff");
      b.damageMult=0.5;
      bullets.push(b);
    }

    this.x=clamp(this.x,this.radius,W-this.radius);
    this.y=clamp(this.y,this.radius,H-this.radius);
  }
  draw() {
    drawTri(this.x,this.y,this.radius,this.angle,"#9d4edd");
    drawHpBar(this.x,this.y,this.hp,this.maxHp);
  }
}

class GreenTriangle {
  constructor(x, y) {
    this.x=x; this.y=y; this.radius=18; this.speed=4.5*SPEED_MULT;
    this.angle=0; this.maxHp=4; this.hp=4; this.isAlive=true;
    this.preferredDistance=380; this.state="firing";
    this.fireCooldown=now()+1; this.waitStart=0; this.chargeStart=0;
    this.dashDir=[0,0]; this.dashTravelled=0;
    this.dashMaxDist=0; this.dashHitDone=false;
    this.rocketTarget=null;
  }
  takeDamage(n=1) {
    this.hp-=n;
    if (this.hp<=0) { this.hp=0; this.isAlive=false; }
  }
  update(target, rockets) {
    if (!this.isAlive || !target?.isAlive) return;
    const t=now();
    const dx=target.x-this.x, dy=target.y-this.y;
    const d=Math.hypot(dx,dy)||1;
    this.angle=Math.atan2(dy,dx);

    if (this.state!=="dashing") {
      if (d>this.preferredDistance-40) {
        this.x+=dx/d*this.speed; this.y+=dy/d*this.speed;
      } else if (d<this.preferredDistance-100) {
        this.x-=dx/d*this.speed; this.y-=dy/d*this.speed;
      }
    }

    if (this.state==="firing" && t>=this.fireCooldown) {
      this.rocketTarget=target;
      for (let i=0;i<7;i++) {
        if (rockets.length<30) {
          const r=new Rocket(this.x,this.y,target,6.5,"#1a3a8a");
          r.target=target;
          rockets.push(r);
        }
      }
      this.state="waiting";
      this.waitStart=t;
    } else if (this.state==="waiting") {
      const stillComing=rockets.some(r=>r.active&&r.target===this.rocketTarget);
      if (!stillComing||t-this.waitStart>=4) {
        this.state="charging";
        this.chargeStart=t;
        this.dashDir=[dx/d,dy/d];
        this.dashMaxDist=d+150;
        this.dashTravelled=0;
        this.dashHitDone=false;
      }
    } else if (this.state==="charging" && t-this.chargeStart>=2) {
      this.state="dashing";
    } else if (this.state==="dashing") {
      const speed=this.speed*5;
      this.x+=this.dashDir[0]*speed;
      this.y+=this.dashDir[1]*speed;
      this.dashTravelled+=speed;

      if (!this.dashHitDone&&target.isAlive&&
          Math.hypot(target.x-this.x,target.y-this.y)<
          this.radius+(target.radius||18)*1.5) {
        target.takeDamage(3);
        this.dashHitDone=true;
      }

      if (this.dashTravelled>=this.dashMaxDist||
          this.x<this.radius||this.x>W-this.radius||
          this.y<this.radius||this.y>H-this.radius) {
        this.state="firing";
        this.fireCooldown=now()+2;
      }
    }

    this.x=clamp(this.x,this.radius,W-this.radius);
    this.y=clamp(this.y,this.radius,H-this.radius);
  }
  draw() {
    let color="#06d6a0";
    if (this.state==="charging") color="#fff";
    if (this.state==="dashing") color="#00ff88";
    drawTri(this.x,this.y,this.radius,this.angle,color);
    drawHpBar(this.x,this.y,this.hp,this.maxHp);
  }
}

  },

  },

const SKILLS = {
  shield: { name: "SHIELD", cost: 300 },
  strike: { name: "STRIKE", cost: 500 },
  lockon: { name: "LOCKON", cost: 100 },
  fake:   { name: "FAKE", cost: 400 },
  help:   { name: "HELP", cost: 600 }
};

class Net {
  constructor() {
    this.peer=null; this.isHost=false; this.connections={};
    this.myId=""; this.roomCode="";
  }

  host() {
    return new Promise((resolve,reject) => {
      if (this.peer) this.peer.destroy();
      this.peer=new Peer();
      this.isHost=true;
      this.peer.on("open", id => {
        this.myId=id; this.roomCode=id; resolve(id);
      });
      this.peer.on("error", reject);
      this.peer.on("connection", conn => {
        this.connections[conn.peer]=conn;
        conn.on("data", data => game.onNetData(conn.peer,data));
        conn.on("close", () => {
          delete this.connections[conn.peer];
          delete game.remotePlayers[conn.peer];
        });
      });
    });
  }

  join(code) {
    return new Promise((resolve,reject) => {
      if (this.peer) this.peer.destroy();
      this.peer=new Peer();
      this.isHost=false;
      this.peer.on("open", id => {
        this.myId=id;
        const conn=this.peer.connect(code);
        conn.on("open", () => {
          this.connections[code]=conn;
          this.roomCode=code;
          conn.on("data", data => game.onNetData(code,data));
          resolve(code);
        });
        conn.on("error",reject);
      });
      this.peer.on("error",reject);
    });
  }

  sendTo(id,msg) {
    try { this.connections[id]?.send(msg); } catch (_) {}
  }

  broadcast(msg) {
    for (const id in this.connections) this.sendTo(id,msg);
  }

  close() {
    try { this.peer?.destroy(); } catch (_) {}
    this.peer=null;
    this.connections={};
  }
}

class Game {
  constructor() {
    this.state="device";
    this.deviceMode="computer";
    this.touchMode=false;
    this.difficultyKey="news";
    this.difficulty=DIFFICULTIES.news;

    this.net=new Net();
    this.remotePlayers={};
    this.pvpMode=false;

    this.player=null;
    this.enemies=[];
    this.redBullets=[];
    this.redStrongBullets=[];
    this.redRockets=[];
    this.enemyBullets=[];
    this.enemyRockets=[];

    this.equippedSkills=[];
    this.ownedSkills={shield:false,strike:false,lockon:false,fake:false,help:false};
    this.marks=0;

    this.keys={};
    this.mousePos=[W/2,H/2];
    this.isShooting=false;
    this.autoShootAt=0;

    this.lJoy={cx:0,cy:0,r:0,kx:0,ky:0,active:false};
    this.rJoy={cx:0,cy:0,r:0,kx:0,ky:0,active:false};
    this.leftMoveDir=[0,0];
    this.rightAimAngle=0;
    this.rightFiring=false;
    this.touches=new Map();

    this.buttons=[];
    this.modeButton={x:0,y:0,w:150,h:36};
    this.rocketButton={x:0,y:0};
    this.strongButton={x:0,y:0};
    this.skillButtons={};
    this.skillRadius=30;
  }

  setupJoysticks() {
    const r=Math.min(W,H)*0.13;
    this.lJoy.r=this.rJoy.r=r;
    this.lJoy.cx=r+20; this.lJoy.cy=H-r-20;
    this.rJoy.cx=W-r-20; this.rJoy.cy=H-r-20;
    if (!this.lJoy.active) {
      this.lJoy.kx=this.lJoy.cx; this.lJoy.ky=this.lJoy.cy;
    }
    if (!this.rJoy.active) {
      this.rJoy.kx=this.rJoy.cx; this.rJoy.ky=this.rJoy.cy;
    }
    this.rocketButton={cx:W-40,cy:55};
    this.strongButton={cx:W-110,cy:55};
    this.refreshSkillButtons();
  }

  refreshSkillButtons() {
    this.skillButtons={};
    let i=0;
    for (const key of ["shield","strike","lockon","fake","help"]) {
      if (this.player?.hasSkill(key)) {
        this.skillButtons[key]={cx:W-180-i*66,cy:55};
        i++;
      }
    }
  }

  makeSpawnPoints(count) {
    const points=[];
    for (let i=0;i<count;i++) {
      points.push([
        clamp(W*0.65+(i%3)*35,40,W-40),
        clamp(100+Math.floor(i/3)*75,40,H-40)
      ]);
    }
    return points;
  }

  resetGame() {
    this.player=new PlayerRed(200,H/2,this.difficulty.playerHp,this.net.myId);
    this.player.equipped=[...this.equippedSkills];
    this.player.pvpMode=this.pvpMode;
    this.player.score=this.marks;

    this.redBullets=[]; this.redStrongBullets=[]; this.redRockets=[];
    this.enemyBullets=[]; this.enemyRockets=[];
    this.enemies=[];

    const d=this.difficulty.start;
    const positions=this.makeSpawnPoints(d.yellow+d.purple+d.green);
    let i=0;
    for (let n=0;n<d.yellow;n++)
      this.enemies.push(new YellowTriangle(...positions[i++]));
    for (let n=0;n<d.purple;n++)
      this.enemies.push(new PurpleTriangle(...positions[i++]));
    for (let n=0;n<d.green;n++)
      this.enemies.push(new GreenTriangle(...positions[i++]));

    this.refreshSkillButtons();
  }

  startGame(diffKey,pvp=false,broadcast=true) {
    this.difficultyKey=diffKey;
    this.difficulty=DIFFICULTIES[diffKey];
    this.pvpMode=pvp;
    this.state="playing";
    this.setupJoysticks();
    this.resetGame();

    if (broadcast) {
      this.net.broadcast({
        type:"start",
        diff:diffKey,
        pvp,
        skills:this.equippedSkills
      });
    }
  }

  onNetData(fromId,data) {
    if (!data?.type) return;

    if (data.type==="state") {
      this.remotePlayers[fromId]={
        ...data.player,
        id:fromId,
        radius:18,
        isAlive:data.player.hp>0,
        takeDamage:damage => this.damageRemotePlayer(fromId,damage),
        startCrashBounce:()=>{}
      };
    } else if (data.type==="hit") {
      if (this.player?.isAlive) this.player.takeDamage(data.damage);
    } else if (data.type==="enemy_hit" && this.net.isHost) {
      // Clients submit remote-player damage requests to the host.
      if (this.net.connections[data.targetId]) {
        this.net.sendTo(data.targetId,{
          type:"hit",
          damage:data.damage
        });
      }
    } else if (data.type==="start") {
      this.equippedSkills=data.skills||[];
      this.startGame(data.diff,!!data.pvp,false);
    } else if (data.type==="bullet") {
      if (data.ownerId!==this.net.myId) {
        const b=new Bullet(data.x,data.y,
          Math.atan2(data.dy,data.dx),12,data.radius,"#ff8fa3");
        b.dx=data.dx; b.dy=data.dy;
        b.damageMult=data.damage||1;
        this.enemyBullets.push(b);
      }
    } else if (data.type==="leave") {
      delete this.remotePlayers[fromId];
    }
  }

  damageRemotePlayer(id,damage) {
    if (id===this.net.myId) {
      this.player?.takeDamage(damage);
    } else if (this.net.isHost) {
      this.net.sendTo(id,{type:"hit",damage});
    } else {
      this.net.sendTo(this.net.roomCode,{
        type:"enemy_hit",
        targetId:id,
        damage
      });
    }
  }

  syncPlayer() {
    if (!this.player) return;
    this.net.broadcast({
      type:"state",
      player:{
        x:this.player.x,y:this.player.y,angle:this.player.angle,
        hp:this.player.hp,maxHp:this.player.maxHp,
        name:"Player"
      }
    });
  }

  getCombatTargets() {
    const targets=[];
    if (this.player?.isAlive) targets.push(this.player);

    if (!this.pvpMode) {
      for (const [id,p] of Object.entries(this.remotePlayers)) {
        if (!p || p.hp<=0) continue;
        p.isAlive=true;
        p.radius=18;
        p.takeDamage=n=>this.damageRemotePlayer(id,n);
        p.startCrashBounce=()=>{};
        targets.push(p);
      }
    }
    return targets;
  }

  closestTarget(enemy,targets) {
    let best=null, bestDist=Infinity;
    for (const target of targets) {
      if (!target.isAlive) continue;
      const d=Math.hypot(target.x-enemy.x,target.y-enemy.y);
      if (d<bestDist) { best=target; bestDist=d; }
    }
    return best;
  }

  chooseEnemyType() {
    const d=this.difficulty.max;
    const alive=this.enemies.filter(e=>e.isAlive);
    const count=Class=>alive.filter(e=>e instanceof Class).length;
    const pool=[];
    if (count(PurpleTriangle)<d.purple) pool.push("purple");
    if (count(GreenTriangle)<d.green) pool.push("green");
    if (count(YellowTriangle)<d.yellow) pool.push("yellow");
    return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  }

  spawnEnemy() {
    const type=this.chooseEnemyType();
    if (!type) return null;
    const side=Math.floor(Math.random()*4);
    const x=side<2?Math.random()*W:(side===2?20:W-20);
    const y=side<2?(side===0?20:H-20):Math.random()*H;
    if (type==="yellow") return new YellowTriangle(x,y);
    if (type==="purple") return new PurpleTriangle(x,y);
    return new GreenTriangle(x,y);
  }
  onPointerDown(id,x,y) {
    if (this.state !== "playing") return;

    const b=this.modeButton;
    if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h) {
      this.toggleMode();
      return;
    }

    if (!this.touchMode) {
      if (id==="mouse") {
        this.isShooting=true;
        this.mousePos=[x,y];
      }
      return;
    }

    for (const [key,button] of Object.entries(this.skillButtons)) {
      if (Math.hypot(x-button.cx,y-button.cy)<this.skillRadius) {
        this.touches.set(id,key);
        if (key==="shield") this.player.activateShield();
        if (key==="strike") this.player.tryArmStrike();
        if (key==="lockon") this.player.activateLockon();
        if (key==="fake") this.player.activateFake();
        if (key==="help") this.player.activateHelp();
        return;
      }
    }

    if (Math.hypot(x-this.rocketButton.cx,y-this.rocketButton.cy)<this.skillRadius) {
      this.touches.set(id,"rocket");
      this.redRockets.push(...this.player.fireRockets(this.enemies));
      return;
    }

    if (Math.hypot(x-this.strongButton.cx,y-this.strongButton.cy)<this.skillRadius) {
      this.touches.set(id,"strong");
      const bullet=this.player.fireStrongBullet(this.enemies);
      if (bullet) this.redStrongBullets.push(bullet);
      return;
    }

    const joy=x<W/2?this.lJoy:this.rJoy;
    const role=joy===this.lJoy?"move":"aim";
    this.touches.set(id,role);
    joy.active=true;
    this.updateJoystick(joy,x,y);
    if (role==="aim") this.rightFiring=true;
  }

  onPointerMove(id,x,y) {
    if (!this.touchMode) {
      if (id==="mouse") this.mousePos=[x,y];
      return;
    }
    const role=this.touches.get(id);
    if (role==="move") this.updateJoystick(this.lJoy,x,y);
    if (role==="aim") this.updateJoystick(this.rJoy,x,y);
  }

  onPointerUp(id) {
    const role=this.touches.get(id);
    if (role==="mouse") this.isShooting=false;

    if (role==="move") {
      this.lJoy.active=false;
      this.lJoy.kx=this.lJoy.cx; this.lJoy.ky=this.lJoy.cy;
      this.leftMoveDir=[0,0];
    }
    if (role==="aim") {
      this.rJoy.active=false;
      this.rJoy.kx=this.rJoy.cx; this.rJoy.ky=this.rJoy.cy;
      this.rightFiring=false;
      if (this.player?.strikePending) this.player.beginStrike(this.rightAimAngle);
    }
    this.touches.delete(id);
  }

  updateJoystick(joy,x,y) {
    let dx=x-joy.cx,dy=y-joy.cy;
    const d=Math.hypot(dx,dy);
    if (d>joy.r) { dx=dx/d*joy.r; dy=dy/d*joy.r; }
    joy.kx=joy.cx+dx; joy.ky=joy.cy+dy;
    if (joy===this.lJoy) {
      const n=Math.hypot(dx,dy);
      this.leftMoveDir=n>5?[dx/n,dy/n]:[0,0];
    } else if (d>5) {
      this.rightAimAngle=Math.atan2(dy,dx);
    }
  }

  toggleMode() {
    this.touchMode=!this.touchMode;
    this.deviceMode=this.touchMode?"mobile":"computer";
    this.isShooting=false;
    this.rightFiring=false;
    this.leftMoveDir=[0,0];
    this.touches.clear();
    this.lJoy.active=false;
    this.rJoy.active=false;
    this.setupJoysticks();
  }

  onKey(key,down) {
    key=key.toLowerCase();
    this.keys[key]=down;
    if (!down || this.state!=="playing" || !this.player) return;

    if (key==="m") { this.toggleMode(); return; }
    if (this.touchMode || !this.player.isAlive) return;

    if (key==="c") {
      const b=this.player.fireStrongBullet(this.enemies);
      if (b) this.redStrongBullets.push(b);
    } else if (key==="e") {
      this.redRockets.push(...this.player.fireRockets(this.enemies));
    } else if (key==="q") {
      this.player.activateShield();
    } else if (key==="f") {
      this.player.tryArmStrike();
      if (this.player.strikePending) {
        const angle=Math.atan2(
          this.mousePos[1]-this.player.y,
          this.mousePos[0]-this.player.x
        );
        this.player.beginStrike(angle);
      }
    } else if (key==="g") {
      this.player.activateFake();
    } else if (key==="h") {
      this.player.activateHelp();
    } else if (key===" ") {
      this.player.triggerDash();
    }
  }

  update() {
    if (this.state!=="playing" || !this.player) return;
    const t=now();
    const targets=this.getCombatTargets();

    const aim=this.touchMode
      ? this.rightAimAngle
      : Math.atan2(this.mousePos[1]-this.player.y,
                   this.mousePos[0]-this.player.x);

    if (!this.player.isStriking) {
      const firing=this.touchMode?this.rightFiring:this.isShooting;
      if (firing && this.player.isAlive && t>=this.autoShootAt) {
        this.autoShootAt=t+0.1;
        const bullet=new Bullet(this.player.x,this.player.y,aim,12,5,"#00fff5");
        bullet.ownerId=this.net.myId;
        this.redBullets.push(bullet);
      }
    }

    let dx=0,dy=0;
    if (this.touchMode) {
      [dx,dy]=this.leftMoveDir;
    } else {
      if (this.keys.w||this.keys.arrowup) dy--;
      if (this.keys.s||this.keys.arrowdown) dy++;
      if (this.keys.a||this.keys.arrowleft) dx--;
      if (this.keys.d||this.keys.arrowright) dx++;
    }
    const length=Math.hypot(dx,dy);
    if (length) { dx/=length; dy/=length; }
    this.player.move(dx,dy,aim);
    this.player.updateStrike();

    if (this.player.helpActive) {
      if (t-this.player.helpStart>=this.player.helpDuration) {
        this.player.helpActive=false;
        this.player.helpLastUsed=t;
        this.player.helpers=[];
      } else {
        for (const helper of this.player.helpers) helper.update(this.player,this.enemies);
      }
    }

    for (const enemy of this.enemies) {
      // Choose an independent nearest living target for every enemy.
      const target=this.closestTarget(enemy,targets);
      if (!target) continue;

      if (enemy instanceof YellowTriangle) enemy.update(target,this.enemyBullets);
      else if (enemy instanceof GreenTriangle) enemy.update(target,this.enemyRockets);
      else enemy.update(target,this.enemyBullets);

      if (enemy instanceof YellowTriangle) {
        for (const b of this.redStrongBullets) {
          if (b.active && Math.hypot(b.x-enemy.x,b.y-enemy.y)<200) {
            enemy.tryDodge(b.x,b.y);
            break;
          }
        }
      }
    }

    // Player strike damages nearby enemies.
    if (this.player.isStriking) {
      for (const enemy of this.enemies) {
        if (enemy.isAlive &&
            Math.hypot(this.player.x-enemy.x,this.player.y-enemy.y)<
            enemy.radius+this.player.radius) {
          enemy.takeDamage(99);
        }
      }
    }

    for (const list of [
      this.redBullets,this.redStrongBullets,this.redRockets,
      this.enemyBullets,this.enemyRockets
    ]) for (const item of list) item.update();

    // Friendly projectiles hit enemies.
    for (const bullet of [...this.redBullets,...this.redStrongBullets]) {
      if (!bullet.active) continue;
      for (const enemy of this.enemies) {
        if (enemy.isAlive &&
            Math.hypot(bullet.x-enemy.x,bullet.y-enemy.y)<
            bullet.radius+enemy.radius) {
          enemy.takeDamage(bullet instanceof StrongBullet?99:1);
          if (!bullet.piercing) bullet.active=false;
          break;
        }
      }
    }
    for (const rocket of this.redRockets) {
      if (!rocket.active) continue;
      for (const enemy of this.enemies) {
        if (enemy.isAlive &&
            Math.hypot(rocket.x-enemy.x,rocket.y-enemy.y)<
            rocket.radius+enemy.radius) {
          enemy.takeDamage(rocket.damage*2);
          rocket.active=false;
          break;
        }
      }
    }

    // Enemy bullets and rockets can hit any local player.
    for (const bullet of this.enemyBullets) {
      if (!bullet.active) continue;
      for (const target of targets) {
        if (target.isAlive &&
            Math.hypot(bullet.x-target.x,bullet.y-target.y)<
            bullet.radius+(target.radius||18)) {
          target.takeDamage(bullet.damageMult||1);
          if (!bullet.piercing) bullet.active=false;
          break;
        }
      }
    }
    for (const rocket of this.enemyRockets) {
      if (!rocket.active) continue;
      for (const target of targets) {
        if (target.isAlive &&
            Math.hypot(rocket.x-target.x,rocket.y-target.y)<
            rocket.radius+(target.radius||18)) {
          target.takeDamage(1);
          rocket.active=false;
          break;
        }
      }
    }

    // Award kill marks and respawn enemies within the configured limits.
    const survivors=[];
    for (const enemy of this.enemies) {
      if (enemy.isAlive) survivors.push(enemy);
      else {
        this.player.score+=100;
        this.player.kills++;
        const replacement=this.spawnEnemy();
        if (replacement) survivors.push(replacement);
      }
    }
    this.enemies=survivors;

    this.redBullets=this.redBullets.filter(b=>b.active);
    this.redStrongBullets=this.redStrongBullets.filter(b=>b.active);
    this.redRockets=this.redRockets.filter(r=>r.active);
    this.enemyBullets=this.enemyBullets.filter(b=>b.active);
    this.enemyRockets=this.enemyRockets.filter(r=>r.active);

    if (t-(this.lastSync||0)>0.05) {
      this.lastSync=t;
      this.syncPlayer();
    }
  }

  drawButton(x,y,w,h,label,color) {
    ctx.fillStyle="#171827";
    ctx.fillRect(x,y,w,h);
    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.strokeRect(x,y,w,h);
    ctx.fillStyle=color;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font="12px Arial";
    ctx.fillText(label,x+w/2,y+h/2);
    ctx.textAlign="left";
    ctx.textBaseline="alphabetic";
  }

  drawJoystick(j,color) {
    ctx.strokeStyle=color;
    ctx.lineWidth=3;
    ctx.globalAlpha=0.6;
    ctx.beginPath();
    ctx.arc(j.cx,j.cy,j.r,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(j.kx,j.ky,j.r*0.35,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  draw() {
    ctx.fillStyle="#0b0c10";
    ctx.fillRect(0,0,W,H);

    if (this.state!=="playing") {
      ctx.fillStyle="#00fff5";
      ctx.font="bold 24px Arial";
      ctx.textAlign="center";
      ctx.fillText("Triangle Battle Arena",W/2,H/2);
      ctx.font="14px Arial";
      ctx.fillStyle="#ddd";
      ctx.fillText("Game running — press M to switch controls",W/2,H/2+30);
      ctx.textAlign="left";
      return;
    }

    for (const id in this.remotePlayers) {
      const p=this.remotePlayers[id];
      if (p&&p.hp>0) {
        drawTri(p.x,p.y,18,p.angle||0,"#ff8fa3");
        drawHpBar(p.x,p.y,p.hp,p.maxHp||20,"#06d6a0");
      }
    }
    for (const helper of this.player.helpers) helper.draw();
    for (const enemy of this.enemies) enemy.draw();
    for (const bullet of [
      ...this.redBullets,...this.redStrongBullets,
      ...this.redRockets,...this.enemyBullets,...this.enemyRockets
    ]) bullet.draw();

    if (this.player.isAlive) {
      drawTri(this.player.x,this.player.y,this.player.radius,
              this.player.angle,"#ff2e63");
      drawHpBar(this.player.x,this.player.y,this.player.hp,
                this.player.maxHp,"#06d6a0");
    }

    // HUD intentionally displays skills only.
    ctx.fillStyle="#eee";
    ctx.font="13px Arial";
    ctx.fillText(
      "Skills: "+(this.equippedSkills.length
        ? this.equippedSkills.map(k=>SKILLS[k]?.name||k).join(" · ")
        : "None"),
      10,18
    );

    this.modeButton.x=W-160;
    this.modeButton.y=10;
    this.drawButton(
      this.modeButton.x,this.modeButton.y,
      this.modeButton.w,this.modeButton.h,
      this.touchMode?"Touch mode":"Computer mode",
      this.touchMode?"#00fff5":"#ff2e63"
    );

    if (this.touchMode) {
      this.drawJoystick(this.lJoy,"#00fff5");
      this.drawJoystick(this.rJoy,"#ff2e63");
      this.drawButton(W-62,85,52,40,"ROCKET","#ff9f1c");
      this.drawButton(W-122,85,52,40,"POWER","#ff2e63");
    }

    if (!this.player.isAlive) {
      ctx.fillStyle="rgba(0,0,0,.65)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#ff2e63";
      ctx.font="bold 30px Arial";
      ctx.textAlign="center";
      ctx.fillText("GAME OVER",W/2,H/2);
      ctx.textAlign="left";
    }
  }
}

// Start game object and input.
game=new Game();

function pointerId(e) {
  return e.pointerType==="mouse"?"mouse":String(e.pointerId);
}
function pointerXY(e) {
  const r=canvas.getBoundingClientRect();
  return [e.clientX-r.left,e.clientY-r.top];
}
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  const [x,y]=pointerXY(e);
  game.onPointerDown(pointerId(e),x,y);
},{passive:false});
canvas.addEventListener("pointermove",e=>{
  const [x,y]=pointerXY(e);
  game.onPointerMove(pointerId(e),x,y);
});
canvas.addEventListener("pointerup",e=>game.onPointerUp(pointerId(e)));
canvas.addEventListener("pointercancel",e=>game.onPointerUp(pointerId(e)));

window.addEventListener("keydown",e=>{
  game.onKey(e.key,true);
  if ([" ","arrowup","arrowdown","arrowleft","arrowright"]
      .includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener("keyup",e=>game.onKey(e.key,false));

resize();

function loop() {
  game.update();
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
