<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Triangle Battle Arena — PVP</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0c10; color: #eee;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none; user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function drawTriangle(x, y, radius, angle, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = angle + i * Math.PI * 2 / 3 - Math.PI / 2;
    const px = x + Math.cos(a) * radius;
    const py = y + Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawHealthBar(x, y, hp, maxHp, color) {
  const width = 42, height = 5;
  ctx.fillStyle = "#333";
  ctx.fillRect(x - width / 2, y - 32, width, height);
  ctx.fillStyle = color;
  ctx.fillRect(x - width / 2, y - 32, width * clamp(hp / maxHp, 0, 1), height);
}

class PeerRoom {
  constructor(game) {
    this.game = game;
    this.peer = null;
    this.connection = null;
    this.isHost = false;
    this.roomCode = "";
  }

  host() {
    return new Promise((resolve, reject) => {
      this.close();
      if (typeof Peer === "undefined") {
        reject(new Error("PeerJS 未加载"));
        return;
      }

      this.peer = new Peer();
      this.isHost = true;

      this.peer.on("open", id => {
        this.roomCode = id;
        resolve(id);
      });

      this.peer.on("connection", conn => {
        if (this.connection && this.connection.open) {
          conn.close();
          return;
        }
        this.attach(conn);
      });

      this.peer.on("error", reject);
    });
  }

  join(code) {
    return new Promise((resolve, reject) => {
      this.close();
      if (typeof Peer === "undefined") {
        reject(new Error("PeerJS 未加载"));
        return;
      }

      this.peer = new Peer();
      this.isHost = false;

      this.peer.on("open", () => {
        this.roomCode = code;
        const conn = this.peer.connect(code, { reliable: true });
        this.attach(conn, resolve, reject);
      });

      this.peer.on("error", reject);

      setTimeout(() => {
        if (!this.connection || !this.connection.open) {
          reject(new Error("连接超时"));
        }
      }, 15000);
    });
  }

  attach(conn, resolve, reject) {
    this.connection = conn;

    conn.on("open", () => {
      this.game.onConnected();
      if (resolve) resolve();
    });

    conn.on("data", data => this.game.onMessage(data));

    conn.on("close", () => {
      this.connection = null;
      this.game.onDisconnected();
    });

    conn.on("error", err => {
      if (reject) reject(err);
    });
  }

  send(data) {
    if (this.connection && this.connection.open) {
      try { this.connection.send(data); } catch (_) {}
    }
  }

  close() {
    try { if (this.connection) this.connection.close(); } catch (_) {}
    try { if (this.peer) this.peer.destroy(); } catch (_) {}
    this.connection = null;
    this.peer = null;
    this.roomCode = "";
  }
}

class Game {
  constructor() {
    this.room = new PeerRoom(this);
    this.state = "menu"; // menu, room, playing, gameover
    this.device = "computer";
    this.roomCode = "";
    this.status = "";
    this.isHost = false;
    this.matchStarted = false;

    this.player = null;
    this.opponent = null;
    this.bullets = [];
    this.keys = {};
    this.mouse = { x: W / 2, y: H / 2, down: false };

    this.mobile = false;
    this.joystick = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };
    this.buttons = [];
    this.lastShot = 0;
    this.shotInterval = 0.14;
    this.lastStateSent = 0;
    this.lastOpponentState = 0;
    this.lastHitSent = 0;
    this.score = 0;

    this.bindEvents();
  }

  bindEvents() {
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      const p = this.pointerPos(e);
      if (this.state !== "playing") {
        this.handleMenuClick(p.x, p.y);
        return;
      }

      if (this.mobile) {
        if (p.x < W * 0.48) {
          this.joystick.active = true;
          this.joystick.id = e.pointerId;
          this.joystick.x = p.x;
          this.joystick.y = p.y;
          this.joystick.dx = 0;
          this.joystick.dy = 0;
        } else {
          this.mouse.x = p.x;
          this.mouse.y = p.y;
          this.mouse.down = true;
        }
      } else {
        this.mouse.x = p.x;
        this.mouse.y = p.y;
        this.mouse.down = true;
      }
    }, { passive: false });

    canvas.addEventListener("pointermove", e => {
      const p = this.pointerPos(e);
      if (this.mobile && this.joystick.active && this.joystick.id === e.pointerId) {
        const dx = p.x - this.joystick.x;
        const dy = p.y - this.joystick.y;
        const len = Math.hypot(dx, dy) || 1;
        const max = Math.min(W, H) * 0.12;
        const scale = Math.min(1, max / len);
        this.joystick.dx = dx / len * scale;
        this.joystick.dy = dy / len * scale;
      } else {
        this.mouse.x = p.x;
        this.mouse.y = p.y;
      }
    });

    const pointerUp = e => {
      if (this.joystick.id === e.pointerId) {
        this.joystick.active = false;
        this.joystick.id = null;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      }
      this.mouse.down = false;
    };
    canvas.addEventListener("pointerup", pointerUp);
    canvas.addEventListener("pointercancel", pointerUp);

    window.addEventListener("keydown", e => {
      this.keys[e.key.toLowerCase()] = true;
      if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      if (e.key === "Escape" && this.state === "playing") this.leaveMatch();
    });

    window.addEventListener("keyup", e => {
      this.keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener("contextmenu", e => e.preventDefault());
  }

  pointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  onConnected() {
    this.status = "Connected. Waiting for host.";
    if (this.room.isHost) this.status = "Room ready. Share the room code.";
  }

  onDisconnected() {
    this.status = "Connection lost.";
    this.opponent = null;
    if (this.state === "playing") this.state = "gameover";
  }

  onMessage(msg) {
    if (!msg || typeof msg.type !== "string") return;

    if (msg.type === "start") {
      this.startMatch(false);
      return;
    }

    if (msg.type === "state") {
      const p = msg.player;
      if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
      this.opponent = {
        x: p.x,
        y: p.y,
        angle: Number.isFinite(p.angle) ? p.angle : 0,
        hp: Number.isFinite(p.hp) ? p.hp : 0,
        maxHp: Number.isFinite(p.maxHp) ? p.maxHp : 20,
        name: String(p.name || "Opponent")
      };
      this.lastOpponentState = performance.now();
      return;
    }

    if (msg.type === "bullet") {
      if (!this.player || !Number.isFinite(msg.x) || !Number.isFinite(msg.y) ||
          !Number.isFinite(msg.dx) || !Number.isFinite(msg.dy)) return;
      if (msg.owner !== this.room.peer?.id) {
        this.bullets.push({
          x: msg.x, y: msg.y, dx: msg.dx, dy: msg.dy,
          radius: 5, enemy: true, active: true
        });
      }
      return;
    }

    if (msg.type === "hit") {
      if (this.player && this.player.hp > 0) {
        this.player.hp = Math.max(0, this.player.hp - clamp(Number(msg.damage) || 1, 0, 5));
        if (this.player.hp <= 0) this.endMatch(false);
      }
      return;
    }

    if (msg.type === "leave") {
      this.opponent = null;
      this.status = "Opponent left.";
    }
  }

  handleMenuClick(x, y) {
    for (const b of this.buttons) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.action();
        return;
      }
    }
  }

  button(x, y, w, h, label, action, color = "#00fff5") {
    this.buttons.push({ x, y, w, h, action });
    ctx.fillStyle = "#15152a";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  async createRoom() {
    this.status = "Creating room…";
    this.isHost = true;
    try {
      this.roomCode = await this.room.host();
      this.state = "room";
      this.status = "Room created. Share the room code.";
    } catch (err) {
      this.status = "Room error: " + (err.message || err);
    }
  }

  async joinRoom() {
    const code = prompt("Enter the host's room code:");
    if (!code) return;

    this.status = "Connecting…";
    this.isHost = false;

    try {
      await this.room.join(code.trim());
      this.roomCode = code.trim();
      this.state = "room";
      this.status = "Connected. Waiting for host.";
    } catch (err) {
      this.status = "Join error: " + (err.message || err);
      this.room.close();
    }
  }

  startMatch(broadcast = true) {
    if (broadcast && !this.room.isHost) return;

    this.state = "playing";
    this.matchStarted = true;
    this.player = {
      x: W * 0.25, y: H * 0.5,
      angle: 0, radius: 18,
      hp: 20, maxHp: 20,
      speed: 4.5
    };
    this.opponent = this.opponent || {
      x: W * 0.75, y: H * 0.5,
      angle: Math.PI, hp: 20, maxHp: 20, name: "Opponent"
    };
    this.bullets = [];
    this.lastShot = 0;
    this.score = 0;

    if (broadcast) this.room.send({ type: "start" });
  }

  leaveMatch() {
    this.room.send({ type: "leave" });
    this.matchStarted = false;
    this.state = "room";
    this.player = null;
    this.opponent = null;
    this.bullets = [];
  }

  endMatch(won) {
    if (this.state === "gameover") return;
    this.state = "gameover";
    this.status = won ? "You win!" : "You were defeated.";
  }

  update() {
    if (this.state !== "playing" || !this.player) return;

    const p = this.player;
    let dx = 0, dy = 0;

    if (this.mobile) {
      dx = this.joystick.dx;
      dy = this.joystick.dy;
    } else {
      if (this.keys.w || this.keys.arrowup) dy -= 1;
      if (this.keys.s || this.keys.arrowdown) dy += 1;
      if (this.keys.a || this.keys.arrowleft) dx -= 1;
      if (this.keys.d || this.keys.arrowright) dx += 1;
    }

    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }

    p.x = clamp(p.x + dx * p.speed, p.radius, W - p.radius);
    p.y = clamp(p.y + dy * p.speed, p.radius, H - p.radius);
    p.angle = Math.atan2(this.mouse.y - p.y, this.mouse.x - p.x);

    const now = performance.now();

    if (this.mouse.down && now - this.lastShot >= this.shotInterval * 1000) {
      this.lastShot = now;
      const bullet = {
        x: p.x + Math.cos(p.angle) * 20,
        y: p.y + Math.sin(p.angle) * 20,
        dx: Math.cos(p.angle) * 10,
        dy: Math.sin(p.angle) * 10,
        radius: 5,
        enemy: false,
        active: true
      };
      this.bullets.push(bullet);
      this.room.send({
        type: "bullet",
        owner: this.room.peer?.id,
        x: bullet.x, y: bullet.y,
        dx: bullet.dx, dy: bullet.dy
      });
    }

    for (const b of this.bullets) {
      if (!b.active) continue;
      b.x += b.dx;
      b.y += b.dy;

      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        b.active = false;
        continue;
      }

      if (b.enemy) {
        if (distance(b, p) < p.radius + b.radius) {
          b.active = false;
          this.room.send({ type: "hit", damage: 1 });
        }
      } else if (this.opponent && this.opponent.hp > 0 &&
                 distance(b, this.opponent) < 18 + b.radius) {
        b.active = false;
        this.score++;
        this.room.send({ type: "hit", damage: 1 });
      }
    }

    this.bullets = this.bullets.filter(b => b.active);

    // Send position/health regularly, but not every frame.
    if (now - this.lastStateSent > 50) {
      this.lastStateSent = now;
      this.room.send({
        type: "state",
        player: {
          x: p.x, y: p.y, angle: p.angle,
          hp: p.hp, maxHp: p.maxHp,
          name: this.room.peer?.id || "Player"
        }
      });
    }

    if (p.hp <= 0) this.endMatch(false);
  }

  drawMenu() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63";
    ctx.font = "bold 32px Arial";
    ctx.fillText("TRIANGLE BATTLE ARENA", W / 2, H * 0.2);

    ctx.fillStyle = "#aaa";
    ctx.font = "15px Arial";
    ctx.fillText(this.status || "Peer-to-peer PVP", W / 2, H * 0.2 + 32);

    const x = W / 2 - 130;
    this.button(x, H * 0.38, 260, 56, "Create room", () => this.createRoom(), "#06d6a0");
    this.button(x, H * 0.38 + 72, 260, 56, "Join room", () => this.joinRoom());
    this.button(x, H * 0.38 + 144, 260, 56, "Mobile controls: " + (this.mobile ? "ON" : "OFF"),
      () => { this.mobile = !this.mobile; }, "#ff9f1c");
  }

  drawRoom() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#00fff5";
    ctx.font = "bold 25px Arial";
    ctx.fillText("ROOM", W / 2, 60);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px monospace";
    ctx.fillText(this.roomCode || "Connecting…", W / 2, 95);

    ctx.fillStyle = "#aaa";
    ctx.font = "14px Arial";
    ctx.fillText(this.status, W / 2, 125);
    ctx.fillText(this.opponent ? "Opponent connected" : "Waiting for opponent…", W / 2, 155);

    if (this.isHost) {
      this.button(W / 2 - 120, H * 0.55, 240, 56, "Start PVP", () => {
        if (!this.room.connection || !this.room.connection.open) {
          this.status = "Wait for an opponent to connect.";
          return;
        }
        this.startMatch(true);
      }, "#06d6a0");
    }

    this.button(W / 2 - 120, H * 0.55 + 72, 240, 56, "Leave room", () => {
      this.room.close();
      this.state = "menu";
      this.status = "";
    }, "#888");
  }

  drawGame() {
    if (!this.player) return;

    if (this.opponent) {
      drawTriangle(this.opponent.x, this.opponent.y, 18,
        this.opponent.angle || 0, "#ff8fa3");
      drawHealthBar(this.opponent.x, this.opponent.y,
        this.opponent.hp, this.opponent.maxHp, "#06d6a0");
    }

    drawTriangle(this.player.x, this.player.y, this.player.radius,
      this.player.angle, "#ff2e63");
    drawHealthBar(this.player.x, this.player.y,
      this.player.hp, this.player.maxHp, "#06d6a0");

    for (const b of this.bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fillStyle = b.enemy ? "#ff8fa3" : "#00fff5";
      ctx.fill();
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "14px Arial";
    ctx.fillText(`HP: ${this.player.hp}/${this.player.maxHp}`, 12, 22);
    ctx.fillText("WASD: move · Mouse: aim/fire · Esc: leave", 12, 42);

    if (this.mobile) {
      const r = Math.min(W, H) * 0.12;
      if (this.joystick.active) {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = "#00fff5";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.joystick.x, this.joystick.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(this.joystick.x + this.joystick.dx * r,
                this.joystick.y + this.joystick.dy * r,
                r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = "#00fff5";
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  drawGameOver() {
    this.buttons = [];
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63";
    ctx.font = "bold 32px Arial";
    ctx.fillText("MATCH OVER", W / 2, H / 2 - 45);
    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.fillText(this.status, W / 2, H / 2);
    this.button(W / 2 - 120, H / 2 + 35, 240, 52, "Back to room", () => {
      this.leaveMatch();
    });
  }

  draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b0c10";
    ctx.fillRect(0, 0, W, H);

    if (this.state === "menu") this.drawMenu();
    else if (this.state === "room") this.drawRoom();
    else if (this.state === "playing") this.drawGame();
    else if (this.state === "gameover") this.drawGameOver();
  }
}

const game = new Game();

function frame() {
  game.update();
  game.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
