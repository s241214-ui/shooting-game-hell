    [x + Math.cos(angle - 2.4) * r, y + Math.sin(angle - 2.4) * r],

class Helper {
  constructor(x, y, equipped) {

    this.equipped = equipped; this.maxHp = 25; this.hp = 25; this.isAlive = true;

    this.shieldHp = 0; this.roamAngle = Math.random() * Math.PI * 2; this.roamTimer = 0;
    this.skillTimer = Math.random() * 2; this.isStriking = false; this.strikeDir = [1, 0];
  }
  takeDamage(n) {
    if (this.isStriking) return;
    if (this.shieldHp > 0) {
      const absorbed = Math.min(this.shieldHp, n);
      this.shieldHp -= absorbed; n -= absorbed;
      if (this.shieldHp < 0) this.shieldHp = 0;
    }
    if (n <= 0) return;
    this.hp -= n;
    if (this.hp <= 0) { this.hp = 0; this.isAlive = false; }
  }
  update(target, enemies, redBullets, redRockets) {
    if (!this.isAlive || !target.isAlive) return;
    const t = now();
    this.roamTimer -= 0.016;
    if (this.roamTimer <= 0) { this.roamAngle = Math.random() * Math.PI * 2; this.roamTimer = 1 + Math.random() * 2; }
    const orbitX = target.x + Math.cos(this.roamAngle) * 140;
    const orbitY = target.y + Math.sin(this.roamAngle) * 140;
    const ox = orbitX - this.x, oy = orbitY - this.y;
    const od = Math.hypot(ox, oy) || 1;
    if (od > 20) { this.x += (ox / od) * this.baseSpeed; this.y += (oy / od) * this.baseSpeed; }
    let best = null, bestD = Infinity;
    for (const e of enemies) {
      if (!e.isAlive) continue;
      const ed = Math.hypot(e.x - this.x, e.y - this.y);
      if (ed < bestD) { bestD = ed; best = e; }
    }
    if (best) this.angle = Math.atan2(best.y - this.y, best.x - this.x);
    if (t - this.lastShot > 0.15) {
      this.lastShot = t;
      const b = new Bullet(this.x, this.y, this.angle, 11, 4, "#bbbbbb", false);
      b.fromHelper = true; b.damageMult = 0.05; redBullets.push(b);
    }
    this.skillTimer -= 0.016;

      } else if (pick === "beam" && t - this.lastBeam > 6 && best) {
        this.lastBeam = t;
        const sb = new StrongBullet(this.x, this.y, this.angle);
        sb.fromHelper = true; sb.speed = 17 * SPEED_MULT * 0.7;
        sb.damageMult = 0.2;
        game.redStrongBullets.push(sb);
      } else if (pick === "shield" && this.shieldHp <= 0 && t - this.lastShield > 30) {
        this.shieldHp = 5; this.lastShield = t;
      } else if (pick === "dash") {
        this.x += Math.cos(this.angle) * 30; this.y += Math.sin(this.angle) * 30;

    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));

  draw() {

    this.preferredDistance = 260;
    this.attackMode = "aim"; this.modeTimer = 0; this.aimDuration = 0.3;
    this.rapidShootTimer = 0; this.rapidShootInterval = 0.1; this.rapidDuration = 3.0;
    this.rapidShootStarted = 0;
    this.powerChargeStart = 0; this.powerChargeDuration = 1.0; this.powerShootDone = false;
    this.isCharging = false; this.isDashing = false; this.chargeStart = 0;
    this.dashDir = [0, 0]; this.dashTravelled = 0; this.dashMaxDist = 0; this.dashHitDone = false;
    this.crashCooldownUntil = 0; this.trail = [];
    this.isDodging = false; this.dodgeDir = [0, 0]; this.dodgeStart = 0;
    this.dodgeDuration = 0.35; this.dodgeCooldown = 0;
    this.aimedAtDuration = 0; this.beingAimedAt = false;
    this.speedBoostUntil = 0; this.sidestepCooldown = 0; this.canShoot = true;
    this.target = null; this.lastTargetChange = 0;
  }
  takeDamage(n = 1) { this.hp -= n; if (this.hp <= 0) { this.hp = 0; this.isAlive = false; } }
  tryDodge(threatX, threatY) {
    const t = now();
    if (t < this.dodgeCooldown) return false;
    if (this.isDodging || this.isDashing || this.isCharging) return false;
    const dx = this.x - threatX, dy = this.y - threatY;
    const d = Math.hypot(dx, dy) || 1;
    this.dodgeDir = [dx / d, dy / d];
    this.isDodging = true; this.dodgeStart = t;
    this.dodgeDuration = 0.35; this.dodgeCooldown = t + 1.2;
    return true;
  }
  trySidestep() {
    const t = now();
    if (t < this.sidestepCooldown) return;
    if (this.isDodging || this.isDashing || this.isCharging) return;
    const side = Math.random() < 0.5 ? 1 : -1;
    const px = -Math.sin(this.angle) * side;
    const py = Math.cos(this.angle) * side;
    this.dodgeDir = [px, py];
    this.isDodging = true; this.dodgeStart = t;
    this.dodgeDuration = 0.4; this.dodgeCooldown = t + 1.2; this.sidestepCooldown = t + 3.5;
  }
  tryDashThroughRed(redX, redY) {
    const t = now();
    if (t < this.sidestepCooldown) return;
    if (this.isDodging || this.isDashing || this.isCharging) return;
    const dx = redX - this.x, dy = redY - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.dodgeDir = [dx / d, dy / d];
    this.isDodging = true; this.dodgeStart = t;
    this.dodgeDuration = 0.3; this.dodgeCooldown = t + 1.0; this.sidestepCooldown = t + 4.0;
  }
  triggerCrash(target) {
    if (this.isCharging || this.isDashing) return;
    this.attackMode = "crash"; this.isCharging = true; this.chargeStart = now();
    const dx = target.x - this.x, dy = target.y - this.y;
    const d = Math.hypot(dx, dy) || 1;
    this.dashDir = [dx / d, dy / d];
    this.dashMaxDist = Math.max(W, H) * 1.5; this.dashTravelled = 0; this.dashHitDone = false;
  }
  updateDash(target, allTargets) {
    const elapsed = now() - this.chargeStart;
    if (this.isCharging) {
      if (elapsed >= 0.4) { this.isCharging = false; this.isDashing = true; }
    } else if (this.isDashing) {
      const sp = this.baseSpeed * 5;
      this.x += this.dashDir[0] * sp; this.y += this.dashDir[1] * sp;
      this.dashTravelled += sp;
      for (const h of (game.player.helpActive ? game.player.helpers : [])) {
          if (h.isAlive && Math.hypot(h.x - this.x, h.y - this.y) < this.radius + h.radius) {
            if (h.isStriking) {
              h.isStriking = false;
              h.x -= this.dashDir[0] * 100; h.y -= this.dashDir[1] * 100;
              h.x = Math.max(h.radius, Math.min(W - h.radius, h.x));
              h.y = Math.max(h.radius, Math.min(H - h.radius, h.y));
              this.startBounce(); this.dashHitDone = true;
            } else { h.takeDamage(10); this.dashHitDone = true; }
          }
      }
      if (!this.dashHitDone) {
        for (const t of allTargets) {
          if (t.isAlive && Math.hypot(t.x - this.x, t.y - this.y) < this.radius + (t.radius||18)) {
             if (t.isStriking) { t.startCrashBounce(this.x, this.y); this.startBounce(); }
             else { t.takeDamage(5); }
             this.dashHitDone = true; break;
          }
        }
      }
      if (this.x < this.radius || this.x > W - this.radius ||
          this.y < this.radius || this.y > H - this.radius ||
          this.dashTravelled >= this.dashMaxDist) {
        this.isDashing = false; this.trail = [];
        this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
        this.crashCooldownUntil = now() + 4;
        this.attackMode = "aim"; this.modeTimer = now() + this.aimDuration;
      }
    }
  }
  startBounce() {
    this.isDashing = false; this.isCharging = false;
    this.x -= this.dashDir[0] * 150; this.y -= this.dashDir[1] * 150;
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
    this.trail = []; this.attackMode = "aim";
    this.modeTimer = now() + this.aimDuration; this.crashCooldownUntil = now() + 3;
  }
  update(target, enemyBullets, allTargets) {
    if (!this.isAlive) return;
    
    // Target Re-evaluation
    const t = now();
    if (!this.target || !this.target.isAlive || t - this.lastTargetChange > 2) {
        this.lastTargetChange = t;
        let closest = null, minDist = Infinity;
        for (const pt of allTargets) {
            if (!pt.isAlive) continue;
            const d = Math.hypot(pt.x - this.x, pt.y - this.y);
            if (d < minDist) { minDist = d; closest = pt; }
        }
        this.target = closest;
    }
    if (!this.target) return;
    target = this.target;

    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    this.angle = Math.atan2(dy, dx);
    if (this.isDodging) {
      const f = (t - this.dodgeStart) / this.dodgeDuration;
      if (f >= 1) this.isDodging = false;
      else {
        const sp = this.baseSpeed * 3;
        this.x += this.dodgeDir[0] * sp; this.y += this.dodgeDir[1] * sp;
        this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
        return;
      }
    }
    if (this.isCharging || this.isDashing) {
      this.trail.push({ x: this.x, y: this.y, a: this.angle, life: 0.35 });
      for (const tr of this.trail) tr.life -= 0.03;
      this.trail = this.trail.filter(t => t.life > 0);
      this.updateDash(target, allTargets);
      return;
    }
    let speed = this.baseSpeed;
    if (t < this.speedBoostUntil) speed *= 1.8;
    if (this.beingAimedAt) {
      this.aimedAtDuration += 0.016;
      if (this.aimedAtDuration > 1.2 && t > this.speedBoostUntil) {
        this.speedBoostUntil = t + 3.0; this.aimedAtDuration = 0;
      }
    } else { this.aimedAtDuration = Math.max(0, this.aimedAtDuration - 0.02); }
    if (dist < 400 && Math.random() < 0.01) this.trySidestep();
    if (dist < 250 && Math.random() < 0.008) this.tryDashThroughRed(target.x, target.y);
    if (dist < this.preferredDistance - 25) { this.x -= (dx / dist) * speed * 0.6; this.y -= (dy / dist) * speed * 0.6; }
    else if (dist > this.preferredDistance + 25) { this.x += (dx / dist) * speed * 0.6; this.y += (dy / dist) * speed * 0.6; }
    else { const px = -dy / dist, py = dx / dist; this.x += px * speed * 0.5; this.y += py * speed * 0.5; }
    if (this.attackMode === "aim") {
      if (t >= this.modeTimer) { this.attackMode = "rapid"; this.rapidShootStarted = t; this.rapidShootTimer = t; }
    } else if (this.attackMode === "rapid") {
      if (t - this.rapidShootStarted > this.rapidDuration) { this.attackMode = "power"; this.powerChargeStart = t; this.powerShootDone = false; }
      else if (this.canShoot && t - this.rapidShootTimer >= this.rapidShootInterval) {
        this.rapidShootTimer = t;
        enemyBullets.push(new Bullet(this.x, this.y, this.angle, 11, 6, "#ffe66d"));
      }
    } else if (this.attackMode === "power") {
      if (t - this.powerChargeStart >= this.powerChargeDuration) {
        const b = new Bullet(this.x, this.y, this.angle, 22, 12, "#ffffff", true);
        b.damageMult = 2; enemyBullets.push(b);
        this.powerShootDone = true;
        if (t > this.crashCooldownUntil && Math.random() < 0.5) this.triggerCrash(target);
        else { this.attackMode = "aim"; this.modeTimer = t + this.aimDuration; }
      }
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));
  }
  draw() {
    for (const tr of this.trail) {
      ctx.globalAlpha = Math.max(0, tr.life / 0.35) * 0.5;
      drawTri(tr.x, tr.y, this.radius * 0.9, tr.a, "#ffffff");
    }
    ctx.globalAlpha = 1;
    let color = "#f9d56e";
    if (this.attackMode === "power") color = (Math.floor(now() * 15) % 2 === 0) ? "#ffddaa" : "#ff8800";
    else if (this.isDodging) color = "#aaffaa";
    else if (this.isCharging) color = (Math.floor(now() * 20) % 2 === 0) ? "#ffffff" : "#ffdddd";
    else if (this.isDashing) color = "#ff5500";
    else if (now() < this.speedBoostUntil) color = "#ffee88";
    drawTri(this.x, this.y, this.radius, this.angle, color);
    drawHpBar(this.x, this.y, this.hp, this.maxHp);
    if (this.isCharging) {
      ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x + this.dashDir[0] * 400, this.y + this.dashDir[1] * 400);
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (this.attackMode === "power") {
      const f = (now() - this.powerChargeStart) / this.powerChargeDuration;
      ctx.strokeStyle = `rgba(255,80,0,${0.4 + 0.6 * f})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 15 + f * 15, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

      if (dist > this.preferredDistance - 40) { this.x += (dx / dist) * this.speed; this.y += (dy / dist) * this.speed; }
      else if (dist < this.preferredDistance - 100) { this.x -= (dx / dist) * this.speed; this.y -= (dy / dist) * this.speed; }

      if (!this.dashHitDone && target.isAlive &&
          Math.hypot(target.x - this.x, target.y - this.y) < this.radius + target.radius + this.radius * 0.5) {
        target.takeDamage(3); this.dashHitDone = true;
      }
      if (this.dashTravelled >= this.dashMaxDist ||

        this.state = "firing"; this.fireCooldown = now() + 2.0;
      }
    }
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));

class Net {
  constructor() {
    this.peer = null; this.isHost = false; this.roomCode = "";
    this.connections = {}; this.myId = "";
    this.onPlayerJoin = null; this.onPlayerLeave = null; this.onData = null;
  }
  host() {
    return new Promise((resolve, reject) => {
      if (this.peer) { try { this.peer.destroy(); } catch(e){} }
      this.peer = new Peer();
      this.isHost = true;
      this.peer.on('open', (id) => { this.myId = id; this.roomCode = id; resolve(id); });
      this.peer.on('error', reject);
      this.peer.on('connection', (conn) => {
        this.connections[conn.peer] = conn;
        conn.on('data', (data) => { if (this.onData) this.onData(conn.peer, data); });
        conn.on('close', () => {
          delete this.connections[conn.peer];
          if (this.onPlayerLeave) this.onPlayerLeave(conn.peer);
        });
        if (this.onPlayerJoin) this.onPlayerJoin(conn.peer);
      });
    });
  }
  join(roomCode) {
    return new Promise((resolve, reject) => {
      if (this.peer) { try { this.peer.destroy(); } catch(e){} }
      this.peer = new Peer();
      this.isHost = false;
      let resolved = false;
      this.peer.on('open', () => {
        this.myId = this.peer.id;
        setTimeout(() => {
          const conn = this.peer.connect(roomCode);
          conn.on('open', () => {
            if (resolved) return; resolved = true;
            this.connections[roomCode] = conn; this.roomCode = roomCode;
            conn.on('data', (data) => { if (this.onData) this.onData(roomCode, data); });
            conn.on('close', () => {
              delete this.connections[roomCode];
              if (this.onPlayerLeave) this.onPlayerLeave(roomCode);
            });
            resolve(roomCode);
          });
          conn.on('error', (err) => { if (!resolved) { resolved = true; reject(err); } });
        }, 1200);
      });
      this.peer.on('error', (err) => { if (!resolved) { resolved = true; reject(err); } });
      setTimeout(() => { if (!resolved) { resolved = true; reject(new Error("连接超时")); } }, 15000);
    });
  }
  broadcast(msg) { for (const id in this.connections) { try { this.connections[id].send(msg); } catch(e){} } }
  sendTo(id, msg) { if (this.connections[id]) { try { this.connections[id].send(msg); } catch(e){} } }
  close() {
    if (this.peer) { try { this.peer.destroy(); } catch(e){} }
    this.peer = null; this.connections = {};
  }
}

  }

  setupJoysticks() {
    const r = Math.min(W, H) * 0.13;
    this.lJoy.r = r; this.rJoy.r = r;
    this.lJoy.cx = r + 20; this.lJoy.cy = H - r - 20;
    this.rJoy.cx = W - r - 20; this.rJoy.cy = H - r - 20;
    this.lJoy.kx = this.lJoy.cx; this.lJoy.ky = this.lJoy.cy;
    this.rJoy.kx = this.rJoy.cx; this.rJoy.ky = this.rJoy.cy;
    this.skillR = 32;
    const y0 = 50;
    this.rocketBtn.cx = W - 40; this.rocketBtn.cy = y0;
    this.powerBtn.cx = W - 110; this.powerBtn.cy = y0;
    this.skillBtns = {};
    this.refreshSkillBtns();
  }

  refreshSkillBtns() {
    this.skillBtns = {};
    let idx = 0;
    const order = ["shield", "strike", "lockon", "fake", "help"];
    for (const key of order) {
      if (this.equippedSkills.includes(key)) {
        this.skillBtns[key] = { cx: W - 180 - idx * 70, cy: 50 };
        idx++;
      }
    }
  }

  async createRoom() {
    if (typeof Peer === "undefined") { alert("PeerJS 未加载"); return; }
    try {
      const code = await this.net.host();
      this.roomCode = code; this.state = "lobby-room";
      this.net.onPlayerJoin = (id) => { console.log("玩家加入:", id); };
      this.net.onPlayerLeave = (id) => { delete this.remotePlayers[id]; };
      this.net.onData = (fromId, data) => this.onNetData(fromId, data);
    } catch (e) { alert("创建房间失败: " + (e.message || e)); }
  }

  async joinRoom() {
    if (typeof Peer === "undefined") { alert("PeerJS 未加载"); return; }
    if (!this.roomInput) { alert("请输入房间号"); return; }
    try {
      await this.net.join(this.roomInput);
      this.roomCode = this.roomInput; this.state = "lobby-room";
      this.net.onData = (fromId, data) => this.onNetData(fromId, data);
    } catch (e) {
      alert("加入失败: " + (e.message || e) + "\n\n若一直失败，可能是网络或公共服务器问题。");
    }
  }

  onNetData(fromId, data) {
    if (!data || !data.type) return;
    if (data.type === "state") { this.remotePlayers[fromId] = data.player; }
    else if (data.type === "hit") { if (this.player && this.player.isAlive) this.player.takeDamage(data.damage); }
    else if (data.type === "bullet") {
      if (this.pvpMode && data.ownerId !== this.net.myId) {
        const b = new Bullet(data.x, data.y, Math.atan2(data.dy, data.dx), 12, data.radius, "#ff8fa3");
        b.damageMult = data.damage; this.enemyBullets.push(b);
      }
    } else if (data.type === "start") {
      this.difficultyKey = data.diff;
      this.difficulty = DIFFICULTIES[data.diff];
      this.pvpMode = data.mode === "pvp";
      this.roomCustom = data.custom || this.roomCustom;
      this.startGame(this.deviceMode, data.diff, this.pvpMode, false);
    } else if (data.type === "custom") { this.roomCustom = data.custom; }
    else if (data.type === "dead") { this.roomPlayersDead[fromId] = true; }
    else if (data.type === "back_to_room") { this.roomPlayersDead = {}; if (this.pvpMode) this.backToRoom(); }
    else if (data.type === "leave") { delete this.remotePlayers[fromId]; }
    else if (data.type === "assign_color") { 
        if (this.player) this.player.color = data.color;
        this.playerColor = data.color;
    }
    else if (data.type === "set_name") {
        this.remotePlayers[fromId] = this.remotePlayers[fromId] || {};
        this.remotePlayers[fromId].name = data.name;
    }
  }

  syncState() {
    if (!this.player) return;
    this.net.broadcast({
      type: "state",
      player: { x: this.player.x, y: this.player.y, angle: this.player.angle, hp: this.player.hp, maxHp: this.player.maxHp, name: this.nameInput || "Player", color: this.player.color }
    });
  }

  startGame(deviceMode, diffKey, pvpMode, isBroadcast = true) {
    this.touchMode = deviceMode === "mobile";
    this.difficultyKey = diffKey;
    this.difficulty = DIFFICULTIES[diffKey];
    this.pvpMode = pvpMode;
    this.roomPlayersDead = {};
    this.state = "playing";
    this.returnToModeOnAnyInput = false;
    if (this.touchMode) this.setupJoysticks();
    this.resetPlay();
    if (isBroadcast) {
      this.net.broadcast({ type: "start", diff: diffKey, mode: pvpMode ? "pvp" : "coop", custom: this.roomCustom });
    }
  }

  resetPlay() {
    const d = this.difficulty;
    let startX = 200, startY = H/2;
    this.player = new PlayerRed(startX, startY, d.playerHp, this.net.myId);
    if (this.playerColor) this.player.color = this.playerColor;
    this.player.score = this.marks;
    this.player.equipped = [...this.equippedSkills];
    this.player.pvpMode = this.pvpMode;
    if (this.pvpMode) {
      this.player.equipped = this.player.equipped.filter(k => {
        if (k === "fake" || k === "help" || k === "lockon" || k === "rocket") return false;
        if (k === "shield" && !this.roomCustom.allowShield) return false;
        if (k === "strike" && !this.roomCustom.allowStrike) return false;
        return true;
      });
    }
    this.refreshSkillBtns();
    this.redBullets = []; this.redStrongBullets = []; this.redRockets = [];
    this.enemyBullets = []; this.enemyRockets = []; this.isShooting = false;
    this.enemies = [];
    if (!this.pvpMode) {
      const totalStart = d.startEnemies.yellow + d.startEnemies.purple + d.startEnemies.green;
      const spawnPoints = this.makeSpawnLayout(totalStart);
      let i = 0;
      for (let n = 0; n < d.startEnemies.yellow; n++) this.enemies.push(new YellowTriangle(...spawnPoints[i++], 77));
      for (let n = 0; n < d.startEnemies.purple; n++) this.enemies.push(new PurpleTriangle(...spawnPoints[i++]));
      for (let n = 0; n < d.startEnemies.green; n++) this.enemies.push(new GreenTriangle(...spawnPoints[i++]));
    }
  }

  makeSpawnLayout(count) {
    const pts = [];
    if (!count) return pts;
    const rightEdge = Math.max(W*0.6, W-250);
    for (let i = 0; i < count; i++) {
      const col = i % 3, row = Math.floor(i/3);
      const x = rightEdge + col*30 + Math.random()*20;
      const y = 100 + row*80 + Math.random()*40;
      pts.push([Math.min(x, W-40), Math.min(y, H-60)]);
    }
    return pts;
  }

  chooseEnemyTypeToSpawn() {
    const d = this.difficulty;
    const alive = this.enemies.filter(e => e.isAlive);
    const counts = {
      yellow: alive.filter(e => e instanceof YellowTriangle).length,
      purple: alive.filter(e => e instanceof PurpleTriangle).length,
      green: alive.filter(e => e instanceof GreenTriangle).length,
    };
    const nonY = counts.purple + counts.green;
    const pool = [];
    if (nonY < 5) {
      if (counts.purple < d.maxEnemies.purple) pool.push("purple");
      if (counts.green < d.maxEnemies.green) pool.push("green");
    }
    const yUnlocked = d.scoreForYellow !== null && this.player.score >= d.scoreForYellow
      && d.maxEnemies.yellow > 0 && counts.yellow < d.maxYellowsOnScreen;
    if (yUnlocked) pool.push("yellow");
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  spawnRandomEnemy() {
    const type = this.chooseEnemyTypeToSpawn();
    if (!type) return null;
    let x, y, attempts = 0;
    do {
      const side = Math.floor(Math.random()*4);
      if (side === 0) { x = 50+Math.random()*(W-100); y = 30; }
      else if (side === 1) { x = 50+Math.random()*(W-100); y = H-30; }
      else if (side === 2) { x = 30; y = 50+Math.random()*(H-100); }
      else { x = W-30; y = 50+Math.random()*(H-100); }
      attempts++;
    } while (attempts < 30 && this.enemies.some(e => e.isAlive && Math.hypot(e.x-x, e.y-y) < (e.radius+30)));
    if (type === "yellow") return new YellowTriangle(x, y, 77);
    if (type === "purple") return new PurpleTriangle(x, y);
    if (type === "green") return new GreenTriangle(x, y);
    return null;
  }

  backToRoom() {
    this.net.broadcast({ type: "back_to_room" });
    this.state = "lobby-room";
    this.player = null; this.enemies = [];
    this.redBullets = []; this.redStrongBullets = []; this.redRockets = [];
    this.enemyBullets = []; this.enemyRockets = [];
    this.pvpMode = false; this.roomPlayersDead = {};
  }

  onPointerDown(id, x, y) {
    if (this.state !== "playing") {
      for (const b of this.buttons) {
        if (x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h) { b.action(); return; }
      }
      return;
    }
    if (this.returnToModeOnAnyInput) {
      this.returnToModeOnAnyInput = false;
      this.marks = this.player.score;
      this.state = "difficulty";
      return;
    }
    if (this.player && this.player.lockonSelecting) {
      this.player.lockonPath.push({ x, y, r: 80 });
      setTimeout(() => { if (this.player && this.player.lockonSelecting) this.player.commitLockon(); }, 400);
      return;
    }
    if (!this.touchMode) {
      if (id === "mouse" && this.player.isAlive) {
          if (this.player.rocketAiming) {
              this.player.rocketAimStart = [this.player.x, this.player.y];
              this.player.rocketAimEnd = [x, y];
          } else {
              this.isShooting = true;
          }
      }
      return;
    }
    for (const [skillKey, btn] of Object.entries(this.skillBtns)) {
      if (Math.hypot(x-btn.cx, y-btn.cy) < this.skillR) {
        this.touches.set(id, skillKey);
        if (skillKey === "shield") this.player.activateShield();
        else if (skillKey === "strike") this.player.tryArmStrike();
        else if (skillKey === "lockon") this.player.activateLockon();
        else if (skillKey === "fake") this.player.activateFake();
        else if (skillKey === "help") this.player.activateHelp();
        return;
      }
    }
    if (Math.hypot(x-this.rocketBtn.cx, y-this.rocketBtn.cy) < this.skillR) {
      this.touches.set(id, "rocket");
      if (this.player.isAlive) this.player.startRocketAim();
      return;
    }
    if (Math.hypot(x-this.powerBtn.cx, y-this.powerBtn.cy) < this.skillR) {
      this.touches.set(id, "power");
      if (this.player.isAlive) {
        if (this.rightFiring) this.powerShotPending = true;
        else {
          const sb = this.player.fireStrongBullet(this.enemies);
          if (sb) { this.redStrongBullets.push(sb); this.net.broadcast({ type:"bullet", ownerId:this.net.myId, x:sb.x, y:sb.y, dx:sb.dx, dy:sb.dy, radius:sb.radius, damage:2 }); }
        }
      }
      return;
    }
    if (Math.hypot(x-this.lJoy.cx, y-this.lJoy.cy) < this.lJoy.r*1.6) {
      this.touches.set(id, "ljoy"); this.lJoy.active = true; this.updateLJoy(x, y); return;
    }
    if (Math.hypot(x-this.rJoy.cx, y-this.rJoy.cy) < this.rJoy.r*1.6) {
      this.touches.set(id, "rjoy"); this.rJoy.active = true; this.rightFiring = true; this.updateRJoy(x, y); return;
    }
    if (x > W/2) { this.touches.set(id, "rjoy"); this.rJoy.active = true; this.rightFiring = true; this.updateRJoy(x, y); }
    else { this.touches.set(id, "ljoy"); this.lJoy.active = true; this.updateLJoy(x, y); }
  }
  onPointerMove(id, x, y) {
    if (this.state !== "playing") return;
    if (!this.touchMode) { 
        if (id === "mouse") {
            this.mousePos = [x, y];
            if (this.player && this.player.rocketAiming) {
                this.player.rocketAimEnd = [x, y];
            }
        }
        return; 
    }
    const t = this.touches.get(id);
    if (t === "ljoy") this.updateLJoy(x, y);
    else if (t === "rjoy") this.updateRJoy(x, y);
    else if (t === "rocket" && this.player && this.player.rocketAiming) {
        this.player.rocketAimEnd = [x, y];
    }
  }
  onPointerUp(id) {
    if (this.state !== "playing") return;
    if (!this.touchMode) { 
        if (id === "mouse") { 
            this.isShooting = false; 
            if (this.player && this.player.rocketAiming) {
                this.redRockets.push(...this.player.releaseRockets(this.enemies));
            }
        } 
        return; 
    }
    const t = this.touches.get(id);
    if (t === "ljoy") { this.lJoy.active = false; this.leftMoveDir = [0,0]; this.lJoy.kx = this.lJoy.cx; this.lJoy.ky = this.lJoy.cy; }
    else if (t === "rjoy") {
      this.rJoy.active = false; this.rightFiring = false;
      this.rJoy.kx = this.rJoy.cx; this.rJoy.ky = this.rJoy.cy;
      if (this.player.strikePending) this.player.beginStrike(this.rightAimAngle);
      if (this.powerShotPending && this.player.isAlive) {
        this.powerShotPending = false;
        const sb = this.player.fireStrongBullet(this.enemies);
        if (sb) { this.redStrongBullets.push(sb); this.net.broadcast({ type:"bullet", ownerId:this.net.myId, x:sb.x, y:sb.y, dx:sb.dx, dy:sb.dy, radius:sb.radius, damage:2 }); }
      }
    } else if (t === "rocket" && this.player && this.player.rocketAiming) {
        this.redRockets.push(...this.player.releaseRockets(this.enemies));
    }
    this.touches.delete(id);
  }
  updateLJoy(x, y) {
    let dx = x - this.lJoy.cx, dy = y - this.lJoy.cy;
    const d = Math.hypot(dx, dy);
    if (d > this.lJoy.r) { dx = dx/d*this.lJoy.r; dy = dy/d*this.lJoy.r; }
    this.lJoy.kx = this.lJoy.cx + dx; this.lJoy.ky = this.lJoy.cy + dy;
    const nd = Math.hypot(dx, dy);
    this.leftMoveDir = nd > 5 ? [dx/nd, dy/nd] : [0,0];
  }
  updateRJoy(x, y) {
    let dx = x - this.rJoy.cx, dy = y - this.rJoy.cy;
    const d = Math.hypot(dx, dy);
    if (d > this.rJoy.r) { dx = dx/d*this.rJoy.r; dy = dy/d*this.rJoy.r; }
    this.rJoy.kx = this.rJoy.cx + dx; this.rJoy.ky = this.rJoy.cy + dy;
    if (d > 5) this.rightAimAngle = Math.atan2(dy, dx);
  }
  onKey(k, isDown) {
    k = k.toLowerCase();
    this.keys[k] = isDown;
    if (isDown && this.returnToModeOnAnyInput) {
      this.returnToModeOnAnyInput = false;
      this.marks = this.player.score;
      this.state = "difficulty";
      return;
    }
    if (!isDown || this.state !== "playing" || !this.player || !this.player.isAlive) return;
    if (this.touchMode) return;
    if (k === "c") {
      const sb = this.player.fireStrongBullet(this.enemies);
      if (sb) { this.redStrongBullets.push(sb); this.net.broadcast({ type:"bullet", ownerId:this.net.myId, x:sb.x, y:sb.y, dx:sb.dx, dy:sb.dy, radius:sb.radius, damage:2 }); }
    } else if (k === "e") {
        if (!this.player.rocketAiming) this.player.startRocketAim();
    }
    else if (k === "q") this.player.activateShield();
    else if (k === "f") { this.player.tryArmStrike(); if (this.player.strikePending) this.player.beginStrike(this.player.angle); }
    else if (k === "r") {
      this.player.activateLockon();
      if (this.player.lockonSelecting) {
        this.player.lockonPath.push({ x: this.mousePos[0], y: this.mousePos[1], r: 80 });
        this.player.commitLockon();
      }
    } else if (k === "g") this.player.activateFake();
    else if (k === "h") this.player.activateHelp();
    else if (k === " ") this.player.triggerDash();
  }
  onKeyUp(k) {
      k = k.toLowerCase();
      if (this.state === "playing" && !this.touchMode && this.player && k === "e") {
          if (this.player.rocketAiming) {
              this.redRockets.push(...this.player.releaseRockets(this.enemies));
          }
      }
  }

  update() {
    if (this.state !== "playing" || !this.player) return;
    const aimAngle = this.touchMode ? this.rightAimAngle :
      Math.atan2(this.mousePos[1]-this.player.y, this.mousePos[0]-this.player.x);
    const t = now();
    this.player.updateLockon();
    if (!this.player.isStriking && !this.player.rocketAiming) {
      const firing = (!this.touchMode && this.isShooting) || (this.touchMode && this.rightFiring);
      if (firing && this.player.isAlive && t - this.lastAutoShootTime >= this.autoShootInterval) {
        this.lastAutoShootTime = t;
        const bullet = new Bullet(this.player.x, this.player.y, aimAngle, 12, 5, "#00fff5");
        bullet.ownerId = this.net.myId;
        if (this.pvpMode) bullet.damageMult = 0.2;
        this.redBullets.push(bullet);
        this.net.broadcast({ type:"bullet", ownerId:this.net.myId, x:bullet.x, y:bullet.y, dx:bullet.dx, dy:bullet.dy, radius:bullet.radius, damage:bullet.damageMult });
      }
    }
    let dx = 0, dy = 0;
    if (this.touchMode) [dx, dy] = this.leftMoveDir;
    else {
      if (this.keys["w"] || this.keys["arrowup"]) dy -= 1;
      if (this.keys["s"] || this.keys["arrowdown"]) dy += 1;
      if (this.keys["a"] || this.keys["arrowleft"]) dx -= 1;
      if (this.keys["d"] || this.keys["arrowright"]) dx += 1;
    }
    if (dx || dy) { const n = Math.hypot(dx, dy); this.player.move(dx/n, dy/n, aimAngle); }
    else this.player.move(0, 0, aimAngle);
    this.player.updateStrike();
    this.player.updateFake();

    if (t - this.lastSyncTime > 0.05) { this.lastSyncTime = t; this.syncState(); }

    if (!this.pvpMode) {
      if (this.player.helpActive) {
        if (t - this.player.helpStart >= this.player.helpDuration) {
          this.player.helpActive = false; this.player.helpLastUsed = t; this.player.helpers = [];
        } else {
          let allDead = true;
          for (const h of this.player.helpers) { h.update(this.player, this.enemies, this.redBullets, this.redRockets); if (h.isAlive) allDead = false; }
          if (allDead) { this.player.helpActive = false; this.player.helpLastUsed = t; this.player.helpers = []; }
        }
      }
      if (this.player.isStriking) {
        const sr = this.player.radius * 1.5;
        for (const e of this.enemies) if (e.isAlive && Math.hypot(this.player.x-e.x, this.player.y-e.y) < e.radius+sr) e.takeDamage(99);
      }
      const yellows = this.enemies.filter(e => e instanceof YellowTriangle && e.isAlive);
      const yShoot = yellows.slice(0, 5);
      for (const y of yellows) y.canShoot = yShoot.includes(y);
      for (const y of yellows) {
        const ang = Math.atan2(y.y-this.player.y, y.x-this.player.x);
        let diff = ang - aimAngle;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        y.beingAimedAt = Math.abs(diff) < 0.18;
      }
      const newEnemies = [];
      const allTargets = [this.player, ...(this.player.helpActive ? this.player.helpers : [])];
      for (const e of this.enemies) {
        if (e instanceof YellowTriangle) e.update(this.player, this.enemyBullets, allTargets);
        else if (e instanceof GreenTriangle) e.update(this.player, this.enemyBullets, allTargets);
        else e.update(this.player, this.enemyBullets, allTargets);
        if (e instanceof YellowTriangle && e.isAlive) {
          for (const sb of this.redStrongBullets) if (sb.active && Math.hypot(sb.x-e.x, sb.y-e.y) < 200) { e.tryDodge(sb.x, sb.y); break; }
          if (!e.isDodging) for (const r of this.redRockets) if (r.active && Math.hypot(r.x-e.x, r.y-e.y) < 140) { e.tryDodge(r.x, r.y); break; }
        }
        if (e.isAlive) newEnemies.push(e);
        else { this.player.score += 100; this.player.onKill(); const resp = this.spawnRandomEnemy(); if (resp) newEnemies.push(resp); }
      }
      this.enemies = newEnemies;
      if (this.player.fakeActive && this.player.fakeMode === "follow") {
        if (t - (this.player.lastFakeOrbShot || 0) > 0.3) {
          this.player.lastFakeOrbShot = t;
          const rr = this.player.radius + 20;
          for (let i = 0; i < 2; i++) {
            const a = this.player.fakeOrbsAngle + i*Math.PI;
            const ox = this.player.x + Math.cos(a)*rr, oy = this.player.y + Math.sin(a)*rr;
            const b = new Bullet(ox, oy, aimAngle, 11, 4, "#c77dff", false);
            b.fromHelper = true; b.damageMult = 0.1;
            this.redBullets.push(b);
          }
        }
      }
    }

    for (const b of this.redBullets) b.update();
    for (const b of this.redStrongBullets) b.update();
    for (const r of this.redRockets) r.update();
    for (const b of this.enemyBullets) b.update();
    for (const r of this.enemyRockets) r.update();

    if (this.pvpMode) {
      for (const id in this.remotePlayers) {
        const rp = this.remotePlayers[id];
        if (!rp || rp.hp <= 0) continue;
        for (const b of this.redBullets) {
          if (b.active && Math.hypot(b.x-rp.x, b.y-rp.y) < 18 + b.radius) { b.active = false; this.net.sendTo(id, { type:"hit", damage:0.2 }); }
        }
        for (const sb of this.redStrongBullets) {
          if (sb.active && Math.hypot(sb.x-rp.x, sb.y-rp.y) < 18 + sb.radius) { this.net.sendTo(id, { type:"hit", damage:3 }); }
        }
      }
      if (this.player.isStriking && (!this._lastCrashHit || t - this._lastCrashHit > 0.3)) {
        for (const id in this.remotePlayers) {
          const rp = this.remotePlayers[id];
          if (rp && Math.hypot(this.player.x-rp.x, this.player.y-rp.y) < this.player.radius + 18) {
            this.net.sendTo(id, { type:"hit", damage:5 }); this._lastCrashHit = t;
          }
        }
      }
    } else {
      for (const b of this.redBullets) {
        if (!b.active) continue;
        for (const e of this.enemies) {
          if (e.isAlive && Math.hypot(b.x-e.x, b.y-e.y) < e.radius+b.radius) {
            const dmg = (b.lockOnTarget === e ? b.damageMult : 1) * (b.fromHelper ? 0.05 : 1);
            e.takeDamage(dmg); if (!b.piercing) b.active = false; break;
          }
        }
      }
      for (const sb of this.redStrongBullets) {
        if (!sb.active) continue;
        for (const e of this.enemies) {
          if (e.isAlive && Math.hypot(sb.x-e.x, sb.y-e.y) < e.radius+sb.radius) {
            const dmg = sb.lockOnTarget === e ? 99*sb.damageMult : 99;
            e.takeDamage(sb.fromHelper ? dmg*0.2 : dmg);
          }
        }
      }
      for (const r of this.redRockets) {
        if (!r.active) continue;
        for (const e of this.enemies) {
          if (e.isAlive && Math.hypot(r.x-e.x, r.y-e.y) < e.radius+r.radius) { r.active = false; e.takeDamage(r.damage*2); break; }
        }
      }
      if (this.player.isAlive) {
        for (const b of this.enemyBullets) {
          if (b.active && Math.hypot(b.x-this.player.x, b.y-this.player.y) < this.player.radius+b.radius) {
            if (!b.piercing) b.active = false;
            this.player.takeDamage(b.damageMult || 1);
          }
        }
        for (const r of this.enemyRockets) {
          if (r.active && Math.hypot(r.x-this.player.x, r.y-this.player.y) < this.player.radius+r.radius) { r.active = false; this.player.takeDamage(1); }
        }
      }
    }

    this.redBullets = this.redBullets.filter(b => b.active);
    this.redStrongBullets = this.redStrongBullets.filter(b => b.active);
    this.redRockets = this.redRockets.filter(r => r.active);
    this.enemyBullets = this.enemyBullets.filter(b => b.active);
    this.enemyRockets = this.enemyRockets.filter(r => r.active);
    if (!this.player.isAlive && !this.returnToModeOnAnyInput) {
      this.marks = this.player.score; this.returnToModeOnAnyInput = true;
      if (this.pvpMode && this.net.peer) {
        this.net.broadcast({ type: "dead" });
        setTimeout(() => { if (this.pvpMode) this.backToRoom(); }, 1500);
      }
    }
  }

  draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b0c10"; ctx.fillRect(0, 0, W, H);
    if (this.state === "device") return this.drawDeviceSelect();
    if (this.state === "lobby") return this.drawLobby();
    if (this.state === "lobby-room") return this.drawLobbyRoom();
    if (this.state === "control") return this.drawControlSelect();
    if (this.state === "difficulty") return this.drawDifficultySelect();
    if (this.state === "shop") return this.drawShop();
    if (this.state === "settings") return this.drawSettings();

    // ===== PLAYING =====
    if (this.player.lockonSelecting) { /* ... existing overlay ... */ }
    const t = now();
    
    if (this.player.rocketAiming) {
        const dist = Math.hypot(this.player.rocketAimEnd[0]-this.player.rocketAimStart[0], this.player.rocketAimEnd[1]-this.player.rocketAimStart[1]);
        const r = Math.max(20, dist);
        const cx = this.player.rocketAimEnd[0], cy = this.player.rocketAimEnd[1];
        ctx.strokeStyle = "rgba(255,0,0,0.5)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = "rgba(0,255,0,0.2)";
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        
        for (const e of this.enemies) {
            if (e.isAlive && Math.hypot(e.x-cx, e.y-cy) < r + e.radius) {
                ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius+5, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = "#ff0000"; ctx.font = "bold 14px Helvetica"; ctx.textAlign = "center";
                ctx.fillText("LOCKED", e.x, e.y - e.radius - 10);
            }
        }
    }

    for (const c of this.player.lockonCircles) {
      const remain = c.expire - t;
      if (remain > 0) {
        ctx.strokeStyle = `rgba(0,255,245,${Math.min(1, remain/2)})`; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const e of this.player.lockonLocked) {
      if (e.isAlive) { ctx.strokeStyle = "#00fff5"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius+8, 0, Math.PI*2); ctx.stroke(); }
    }
    if (this.player.isStriking) {
      for (const tr of this.player.strikeTrail) { ctx.globalAlpha = Math.max(0, tr.life/0.25)*0.7; drawTri(tr.x, tr.y, this.player.radius, tr.a, "#ffffff"); }
      ctx.globalAlpha = 1;
    }
    for (const h of this.player.helpers) h.draw();
    for (const id in this.remotePlayers) {
      const rp = this.remotePlayers[id];
      if (rp && rp.x !== undefined) {
        drawTri(rp.x, rp.y, 18, rp.angle || 0, rp.color || "#ff8fa3");
        drawHpBar(rp.x, rp.y, rp.hp || 20, rp.maxHp || 20, "#06d6a0");
        ctx.fillStyle = "#ffffff"; ctx.font = "10px Helvetica"; ctx.textAlign = "center";
        ctx.fillText(rp.name || "P2", rp.x, rp.y - 40); ctx.textAlign = "left";
      }
    }
    if (this.player.isAlive) {
      let color = this.player.color;
      if (this.player.isStriking) color = "#ffffff";
      else if (now() < this.player.dashEndTime) color = "#ff8fa3";
      else if (this.player.shieldHp > 0) color = "#06d6a0";
      if (this.player.shieldHp > 0) { ctx.strokeStyle = "#06d6a0"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.player.x, this.player.y, this.player.radius+6, 0, Math.PI*2); ctx.stroke(); }
      drawTri(this.player.x, this.player.y, this.player.radius, this.player.angle, color);
      drawHpBar(this.player.x, this.player.y, this.player.hp, this.player.maxHp, "#06d6a0");
      if (this.player.strikePending) {
        const ex = this.player.x + Math.cos(this.rightAimAngle)*300;
        const ey = this.player.y + Math.sin(this.rightAimAngle)*300;
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(this.player.x, this.player.y); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const e of this.enemies) if (e.isAlive) e.draw();
    for (const b of this.redBullets) b.draw();
    for (const b of this.redStrongBullets) b.draw();
    for (const r of this.redRockets) r.draw();
    for (const b of this.enemyBullets) b.draw();
    for (const r of this.enemyRockets) r.draw();
    if (this.touchMode) {
      this.drawJoystick(this.lJoy, "#00fff5", "#334455");
      this.drawJoystick(this.rJoy, "#ff2e63", "#553344");
      if (this.rJoy.active) {
        const ex = this.rJoy.cx + Math.cos(this.rightAimAngle)*(this.rJoy.r+20);
        const ey = this.rJoy.cy + Math.sin(this.rightAimAngle)*(this.rJoy.r+20);
        ctx.setLineDash([5, 5]); ctx.strokeStyle = "#ff2e63"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(this.rJoy.cx, this.rJoy.cy); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // 技能按钮
    const rkLeft = this.player.rocketCd - (t - this.player.lastRocketTime);
    const sbLeft = this.player.strongBulletCd - (t - this.player.lastStrongBulletTime);
    this.drawSkillButton(this.rocketBtn, "rocket", "E", Math.max(0, rkLeft/this.player.rocketCd), this.touchesValueHas("rocket"));
    this.drawSkillButton(this.powerBtn, "power", "C", Math.max(0, sbLeft/this.player.strongBulletCd), this.touchesValueHas("power"));
    for (const [key, btn] of Object.entries(this.skillBtns)) {
      let cdFrac = 0, glow = false;
      if (key === "shield") { cdFrac = this.player.shieldHp > 0 ? 0 : Math.max(0, (this.player.shieldCd - (t-this.player.shieldLastUsed))/this.player.shieldCd); glow = this.player.shieldHp > 0; }
      else if (key === "strike") { cdFrac = Math.max(0, (this.player.strikeCd - (t-this.player.strikeLastUsed))/this.player.strikeCd); glow = this.player.strikePending || this.player.isStriking; }
      else if (key === "lockon") { cdFrac = Math.max(0, (this.player.lockonCd - (t-this.player.lockonLastUsed))/this.player.lockonCd); glow = this.player.lockonActive || this.player.lockonSelecting; }
      else if (key === "fake") { cdFrac = this.player.fakeActive ? 0 : Math.max(0, (this.player.fakeCd - (t-this.player.fakeLastUsed))/this.player.fakeCd); glow = this.player.fakeActive; }
      else if (key === "help") { cdFrac = this.player.helpActive ? 0 : Math.max(0, (this.player.helpCd - (t-this.player.helpLastUsed))/this.player.helpCd); glow = this.player.helpActive; }
      this.drawSkillButton(btn, key, this.skillLabel(key), cdFrac, this.touchesValueHas(key), glow);
    }
    this.drawHud();
    if (!this.player.isAlive) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ff2e63"; ctx.font = "bold 28px Helvetica"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("GAME OVER", W/2, H/2-40);
      ctx.font = "16px Helvetica"; ctx.fillStyle = "#ddd";
      ctx.fillText(`Marks: ${this.player.score}  |  Kills: ${this.player.kills}`, W/2, H/2);
      ctx.fillStyle = "#00fff5";
      ctx.fillText(this.pvpMode ? "回房间中..." : "按任意键 / 点击返回", W/2, H/2+40);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    }
  }

  // ===== 设备选择 =====
  drawDeviceSelect() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63"; ctx.font = "bold 34px Helvetica";
    ctx.fillText("TRIANGLE BATTLE ARENA", W/2, 100);
    ctx.fillStyle = "#e0e0e0"; ctx.font = "18px Helvetica";
    ctx.fillText("Select Device Mode", W/2, 140);
    const bw = 260, bh = 100;
    const bx1 = W/2 - bw - 20, by = 200;
    const bx2 = W/2 + 20;
    this.drawBtn(bx1, by, bw, bh, "#00fff5", "📱 手机模式");
    this.buttons.push({ x: bx1, y: by, w: bw, h: bh, action: () => {
      this.deviceMode = "mobile"; this.touchMode = true; this.state = "lobby";
    }});
    this.drawBtn(bx2, by, bw, bh, "#ff2e63", "💻 电脑模式");
    this.buttons.push({ x: bx2, y: by, w: bw, h: bh, action: () => {
      this.deviceMode = "computer"; this.touchMode = false; this.state = "lobby";
    }});
    ctx.fillStyle = "#666"; ctx.font = "13px Helvetica";
    ctx.fillText("手机：触屏双摇杆", W/2 - 130, by + 130);
    ctx.fillText("电脑：键盘 + 鼠标", W/2 + 130, by + 130);
  }

  drawLobby() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63"; ctx.font = "bold 34px Helvetica";
    ctx.fillText("联机大厅", W/2, 80);
    ctx.fillStyle = "#888"; ctx.font = "14px Helvetica";
    ctx.fillText(this.deviceMode === "mobile" ? "📱 手机模式" : "💻 电脑模式", W/2, 110);
    const bw = 260, bh = 60;
    const bx = (W-bw)/2, by = 150;
    this.drawBtn(bx, by, bw, bh, "#06d6a0", "创建房间");
    this.buttons.push({ x: bx, y: by, w: bw, h: bh, action: () => this.createRoom() });
    this.drawBtn(bx, by + 75, bw, bh, "#00fff5", "加入房间");
    this.buttons.push({ x: bx, y: by + 75, w: bw, h: bh, action: () => {
      const code = prompt("请输入房间号：");
      if (code) { this.roomInput = code.trim(); this.joinRoom(); }
    }});
    this.drawBtn(bx, by + 150, bw, bh, "#ff9f1c", "单机模式");
    this.buttons.push({ x: bx, y: by + 150, w: bw, h: bh, action: () => { this.state = "difficulty"; } });
    
    this.drawBtn(bx, by + 225, bw, bh, "#c77dff", "设置");
    this.buttons.push({ x: bx, y: by + 225, w: bw, h: bh, action: () => { this.state = "settings"; } });
    
    this.drawBtn(bx, by + 300, bw, bh, "#888", "返回设备选择");
    this.buttons.push({ x: bx, y: by + 300, w: bw, h: bh, action: () => { this.state = "device"; } });
  }

  drawSettings() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63"; ctx.font = "bold 26px Helvetica";
    ctx.fillText("设置", W/2, 50);
    const bw = 260, bh = 60;
    const bx = (W-bw)/2, by = 150;
    
    this.drawBtn(bx, by, bw, bh, "#00fff5", `游戏速度: ${this.speedMult}x`);
    this.buttons.push({ x: bx, y: by, w: bw, h: bh, action: () => {
      this.speedMult = this.speedMult >= 3 ? 1 : this.speedMult + 0.5;
      window.SPEED_MULT = this.speedMult;
    }});
    
    this.drawBtn(bx, by + 75, bw, bh, "#888", "返回");
    this.buttons.push({ x: bx, y: by + 75, w: bw, h: bh, action: () => { this.state = "lobby"; } });
  }

  drawLobbyRoom() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#00fff5"; ctx.font = "bold 26px Helvetica";
    ctx.fillText("房间", W/2, 40);
    ctx.fillStyle = "#ffd166"; ctx.font = "13px Helvetica";
    ctx.fillText("房间号（发给朋友）", W/2, 70);
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 17px monospace";
    ctx.fillText(this.roomCode || "", W/2, 95);
    ctx.fillStyle = "#aaa"; ctx.font = "12px Helvetica";
    ctx.fillText(`已连接：${Object.keys(this.net.connections).length + 1} 人`, W/2, 118);

    // 自定义面板
    const cw = Math.min(400, W - 40), ch = 240;
    const cx = (W - cw) / 2, cy = 140;
    ctx.fillStyle = "#15152a"; ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 2; ctx.strokeRect(cx, cy, cw, ch);
    ctx.fillStyle = "#c77dff"; ctx.font = "bold 14px Helvetica"; ctx.textAlign = "center";
    ctx.fillText(this.net.isHost ? "房间设置（点击切换）" : "房间设置（房主控制）", cx + cw/2, cy + 22);

    const opts = [
      { key: "allowShield", label: "护盾 Shield" },
      { key: "allowStrike", label: "冲撞 Strike" },
      { key: "allowLockon", label: "锁定 Lockon", pvpBlock: true },
      { key: "allowRocket", label: "火箭 Rocket", pvpBlock: true },
      { key: "allowFake", label: "假影 Fake", pvpBlock: true },
      { key: "allowHelp", label: "助手 Help", pvpBlock: true },
    ];
    const colW = (cw - 30) / 2;
    ctx.textAlign = "left";
    opts.forEach((opt, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const ox = cx + 15 + col * colW;
      const oy = cy + 45 + row * 32;
      const on = this.roomCustom[opt.key];
      ctx.fillStyle = on ? "#06d6a0" : "#444";
      ctx.fillRect(ox, oy - 12, 16, 16);
      if (on) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ox + 2, oy - 6); ctx.lineTo(ox + 7, oy - 1); ctx.lineTo(ox + 14, oy - 12); ctx.stroke();
      }
      ctx.fillStyle = opt.pvpBlock ? "#ff9f1c" : "#ddd"; ctx.font = "11px Helvetica";
      ctx.fillText(opt.label + (opt.pvpBlock ? " (PVP禁)" : ""), ox + 22, oy);
      if (this.net.isHost) {
        this.buttons.push({ x: ox, y: oy - 14, w: colW - 10, h: 20, action: () => {
          this.roomCustom[opt.key] = !this.roomCustom[opt.key];
          this.net.broadcast({ type: "custom", custom: this.roomCustom });
        }});
      }
    });
    
    // Mode selection
    let my = cy + 150;
    ctx.fillStyle = "#c77dff"; ctx.font = "bold 14px Helvetica"; ctx.textAlign = "center";
    ctx.fillText("模式", cx + cw/2, my);
    my += 20;
    const b1 = cx + 30, b2 = cx + cw/2 + 10, bw2 = cw/2 - 40;
    this.drawBtn(b1, my, bw2, 30, this.roomCustom.mode==="pvp"?"#ff2e63":"#444", "PVP");
    if (this.net.isHost) this.buttons.push({ x: b1, y: my, w: bw2, h: 30, action: () => {
        this.roomCustom.mode = "pvp"; this.net.broadcast({ type: "custom", custom: this.roomCustom });
    }});
    this.drawBtn(b2, my, bw2, 30, this.roomCustom.mode==="helper"?"#06d6a0":"#444", "Helper");
    if (this.net.isHost) this.buttons.push({ x: b2, y: my, w: bw2, h: 30, action: () => {
        this.roomCustom.mode = "helper"; this.net.broadcast({ type: "custom", custom: this.roomCustom });
    }});
    
    ctx.textAlign = "center";

    const bw = 240, bh = 48;
    const bx = (W-bw)/2;
    let by = cy + ch + 15;
    if (this.net.isHost) {
      this.drawBtn(bx, by, bw, bh, "#06d6a0", "开始游戏");
      this.buttons.push({ x: bx, y: by, w: bw, h: bh, action: () => {
          // Assign random colors
          const colors = ["#ff2e63", "#06d6a0", "#ffd166", "#00fff5", "#c77dff", "#ff9f1c", "#ffffff"];
          const ids = [this.net.myId, ...Object.keys(this.net.connections)];
          for(let i=0; i<ids.length; i++) {
              const col = colors[i % colors.length];
              if (ids[i] === this.net.myId) {
                  this.playerColor = col;
              } else {
                  this.net.sendTo(ids[i], { type: "assign_color", color: col });
              }
          }
          if (this.roomCustom.mode === "pvp") {
              this.startGame(this.deviceMode, "master", true);
          } else {
              this.startGame(this.deviceMode, "battlers", false);
          }
      }});
      by += 55;
    } else {
      ctx.fillStyle = "#888"; ctx.font = "13px Helvetica";
      ctx.fillText("等待房主开始...", W/2, by + 25);
      by += 55;
    }
    this.drawBtn(bx, by, bw, bh, "#888", "离开房间");
    this.buttons.push({ x: bx, y: by, w: bw, h: bh, action: () => {
      this.net.close(); this.remotePlayers = {}; this.state = "lobby";
    }});
  }

  drawDifficultySelect() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#00fff5"; ctx.font = "bold 26px Helvetica";
    ctx.fillText("选择难度", W/2, 50);
    ctx.fillStyle = "#888"; ctx.font = "12px Helvetica";
    ctx.fillText(`分数: ${this.marks}`, W/2, 72);
    const keys = ["news", "battlers", "master", "hell"];
    const gap = 12;
    const marginX = Math.max(10, W*0.02);
    const usable = W - marginX*2 - gap*3;
    const bw = Math.min(200, usable/4);
    const bh = Math.min(180, H*0.35);
    const totalW = bw*4 + gap*3;
    const startX = (W-totalW)/2;
    const startY = Math.min(H*0.18, 100);
    keys.forEach((key, idx) => {
      const d = DIFFICULTIES[key];
      const x = startX + idx*(bw+gap);
      ctx.fillStyle = "#15152a"; ctx.fillRect(x, startY, bw, bh);
      ctx.strokeStyle = d.color; ctx.lineWidth = 3; ctx.strokeRect(x, startY, bw, bh);
      ctx.fillStyle = d.color; ctx.font = "bold 18px Helvetica"; ctx.textAlign = "center";
      ctx.fillText(d.name, x+bw/2, startY+35);
      ctx.textAlign = "left";
      this.buttons.push({ x, y: startY, w: bw, h: bh, action: () => this.startGame(this.deviceMode, key, false) });
    });
    this.drawBtn((W-160)/2, startY + bh + 20, 160, 45, "#c77dff", "🛒 商店");
    this.buttons.push({ x: (W-160)/2, y: startY + bh + 20, w: 160, h: 45, action: () => { this.state = "shop"; } });
    this.drawBtn((W-160)/2, startY + bh + 75, 160, 45, "#888", "返回");
    this.buttons.push({ x: (W-160)/2, y: startY + bh + 75, w: 160, h: 45, action: () => { this.state = "lobby"; } });
  }

  drawShop() {
    this.buttons = [];
    ctx.textAlign = "center";
    ctx.fillStyle = "#c77dff"; ctx.font = "bold 26px Helvetica";
    ctx.fillText("商店", W/2, 40);
    ctx.fillStyle = "#aaa"; ctx.font = "12px Helvetica";
    ctx.fillText(`分数: ${this.marks}  |  已装备: ${this.equippedSkills.length}/${MAX_EQUIPPED}`, W/2, 62);
    const keys = ["shield", "strike", "lockon", "fake", "help"];
    const gap = 10;
    const marginX = Math.max(10, W*0.02);
    const usable = W - marginX*2 - gap*4;
    const bw = Math.min(150, usable/5);
    const bh = Math.min(220, H*0.42);
    const totalW = bw*5 + gap*4;
    const startX = (W-totalW)/2;
    const startY = Math.min(H*0.18, 90);
    keys.forEach((key, idx) => {
      const s = SKILLS[key];
      const x = startX + idx*(bw+gap);
      const owned = this.ownedSkills[key];
      const equipped = this.equippedSkills.includes(key);
      const canAfford = this.marks >= s.cost;
      ctx.fillStyle = equipped ? "#1a3a2a" : (owned ? "#1a2a3a" : "#15152a");
      ctx.fillRect(x, startY, bw, bh);
      ctx.strokeStyle = equipped ? "#06d6a0" : (owned ? "#00fff5" : "#c77dff");
      ctx.lineWidth = 3; ctx.strokeRect(x, startY, bw, bh);
      this.drawSkillIcon(x+bw/2, startY+60, 30, key);
      ctx.fillStyle = "#c77dff"; ctx.font = "bold 14px Helvetica"; ctx.textAlign = "center";
      ctx.fillText(s.name, x+bw/2, startY+bh-70);
      ctx.textAlign = "left";
      if (owned) {
        if (equipped) {
          ctx.fillStyle = "#06d6a0"; ctx.font = "bold 11px Helvetica"; ctx.textAlign = "center";
          ctx.fillText("✓ 已装备", x+bw/2, startY+bh-45);
          ctx.textAlign = "left";
          this.buttons.push({ x, y: startY, w: bw, h: bh, action: () => {
            this.equippedSkills = this.equippedSkills.filter(k => k !== key);
            this.refreshSkillBtns();
          }});
        } else {
          ctx.fillStyle = "#00fff5"; ctx.font = "bold 11px Helvetica"; ctx.textAlign = "center";
          ctx.fillText("点击装备", x+bw/2, startY+bh-45);
          ctx.textAlign = "left";
          this.buttons.push({ x, y: startY, w: bw, h: bh, action: () => {
            if (this.equippedSkills.length >= MAX_EQUIPPED) return;
            this.equippedSkills.push(key);
            this.refreshSkillBtns();
          }});
        }
      } else {
        ctx.fillStyle = canAfford ? "#ffd166" : "#666"; ctx.font = "bold 12px Helvetica"; ctx.textAlign = "center";
        ctx.fillText(`购买 ${s.cost}`, x+bw/2, startY+bh-45);
        ctx.textAlign = "left";
        if (canAfford) {
          this.buttons.push({ x, y: startY, w: bw, h: bh, action: () => {
            if (this.marks >= s.cost && !this.ownedSkills[key]) { this.marks -= s.cost; this.ownedSkills[key] = true; }
          }});
        }
      }
    });
    this.drawBtn((W-160)/2, startY+bh+15, 160, 45, "#ff2e63", "← 返回");
    this.buttons.push({ x: (W-160)/2, y: startY+bh+15, w: 160, h: 45, action: () => { this.state = "difficulty"; } });
  }

  drawSkillIcon(cx, cy, r, key) {
    ctx.save();
    ctx.strokeStyle = "#ddd"; ctx.fillStyle = "#ddd"; ctx.lineWidth = 3;
    const s = r;
    if (key === "shield") {
      ctx.beginPath();
      ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s*0.7, cy-s*0.4); ctx.lineTo(cx+s*0.6, cy+s*0.4);
      ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s*0.6, cy+s*0.4); ctx.lineTo(cx-s*0.7, cy-s*0.4);
      ctx.closePath(); ctx.fill();
    } else if (key === "strike") {
      ctx.beginPath();
      ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s*0.4, cy); ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s*0.4, cy);
      ctx.closePath(); ctx.fill();
    } else if (key === "lockon") {
      ctx.beginPath(); ctx.arc(cx, cy, s*0.7, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, s*0.3, 0, Math.PI*2); ctx.fill();
    } else if (key === "fake") {
      ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, s*0.55, 0, Math.PI*2); ctx.stroke();
    } else if (key === "help") {
      for (let i = 0; i < 3; i++) {
        const a = i*Math.PI*2/3 - Math.PI/2;
        const px = cx+Math.cos(a)*s*0.6, py = cy+Math.sin(a)*s*0.6;
        ctx.beginPath(); ctx.arc(px, py, s*0.25, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  drawBtn(x, y, w, h, color, label) {
    ctx.fillStyle = "#1a1a2e"; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color; ctx.font = "bold 14px Helvetica";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(label, x + w/2, y + h/2);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  drawJoystick(j, activeColor, inactiveColor) {
    ctx.strokeStyle = j.active ? activeColor : inactiveColor; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(j.cx, j.cy, j.r, 0, Math.PI*2); ctx.stroke();
    if (j.active) { ctx.beginPath(); ctx.moveTo(j.cx, j.cy); ctx.lineTo(j.kx, j.ky); ctx.strokeStyle = activeColor; ctx.stroke(); }
    const kr = j.r*0.35;
    ctx.beginPath(); ctx.arc(j.kx, j.ky, kr, 0, Math.PI*2);
    ctx.fillStyle = j.active ? activeColor : inactiveColor; ctx.fill();
  }

  drawSkillButton(btn, symbol, label, cdFrac, pressed, activeGlow = false) {
    const r = this.skillR;
    ctx.beginPath(); ctx.arc(btn.cx, btn.cy, r, 0, Math.PI*2);
    ctx.fillStyle = pressed ? "#2a2a4e" : "#1a1a2e"; ctx.fill();
    ctx.strokeStyle = activeGlow ? "#00ff88" : "#555"; ctx.lineWidth = activeGlow ? 3 : 2; ctx.stroke();
    if (cdFrac > 0) {
      ctx.beginPath(); ctx.moveTo(btn.cx, btn.cy);
      ctx.arc(btn.cx, btn.cy, r, -Math.PI/2, -Math.PI/2 + cdFrac*Math.PI*2);
      ctx.closePath(); ctx.fillStyle = "rgba(11,12,16,0.85)"; ctx.fill();
    }
    ctx.save(); ctx.globalAlpha = 0.7; ctx.fillStyle = "#dddddd";
    const s = r*0.5;
    if (symbol === "rocket") {
      ctx.beginPath();
      ctx.moveTo(btn.cx, btn.cy-s); ctx.lineTo(btn.cx+s*0.5, btn.cy);
      ctx.lineTo(btn.cx+s*0.3, btn.cy+s*0.6); ctx.lineTo(btn.cx-s*0.3, btn.cy+s*0.6);
      ctx.lineTo(btn.cx-s*0.5, btn.cy); ctx.closePath(); ctx.fill();
    } else if (symbol === "power") {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i*Math.PI/4; const rr = r*(i%2===0?0.5:0.25);
        const px = btn.cx+Math.cos(a)*rr, py = btn.cy+Math.sin(a)*rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else if (symbol === "shield") {
      ctx.beginPath();
      ctx.moveTo(btn.cx, btn.cy-s); ctx.lineTo(btn.cx+s*0.7, btn.cy-s*0.4);
      ctx.lineTo(btn.cx+s*0.6, btn.cy+s*0.4); ctx.lineTo(btn.cx, btn.cy+s);
      ctx.lineTo(btn.cx-s*0.6, btn.cy+s*0.4); ctx.lineTo(btn.cx-s*0.7, btn.cy-s*0.4);
      ctx.closePath(); ctx.fill();
    } else if (symbol === "strike") {
      ctx.beginPath();
      ctx.moveTo(btn.cx, btn.cy-s); ctx.lineTo(btn.cx+s*0.4, btn.cy);
      ctx.lineTo(btn.cx, btn.cy+s); ctx.lineTo(btn.cx-s*0.4, btn.cy);
      ctx.closePath(); ctx.fill();
    } else if (symbol === "lockon") {
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s*0.7, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s*0.3, 0, Math.PI*2); ctx.fill();
    } else if (symbol === "fake") {
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s*0.8, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(btn.cx, btn.cy, s*0.5, 0, Math.PI*2); ctx.stroke();
    } else if (symbol === "help") {
      for (let i = 0; i < 3; i++) {
        const a = i*Math.PI*2/3;
        const px = btn.cx+Math.cos(a)*s*0.6, py = btn.cy+Math.sin(a)*s*0.6;
        ctx.beginPath(); ctx.arc(px, py, s*0.25, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
    ctx.fillStyle = "#aaa"; ctx.font = "10px Helvetica"; ctx.textAlign = "center";
    ctx.fillText(label, btn.cx, btn.cy+r+12); ctx.textAlign = "left";
  }

  drawHud() {
    const lines = [];
    lines.push(`${this.pvpMode ? "PVP" : this.difficulty.name}  HP: ${this.player.hp}/${this.player.maxHp}  Marks: ${this.player.score}`);
    if (!this.touchMode) lines.push("[WASD]移动 [左键]射击 [E]火箭 [C]光束 [Q]护盾 [F]冲撞 [R]锁定 [G]假影 [H]助手");
    ctx.fillStyle = "#e0e0e0"; ctx.font = "12px Helvetica";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    lines.forEach((line, i) => ctx.fillText(line, 10, 10 + i*18));
  }
  
  skillLabel(key) {
    if (key === "shield") return "Q";
    if (key === "strike") return "F";
    if (key === "lockon") return "R";
    if (key === "fake") return "G";
    if (key === "help") return "H";
    return "";
  }
  touchesValueHas(val) {
      for (let v of this.touches.values()) if (v === val) return true;
      return false;
  }
}

const game = new Game();
function idFor(e) { return (e.pointerType === "touch" || e.pointerType === "pen") ? "t"+e.pointerId : "mouse"; }
function getXY(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const [x, y] = getXY(e);
  game.onPointerDown(idFor(e), x, y);
  if (e.pointerType === "mouse") game.mousePos = [x, y];
}, { passive: false });
canvas.addEventListener("pointermove", e => {
  const [x, y] = getXY(e); game.onPointerMove(idFor(e), x, y);
}, { passive: false });
canvas.addEventListener("pointerup", e => { game.onPointerUp(idFor(e)); }, { passive: false });
canvas.addEventListener("pointercancel", e => { game.onPointerUp(idFor(e)); }, { passive: false });
canvas.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
canvas.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
window.addEventListener("keydown", e => {
  game.onKey(e.key, true);
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener("keyup", e => { 
    game.onKey(e.key, false);
    game.onKeyUp(e.key);
});
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (game.state === "playing" && !game.touchMode && game.player && game.player.isAlive && !game.player.isStriking) {
    game.player.startRocketAim();
  }
});

resize();
function loop() {
  game.update();
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
