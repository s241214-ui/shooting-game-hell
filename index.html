<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Triangle Battle Arena</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0c10;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Helvetica,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W=0,H=0,game;

function resize(){
  const dpr=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(game)game.setupJoysticks();
}
addEventListener("resize",resize);

const now=()=>performance.now()/1000;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SPEED_MULT=1.7;

/* Isosceles triangle: narrow apex points along angle. */
function triPoints(x,y,r,angle){
  const tip=[x+Math.cos(angle)*r,y+Math.sin(angle)*r];
  const backX=x-Math.cos(angle)*r*.65;
  const backY=y-Math.sin(angle)*r*.65;
  const halfWidth=r*.72;
  const px=-Math.sin(angle),py=Math.cos(angle);
  return [
    tip,
    [backX+px*halfWidth,backY+py*halfWidth],
    [backX-px*halfWidth,backY-py*halfWidth]
  ];
}
function drawTri(x,y,r,angle,color){
  const p=triPoints(x,y,r,angle);
  ctx.beginPath();ctx.moveTo(...p[0]);ctx.lineTo(...p[1]);ctx.lineTo(...p[2]);
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function drawHpBar(x,y,hp,maxHp,color="#ff2e63"){
  const w=42,h=5;
  ctx.fillStyle="#2b2d42";ctx.fillRect(x-w/2,y-32,w,h);
  ctx.fillStyle=color;ctx.fillRect(x-w/2,y-32,w*clamp(hp/maxHp,0,1),h);
}

class Bullet{
  constructor(x,y,angle,speed=10,radius=5,color="#00fff5",piercing=false){
    this.x=x;this.y=y;this.dx=Math.cos(angle);this.dy=Math.sin(angle);
    this.speed=speed*SPEED_MULT;this.radius=radius;this.color=color;
    this.piercing=piercing;this.active=true;this.damageMult=1;
    this.fromHelper=false;this.ownerId=null;this.lockOnTarget=null;
  }
  update(){
    if(this.lockOnTarget?.isAlive){
      const d=Math.hypot(this.lockOnTarget.x-this.x,this.lockOnTarget.y-this.y);
      if(d<140){
        const a=Math.atan2(this.lockOnTarget.y-this.y,this.lockOnTarget.x-this.x);
        this.dx=Math.cos(a);this.dy=Math.sin(a);
      }
    }
    this.x+=this.dx*this.speed;this.y+=this.dy*this.speed;
    if(this.x<-20||this.x>W+20||this.y<-20||this.y>H+20)this.active=false;
  }
  draw(){
    ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fill();
  }
}
class StrongBullet extends Bullet{
  constructor(x,y,angle){super(x,y,angle,17,14,"#ff2e63",true);this.speed=17*SPEED_MULT;}
  draw(){
    ctx.fillStyle=this.fromHelper?"#bbb":"#ff2e63";
    ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(this.x,this.y,this.radius/2,0,Math.PI*2);ctx.fill();
  }
}
class Rocket{
  constructor(x,y,target,speed=6.5,color="#1a3a8a",fromHelper=false){
    this.x=x;this.y=y;this.target=target;this.radius=7;this.size=8;
    this.speed=speed*SPEED_MULT;this.color=color;this.active=true;
    this.spawnTime=now();this.lifetime=2.5;this.damage=1;
    this.fromHelper=fromHelper;this.ownerId=null;
    this.angle=target?Math.atan2(target.y-y,target.x-x):0;
  }
  update(){
    if(now()-this.spawnTime>this.lifetime){this.active=false;return;}
    if(this.target?.isAlive){
      const desired=Math.atan2(this.target.y-this.y,this.target.x-this.x);
      let delta=Math.atan2(Math.sin(desired-this.angle),Math.cos(desired-this.angle));
      this.angle+=clamp(delta,-.06,.06);
    }
    this.x+=Math.cos(this.angle)*this.speed;this.y+=Math.sin(this.angle)*this.speed;
    if(this.x<5||this.x>W-5||this.y<5||this.y>H-5)this.active=false;
  }
  draw(){drawTri(this.x,this.y,this.size,this.angle,this.color);}
}

/* Player HP is 60 in every mode. */
class PlayerRed{
  constructor(x,y,hp=60,ownerId=null){
    this.ownerId=ownerId;this.x=x;this.y=y;this.radius=18;
    this.baseSpeed=5.8*SPEED_MULT;this.angle=0;this.maxHp=60;this.hp=60;
    this.isAlive=true;this.score=0;this.kills=0;this.equipped=[];
    this.strongBulletCd=20;this.lastStrongBulletTime=-20;
    this.rocketCd=3;this.lastRocketTime=-3;this.dashCd=4;this.lastDashTime=-4;
    this.dashEndTime=0;this.shieldHp=0;this.shieldMax=10;this.shieldCd=30;
    this.shieldLastUsed=-30;this.strikePending=false;this.isStriking=false;
    this.strikeDir=[1,0];this.strikeCd=15;this.strikeLastUsed=-15;
    this.lockonActive=false;this.lockonSelecting=false;this.lockonPath=[];
    this.lockonCircles=[];this.lockonLocked=new Set();this.lockonCd=25;
    this.lockonLastUsed=-25;this.fakeActive=false;this.fakeStart=0;
    this.fakeDuration=10;this.fakeCd=20;this.fakeLastUsed=-20;
    this.fakeAbsorbed=0;this.fakeOrbsAngle=0;this.fakeMode="follow";
    this.fakeOrbPositions=[null,null];this.fakeOrbTargets=[null,null];
    this.fakeOrbLastShoot=0;this.helpActive=false;this.helpStart=0;
    this.helpDuration=12;this.helpCd=30;this.helpLastUsed=-30;
    this.helpers=[];this.pvpMode=false;
  }
  hasSkill(key){
    if(this.pvpMode&&["fake","help","lockon"].includes(key))return false;
    return this.equipped.includes(key);
  }
  move(dx,dy,aim){
    if(!this.isAlive||this.isStriking)return;
    const speed=this.baseSpeed*(this.pvpMode?1.3:1)*(now()<this.dashEndTime?2.6:1);
    this.x=clamp(this.x+dx*speed,this.radius,W-this.radius);
    this.y=clamp(this.y+dy*speed,this.radius,H-this.radius);this.angle=aim;
  }
  triggerDash(){if(now()-this.lastDashTime>=this.dashCd){this.lastDashTime=now();this.dashEndTime=now()+.18;}}
  fireStrongBullet(targets){
    if(now()-this.lastStrongBulletTime<this.strongBulletCd)return null;
    this.lastStrongBulletTime=now();const b=new StrongBullet(this.x,this.y,this.angle);
    const target=targets.filter(t=>t.isAlive).sort((a,c)=>
      Math.hypot(a.x-this.x,a.y-this.y)-Math.hypot(c.x-this.x,c.y-this.y))[0];
    if(target){b.angle=Math.atan2(target.y-this.y,target.x-this.x);b.dx=Math.cos(b.angle);b.dy=Math.sin(b.angle);}
    b.ownerId=this.ownerId;return b;
  }
  fireRockets(enemies){
    if(this.pvpMode||now()-this.lastRocketTime<this.rocketCd)return [];
    const alive=enemies.filter(e=>e.isAlive);if(!alive.length)return [];
    this.lastRocketTime=now();
    return Array.from({length:5},(_,i)=>{
      const target=alive[i%alive.length],angle=this.angle+(i-2)*.35;
      return new Rocket(this.x+Math.cos(angle)*14,this.y+Math.sin(angle)*14,target,5.5,"#1a3a8a");
    });
  }
  activateShield(){if(!this.hasSkill("shield")||this.shieldHp>0||now()-this.shieldLastUsed<this.shieldCd)return;this.shieldHp=this.shieldMax;}
  tryArmStrike(){if(this.hasSkill("strike")&&!this.isStriking&&now()-this.strikeLastUsed>=this.strikeCd)this.strikePending=true;}
  beginStrike(angle){this.isStriking=true;this.strikePending=false;this.strikeDir=[Math.cos(angle),Math.sin(angle)];this.strikeLastUsed=now();}
  startCrashBounce(x,y){const dx=this.x-x,dy=this.y-y,d=Math.hypot(dx,dy)||1;this.x=clamp(this.x+dx/d*120,this.radius,W-this.radius);this.y=clamp(this.y+dy/d*120,this.radius,H-this.radius);}
  updateStrike(){
    if(!this.isStriking)return;
    this.x+=this.strikeDir[0]*22*SPEED_MULT;this.y+=this.strikeDir[1]*22*SPEED_MULT;
    if(this.x<this.radius||this.x>W-this.radius||this.y<this.radius||this.y>H-this.radius){
      this.x=clamp(this.x,this.radius,W-this.radius);this.y=clamp(this.y,this.radius,H-this.radius);this.isStriking=false;
    }
  }
  activateLockon(){if(!this.hasSkill("lockon")||now()-this.lockonLastUsed<this.lockonCd)return;this.lockonSelecting=true;this.lockonActive=false;}
  commitLockon(enemies){
    this.lockonLastUsed=now();this.lockonSelecting=false;this.lockonActive=true;const expire=now()+2;
    for(const c of this.lockonPath){this.lockonCircles.push({...c,expire});for(const e of enemies)if(e.isAlive&&Math.hypot(e.x-c.x,e.y-c.y)<c.r+e.radius)this.lockonLocked.add(e);}
    this.lockonPath=[];
  }
  activateFake(){if(!this.hasSkill("fake")||this.fakeActive||now()-this.fakeLastUsed<this.fakeCd)return;this.fakeActive=true;this.fakeStart=now();this.fakeAbsorbed=0;this.fakeMode=Math.random()<.5?"follow":"attack";this.fakeOrbPositions=[null,null];this.fakeOrbTargets=[null,null];}
  activateHelp(){if(!this.hasSkill("help")||this.helpActive||now()-this.helpLastUsed<this.helpCd)return;this.helpActive=true;this.helpStart=now();this.helpers=Array.from({length:5},(_,i)=>{const a=i*Math.PI*2/5;return new Helper(this.x+Math.cos(a)*60,this.y+Math.sin(a)*60,[...this.equipped]);});}
  takeDamage(amount){
    if(this.isStriking)return;
    if(this.fakeActive){this.fakeAbsorbed+=amount;return;}
    const absorbed=Math.min(this.shieldHp,amount);this.shieldHp-=absorbed;amount-=absorbed;
    if(this.shieldHp===0&&absorbed>0)this.shieldLastUsed=now();
    this.hp-=amount;if(this.hp<=0){this.hp=0;this.isAlive=false;}
  }
}
class Helper{
  constructor(x,y,equipped){
    this.x=x;this.y=y;this.radius=12;this.baseSpeed=5*SPEED_MULT;this.angle=0;
    this.equipped=equipped;this.maxHp=25;this.hp=25;this.isAlive=true;
    this.lastShot=0;this.lastRocket=0;this.lastShield=-30;this.lastBeam=0;
    this.shieldHp=0;this.roamAngle=Math.random()*Math.PI*2;this.roamTimer=0;
    this.skillTimer=Math.random()*2;this.isStriking=false;
  }
  takeDamage(n){if(this.isStriking)return;const a=Math.min(this.shieldHp,n);this.shieldHp-=a;this.hp-=n-a;if(this.hp<=0){this.hp=0;this.isAlive=false;}}
  update(owner,enemies){
    if(!this.isAlive||!owner.isAlive)return;
    const t=now();this.roamTimer-=.016;
    if(this.roamTimer<=0){this.roamAngle=Math.random()*Math.PI*2;this.roamTimer=1+Math.random()*2;}
    const ox=owner.x+Math.cos(this.roamAngle)*140-this.x,oy=owner.y+Math.sin(this.roamAngle)*140-this.y,od=Math.hypot(ox,oy)||1;
    if(od>20){this.x+=ox/od*this.baseSpeed;this.y+=oy/od*this.baseSpeed;}
    const target=enemies.filter(e=>e.isAlive).sort((a,b)=>Math.hypot(a.x-this.x,a.y-this.y)-Math.hypot(b.x-this.x,b.y-this.y))[0];
    if(target){this.angle=Math.atan2(target.y-this.y,target.x-this.x);if(t-this.lastShot>.15){this.lastShot=t;const b=new Bullet(this.x,this.y,this.angle,11,4,"#bbbbbb");b.fromHelper=true;b.damageMult=.5;game.redBullets.push(b);}}
    this.skillTimer-=.016;
    if(this.skillTimer<=0){
      this.skillTimer=2+Math.random()*3;
      const skill=["rocket","beam","shield","dash"][Math.floor(Math.random()*4)];
      if(skill==="rocket"&&target&&t-this.lastRocket>4){this.lastRocket=t;const r=new Rocket(this.x,this.y,target,5,"#88aaff",true);r.damage=.5;game.redRockets.push(r);}
      else if(skill==="beam"&&target&&t-this.lastBeam>6){this.lastBeam=t;const b=new StrongBullet(this.x,this.y,this.angle);b.fromHelper=true;b.speed*=.7;game.redStrongBullets.push(b);}
      else if(skill==="shield"&&this.shieldHp<=0&&t-this.lastShield>30){this.shieldHp=5;this.lastShield=t;}
      else if(skill==="dash"){this.x+=Math.cos(this.angle)*30;this.y+=Math.sin(this.angle)*30;}
    }
    this.x=clamp(this.x,this.radius,W-this.radius);this.y=clamp(this.y,this.radius,H-this.radius);
  }
  draw(){if(this.shieldHp>0){ctx.strokeStyle="#06d6a0";ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.radius+4,0,Math.PI*2);ctx.stroke();}drawTri(this.x,this.y,this.radius,this.angle,"#888");drawHpBar(this.x,this.y,this.hp,this.maxHp,"#bbb");}
}

class YellowTriangle{
  constructor(x,y,hp=35){
    this.x=x;this.y=y;this.radius=22;this.baseSpeed=8.5*SPEED_MULT;this.angle=0;this.maxHp=hp;this.hp=hp;this.isAlive=true;
    this.preferredDistance=260;this.attackMode="aim";this.modeTimer=now()+.3;this.aimDuration=.3;
    this.rapidShootTimer=0;this.rapidShootInterval=.1;this.rapidDuration=3;this.rapidShootStarted=0;
    this.powerChargeStart=0;this.powerChargeDuration=1;this.isCharging=false;this.isDashing=false;
    this.chargeStart=0;this.dashDir=[0,0];this.dashTravelled=0;this.dashMaxDist=0;this.dashHitDone=false;
    this.crashCooldownUntil=0;this.trail=[];this.isDodging=false;this.dodgeDir=[0,0];this.dodgeStart=0;
    this.dodgeDuration=.35;this.dodgeCooldown=0;this.aimedAtDuration=0;this.beingAimedAt=false;
    this.speedBoostUntil=0;this.sidestepCooldown=0;this.canShoot=true;
  }
  takeDamage(n=1){this.hp-=n;if(this.hp<=0){this.hp=0;this.isAlive=false;}}
  trySidestep(){const t=now();if(t<this.dodgeCooldown||this.isDodging||this.isDashing||this.isCharging)return;const side=Math.random()<.5?1:-1;this.dodgeDir=[-Math.sin(this.angle)*side,Math.cos(this.angle)*side];this.isDodging=true;this.dodgeStart=t;this.dodgeDuration=.4;this.dodgeCooldown=t+1.2;this.sidestepCooldown=t+3.5;}
  tryDashThroughTarget(target){const t=now();if(t<this.sidestepCooldown||this.isDodging||this.isDashing||this.isCharging)return;const dx=target.x-this.x,dy=target.y-this.y,d=Math.hypot(dx,dy)||1;this.dodgeDir=[dx/d,dy/d];this.isDodging=true;this.dodgeStart=t;this.dodgeDuration=.3;this.dodgeCooldown=t+1;this.sidestepCooldown=t+4;}
  triggerCrash(target){if(this.isCharging||this.isDashing)return;const dx=target.x-this.x,dy=target.y-this.y,d=Math.hypot(dx,dy)||1;this.attackMode="crash";this.isCharging=true;this.chargeStart=now();this.dashDir=[dx/d,dy/d];this.dashMaxDist=Math.max(W,H)*1.5;this.dashTravelled=0;this.dashHitDone=false;}
  updateDash(target){
    if(this.isCharging){if(now()-this.chargeStart>=.4){this.isCharging=false;this.isDashing=true;}return;}
    if(!this.isDashing)return;
    const speed=this.baseSpeed*5;this.x+=this.dashDir[0]*speed;this.y+=this.dashDir[1]*speed;this.dashTravelled+=speed;
    if(!this.dashHitDone&&target?.isAlive&&Math.hypot(target.x-this.x,target.y-this.y)<this.radius+(target.radius||18)){
      if(target.isStriking&&target.startCrashBounce){target.startCrashBounce(this.x,this.y);this.startBounce();}
      else if(target.takeDamage){target.takeDamage(5);this.dashHitDone=true;}
    }
    if(this.dashTravelled>=this.dashMaxDist||this.x<this.radius||this.x>W-this.radius||this.y<this.radius||this.y>H-this.radius){
      this.isDashing=false;this.x=clamp(this.x,this.radius,W-this.radius);this.y=clamp(this.y,this.radius,H-this.radius);this.crashCooldownUntil=now()+4;this.attackMode="aim";this.modeTimer=now()+this.aimDuration;
    }
  }
  startBounce(){this.isDashing=false;this.isCharging=false;this.x=clamp(this.x-this.dashDir[0]*150,this.radius,W-this.radius);this.y=clamp(this.y-this.dashDir[1]*150,this.radius,H-this.radius);this.attackMode="aim";this.modeTimer=now()+this.aimDuration;this.crashCooldownUntil=now()+3;}
  update(target,enemyBullets){
    if(!this.isAlive||!target?.isAlive)return;
    const t=now(),dx=target.x-this.x,dy=target.y-this.y,dist=Math.hypot(dx,dy)||1;this.angle=Math.atan2(dy,dx);
    if(this.isDodging){if(t-this.dodgeStart>=this.dodgeDuration)this.isDodging=false;else{const s=this.baseSpeed*3;this.x+=this.dodgeDir[0]*s;this.y+=this.dodgeDir[1]*s;return;}}
    if(this.isCharging||this.isDashing){this.updateDash(target);return;}
    let speed=this.baseSpeed;if(t<this.speedBoostUntil)speed*=1.8;
    if(this.beingAimedAt){this.aimedAtDuration+=.016;if(this.aimedAtDuration>1.2&&t>this.speedBoostUntil){this.speedBoostUntil=t+3;this.aimedAtDuration=0;}}else this.aimedAtDuration=Math.max(0,this.aimedAtDuration-.02);
    if(dist<400&&Math.random()<.01)this.trySidestep();if(dist<250&&Math.random()<.008)this.tryDashThroughTarget(target);
    if(dist<this.preferredDistance-25){this.x-=dx/dist*speed*.6;this.y-=dy/dist*speed*.6;}
    else if(dist>this.preferredDistance+25){this.x+=dx/dist*speed*.6;this.y+=dy/dist*speed*.6;}
    else{this.x+=-dy/dist*speed*.5;this.y+=dx/dist*speed*.5;}
    if(this.attackMode==="aim"&&t>=this.modeTimer){this.attackMode="rapid";this.rapidShootStarted=t;this.rapidShootTimer=t;}
    else if(this.attackMode==="rapid"){
      if(t-this.rapidShootStarted>this.rapidDuration){this.attackMode="power";this.powerChargeStart=t;}
      else if(this.canShoot&&t-this.rapidShootTimer>=this.rapidShootInterval){this.rapidShootTimer=t;const b=new Bullet(this.x,this.y,this.angle,11,6,"#ffe66d");b.damageMult=1;enemyBullets.push(b);}
    }else if(this.attackMode==="power"&&t-this.powerChargeStart>=this.powerChargeDuration){
      const b=new Bullet(this.x,this.y,this.angle,22,12,"#fff",true);b.damageMult=5;enemyBullets.push(b);
      if(t>this.crashCooldownUntil&&Math.random()<.5)this.triggerCrash(target);else{this.attackMode="aim";this.modeTimer=t+this.aimDuration;}
    }
    this.x=clamp(this.x,this.radius,W-this.radius);this.y=clamp(this.y,this.radius,H-this.radius);
  }
  draw(){let c="#f9d56e";if(this.attackMode==="power")c="#ff8800";if(this.isDodging)c="#aaffaa";if(this.isCharging)c="#fff";if(this.isDashing)c="#ff5500";drawTri(this.x,this.y,this.radius,this.angle,c);drawHpBar(this.x,this.y,this.hp,this.maxHp);if(this.isCharging){ctx.strokeStyle="#f00";ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.dashDir[0]*400,this.y+this.dashDir[1]*400);ctx.stroke();ctx.setLineDash([]);}}
}

class PurpleTriangle{
  constructor(x,y){this.x=x;this.y=y;this.radius=23;this.speed=3.6*SPEED_MULT;this.angle=0;this.maxHp=6;this.hp=6;this.isAlive=true;this.preferredDistance=300;this.lastShotTime=now();this.shotInterval=.9;}
  takeDamage(n=1){this.hp-=n;if(this.hp<=0){this.hp=0;this.isAlive=false;}}
  update(target,bullets){
    if(!this.isAlive||!target?.isAlive)return;
    const dx=target.x-this.x,dy=target.y-this.y,d=Math.hypot(dx,dy)||1;this.angle=Math.atan2(dy,dx);
    if(d<this.preferredDistance-25){this.x-=dx/d*this.speed;this.y-=dy/d*this.speed;}
    else if(d>this.preferredDistance+25){this.x+=dx/d*this.speed;this.y+=dy/d*this.speed;}
    else{this.x+=dy/d*this.speed*.6;this.y-=dx/d*this.speed*.6;}
    if(now()-this.lastShotTime>=this.shotInterval){this.lastShotTime=now();const b=new Bullet(this.x,this.y,this.angle,9,6,"#c77dff");b.damageMult=.5;bullets.push(b);}
    this.x=clamp(this.x,this.radius,W-this.radius);this.y=clamp(this.y,this.radius,H-this.radius);
  }
  draw(){drawTri(this.x,this.y,this.radius,this.angle,"#9d4edd");drawHpBar(this.x,this.y,this.hp,this.maxHp);}
}
class GreenTriangle{
  constructor(x,y){this.x=x;this.y=y;this.radius=18;this.speed=4.5*SPEED_MULT;this.angle=0;this.maxHp=4;this.hp=4;this.isAlive=true;this.preferredDistance=380;this.state="firing";this.fireCooldown=now()+1;this.waitStart=0;this.chargeStart=0;this.dashDir=[0,0];this.dashTravelled=0;this.dashMaxDist=0;this.dashHitDone=false;this.rocketTarget=null;}
  takeDamage(n=1){this.hp-=n;if(this.hp<=0){this.hp=0;this.isAlive=false;}}

const DIFFICULTIES={
  news:{name:"NEWS",playerHp:60,start:{yellow:0,purple:3,green:2},max:{yellow:0,purple:3,green:2}},
  battlers:{name:"BATTLERS",playerHp:60,start:{yellow:0,purple:5,green:3},max:{yellow:2,purple:5,green:3}},
  master:{name:"MASTER",playerHp:60,start:{yellow:2,purple:0,green:4},max:{yellow:8,purple:0,green:4}},
  hell:{name:"HELL",playerHp:60,start:{yellow:1,purple:0,green:0},max:{yellow:99,purple:0,green:0}}
};
const SKILLS={shield:{name:"SHIELD",cost:300},strike:{name:"STRIKE",cost:500},lockon:{name:"LOCKON",cost:100},fake:{name:"FAKE",cost:400},help:{name:"HELP",cost:600}};

class Net{
  constructor(){this.peer=null;this.isHost=false;this.connections={};this.myId="";this.roomCode="";}
  host(){return new Promise((resolve,reject)=>{this.peer?.destroy();this.peer=new Peer();this.isHost=true;this.peer.on("open",id=>{this.myId=id;this.roomCode=id;resolve(id);});this.peer.on("error",reject);this.peer.on("connection",conn=>{this.connections[conn.peer]=conn;conn.on("data",data=>game.onNetData(conn.peer,data));conn.on("close",()=>{delete this.connections[conn.peer];delete game.remotePlayers[conn.peer];});});});}
  join(code){return new Promise((resolve,reject)=>{this.peer?.destroy();this.peer=new Peer();this.isHost=false;this.peer.on("open",id=>{this.myId=id;const conn=this.peer.connect(code);conn.on("open",()=>{this.connections[code]=conn;this.roomCode=code;conn.on("data",data=>game.onNetData(code,data));resolve(code);});conn.on("error",reject);});this.peer.on("error",reject);});}
  sendTo(id,msg){try{this.connections[id]?.send(msg);}catch(_){}}
  broadcast(msg){for(const id in this.connections)this.sendTo(id,msg);}
  close(){try{this.peer?.destroy();}catch(_){}this.peer=null;this.connections={};}
}

  onKey(key,down){

  }
  drawButton(x,y,w,h,label,color){ctx.fillStyle="#171827";ctx.fillRect(x,y,w,h);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.fillStyle=color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="12px Arial";ctx.fillText(label,x+w/2,y+h/2);ctx.textAlign="left";ctx.textBaseline="alphabetic";}
  drawJoystick(j,color){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(j.cx,j.cy,j.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(j.kx,j.ky,j.r*.35,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  draw(){
    ctx.fillStyle="#0b0c10";ctx.fillRect(0,0,W,H);if(this.state!=="playing"){this.drawMenu();return;}
    for(const p of Object.values(this.remotePlayers))if(p&&p.hp>0){drawTri(p.x,p.y,18,p.angle||0,"#ff8fa3");drawHpBar(p.x,p.y,p.hp,p.maxHp||60,"#06d6a0");}
    for(const h of this.player.helpers)h.draw();for(const e of this.enemies)e.draw();
    for(const p of [...this.redBullets,...this.redStrongBullets,...this.redRockets,...this.enemyBullets,...this.enemyRockets])p.draw();
    if(this.player.isAlive){drawTri(this.player.x,this.player.y,this.player.radius,this.player.angle,"#ff2e63");drawHpBar(this.player.x,this.player.y,this.player.hp,this.player.maxHp,"#06d6a0");}
    ctx.fillStyle="#eee";ctx.font="13px Arial";ctx.fillText(`HP: ${this.player.hp}/${this.player.maxHp}   Marks: ${this.player.score}`,10,18);
    ctx.fillText("Skills: "+(this.equippedSkills.length?this.equippedSkills.map(k=>SKILLS[k]?.name||k).join(" · "):"None"),10,36);
    this.modeButton.x=W-160;this.modeButton.y=10;this.drawButton(this.modeButton.x,this.modeButton.y,this.modeButton.w,this.modeButton.h,this.touchMode?"Touch mode":"Computer mode",this.touchMode?"#00fff5":"#ff2e63");
    if(this.touchMode){
      this.drawJoystick(this.lJoy,"#00fff5");
      /* Red circle marks the only area that starts ordinary shooting. */
      ctx.strokeStyle="#ff2e63";ctx.lineWidth=3;ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(this.touchFireCenter.x,this.touchFireCenter.y,this.touchFireRadius,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
      this.drawJoystick(this.rJoy,"#ff2e63");
      this.drawButton(W-62,85,52,40,"ROCKET","#ff9f1c");this.drawButton(W-122,85,52,40,"POWER","#ff2e63");
    }
    if(!this.player.isAlive){ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#ff2e63";ctx.font="bold 30px Arial";ctx.textAlign="center";ctx.fillText("GAME OVER",W/2,H/2);ctx.textAlign="left";}
  }
}

game=new Game();
function pointerId(e){return e.pointerType==="mouse"?"mouse":String(e.pointerId);}
function pointerXY(e){const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(e.pointerType==="touch"&&!game.touchMode){game.touchMode=true;game.deviceMode="mobile";game.isShooting=false;game.touches.clear();game.leftMoveDir=[0,0];game.rightFiring=false;game.lJoy.active=false;game.rJoy.active=false;game.setupJoysticks();}
  const [x,y]=pointerXY(e);game.onPointerDown(pointerId(e),x,y);
},{passive:false});
canvas.addEventListener("pointermove",e=>{const[x,y]=pointerXY(e);game.onPointerMove(pointerId(e),x,y);});
canvas.addEventListener("pointerup",e=>game.onPointerUp(pointerId(e)));
canvas.addEventListener("pointercancel",e=>game.onPointerUp(pointerId(e)));
addEventListener("keydown",e=>{game.onKey(e.key,true);if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener("keyup",e=>game.onKey(e.key,false));
resize();
function loop(){game.update();game.draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
