<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Triangle Battle Arena</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #0b0c10; color: #eee; font-family: Arial, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

const now = () => performance.now() / 1000;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rand = (lo, hi) => lo + Math.random() * (hi - lo);

function drawTriangle(x, y, r, angle, color) {
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = angle + i * Math.PI * 2 / 3 - Math.PI / 2;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawBar(x, y, hp, maxHp, color = "#06d6a0") {
  const w = 42, h = 5;
  ctx.fillStyle = "#333";
  ctx.fillRect(x - w / 2, y - 31, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x - w / 2, y - 31, w * clamp(hp / Math.max(1, maxHp), 0, 1), h);
}

const DIFFICULTIES = {
  news:     { name: "NEWS",     hp: 20, yellow: 0, purple: 3, green: 2 },
  battlers: { name: "BATTLERS", hp: 60, yellow: 1, purple: 4, green: 2 },
  master:   { name: "MASTER",   hp: 30, yellow: 2, purple: 0, green: 3 },
  hell:     { name: "HELL",     hp: 20, yellow: 4, purple: 0, green: 0 }
};

const SKILLS = {
  shield: { name: "SHIELD", cost: 300 },
  strike: { name: "STRIKE", cost: 500 },
  lockon: { name: "LOCKON", cost: 100 },
  fake:   { name: "FAKE", cost: 400 },
  help:   { name: "HELP", cost: 600 }
};

class PeerLink {
  constructor(game) {
    this.game = game;
    this.peer = null;
    this.conn = null;
    this.isHost = false;
    this.roomCode = "";
    this.myId = "";
  }

  close() {
    try { this.peer?.destroy(); } catch (_) {}
    this.peer = null;
    this.conn = null;
    this.roomCode = "";
    this.myId = "";
    this.isHost = false;
  }

  host() {
    return new Promise((resolve, reject) => {
      this.close();
      if (typeof Peer === "undefined") {
        reject(new Error("PeerJS 未加载"));
        return;
      }

      this.peer = new Peer();
      this.isHost = true;

      this.peer.on("open", id => {
        this.myId = id;
        this.roomCode = id;
        resolve(id);
      });

      this.peer.on("connection", conn => {
        if (this.conn?.open) {
          conn.close();
          return;
        }

        this.conn = conn;
        conn.on("data", msg => this.game.onMessage(msg));
        conn.on("close", () => this.game.onDisconnected());
      });

      this.peer.on("error", reject);
    });
  }

  join(code) {
    return new Promise((resolve, reject) => {
      this.close();
      if (typeof Peer === "undefined") {
        reject(new Error("PeerJS 未加载"));
        return;
      }

      let settled = false;
      this.peer = new Peer();
      this.isHost = false;

      const fail = err => {
        if (settled) return;
        settled = true;
        reject(err instanceof Error ? err : new Error(String(err)));
      };

      this.peer.on("open", id => {
        this.myId = id;
        const conn = this.peer.connect(code, { reliable: true });
        this.conn = conn;

        conn.on("open", () => {
          if (settled) return;
          settled = true;
          this.roomCode = code;
          conn.on("data", msg => this.game.onMessage(msg));
          conn.on("close", () => this.game.onDisconnected());
          resolve(code);
        });

        conn.on("error", fail);
        conn.on("close", () => {
          if (!settled) fail(new Error("连接已关闭"));
        });
      });

      this.peer.on("error", fail);
      setTimeout(() => {
        if (!settled) fail(new Error("连接超时"));
      }, 15000);
    });
  }

  send(msg) {
    if (this.conn?.open) {
      try { this.conn.send(msg); } catch (_) {}
    }
  }
}

class Game {
  constructor() {
    this.net = new PeerLink(this);
    this.state = "menu";
    this.device = "computer";
    this.touchMode = false;
    this.mode = "solo";
    this.diffKey = "battlers";
    this.roomCode = "";
    this.status = "";

    this.players = {};
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];
    this.buttons = [];
    this.keys = {};
    this.mouse = { x: W / 2, y: H / 2, down: false };
    this.joy = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };

    this.lastSnapshot = 0;
    this.lastSpawn = 0;
    this.lastInputSend = 0;
    this.score = 0;
    this.kills = 0;
    this.owned = {};
    this.equipped = [];

    this.bindInput();
  }

  get myId() {
    return this.net.myId || "local";
  }

  get player() {
    return this.players[this.myId] || null;
  }

  bindInput() {
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      const p = this.pointerPos(e);

      if (this.state !== "playing") {
        this.handleClick(p.x, p.y);
        return;
      }

      if (this.touchMode && p.x < W / 2) {
        this.joy.active = true;
        this.joy.id = e.pointerId;
        this.joy.x = p.x;
        this.joy.y = p.y;
        this.joy.dx = this.joy.dy = 0;
      } else {
        this.mouse.x = p.x;
        this.mouse.y = p.y;
        this.mouse.down = true;
      }
    }, { passive: false });

    canvas.addEventListener("pointermove", e => {
      const p = this.pointerPos(e);
      this.mouse.x = p.x;
      this.mouse.y = p.y;

      if (this.joy.active && this.joy.id === e.pointerId) {
        const dx = p.x - this.joy.x;
        const dy = p.y - this.joy.y;
        const n = Math.hypot(dx, dy) || 1;
        const max = Math.min(W, H) * 0.13;
        const scale = Math.min(1, max / n);
        this.joy.dx = dx / n * scale;
        this.joy.dy = dy / n * scale;
      }
    });

    const pointerUp = e => {
      if (this.joy.id === e.pointerId) {
        this.joy.active = false;
        this.joy.id = null;
        this.joy.dx = this.joy.dy = 0;
      }
      this.mouse.down = false;
    };
    canvas.addEventListener("pointerup", pointerUp);
    canvas.addEventListener("pointercancel", pointerUp);
    canvas.addEventListener("contextmenu", e => e.preventDefault());

    addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      this.keys[k] = true;
      if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) {
        e.preventDefault();
      }

      if (k === "escape") {
        if (this.state === "playing") this.leaveMatch();
        else if (this.state === "room") this.leaveRoom();
      }

      if (this.state === "playing" && !e.repeat) {
        if (k === "q") this.useSkill("shield");
        if (k === "e") this.useSkill("rocket");
        if (k === "f") this.useSkill("strike");
        if (k === "c") this.useSkill("strong");
      }
    });

    addEventListener("keyup", e => {
      this.keys[e.key.toLowerCase()] = false;
    });
  }

  pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  button(x, y, w, h, label, action, color = "#00fff5") {
    this.buttons.push({ x, y, w, h, action });
    ctx.fillStyle = "#171827";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  handleClick(x, y) {
    for (const b of this.buttons) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        b.action();
        break;
      }
    }
  }

  async createRoom() {
    this.status = "正在创建房间…";
    try {
      this.roomCode = await this.net.host();
      this.state = "room";
      this.status = "房间已创建，请把房间号发给朋友。";
    } catch (e) {
      this.status = "创建失败：" + (e.message || e);
    }
  }

  async joinRoom() {
    const code = prompt("请输入房间号：");
    if (!code?.trim()) return;
    this.status = "正在连接…";

    try {
      await this.net.join(code.trim());
      this.roomCode = code.trim();
      this.state = "room";
      this.status = "已连接，等待房主开始。";
    } catch (e) {
      this.net.close();
      this.status = "加入失败：" + (e.message || e);
    }
  }

  onDisconnected() {
    if (this.state === "playing") {
      this.status = "连接中断";
      this.state = "gameover";
    } else {
      this.status = "连接已断开";
    }
  }

  onMessage(msg) {
    if (!msg || typeof msg.type !== "string") return;

    if (msg.type === "start" && !this.net.isHost) {
      if (!DIFFICULTIES[msg.diff]) return;
      this.startMatch(msg.mode, msg.diff, false);
      return;
    }

    if (msg.type === "input" && this.net.isHost) {
      if (this.state !== "playing" || msg.id !== this.net.conn?.peer) return;
      const p = this.players[msg.id];
      if (!p || !p.alive) return;

      p.input = {
        dx: clamp(Number(msg.dx) || 0, -1, 1),
        dy: clamp(Number(msg.dy) || 0, -1, 1),
        angle: Number.isFinite(msg.angle) ? msg.angle : p.angle,
        firing: !!msg.firing,
        action: ["shield", "rocket", "strike", "strong"].includes(msg.action)
          ? msg.action : ""
      };
      return;
    }

    if (msg.type === "snapshot" && !this.net.isHost) {
      if (this.state === "playing") this.applySnapshot(msg.snapshot);
      return;
    }
  }

  makePlayer(id, hp, x, name) {
    return {
      id, name, x: clamp(x, 25, W - 25), y: H / 2,
      angle: id === this.myId ? 0 : Math.PI,
      radius: 18, hp, maxHp: hp, alive: true,
      speed: 4.5, shield: 0, shieldUntil: 0,
      shieldCooldownUntil: 0, strongCooldownUntil: 0,
      rocketCooldownUntil: 0, strikeUntil: 0,
      lastShot: 0, input: { dx: 0, dy: 0, angle: 0, firing: false }
    };
  }

  startMatch(mode, diff, broadcast) {
    if (!DIFFICULTIES[diff]) diff = "battlers";

    this.mode = mode;
    this.diffKey = diff;
    this.state = "playing";
    this.score = 0;
    this.kills = 0;
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];
    this.players = {};
    this.lastSpawn = now();
    this.lastSnapshot = 0;

    const hp = mode === "pvp" ? 30 : DIFFICULTIES[diff].hp;
    const hostId = this.net.isHost ? this.myId : this.net.roomCode;
    const guestId = this.net.isHost ? this.net.conn?.peer : this.myId;

    if (this.net.isHost) {
      this.players[this.myId] = this.makePlayer(this.myId, hp, W * 0.25, "Host");
      if (this.net.conn?.open) {
        this.players[this.net.conn.peer] =
          this.makePlayer(this.net.conn.peer, hp, W * 0.75, "Guest");
      }
    } else {
      this.players[hostId] = this.makePlayer(hostId, hp, W * 0.25, "Host");
      this.players[guestId] = this.makePlayer(guestId, hp, W * 0.75, "You");
    }

    if (mode !== "pvp" && (this.net.isHost || mode === "solo")) {
      this.spawnInitialEnemies();
    }

    if (broadcast && this.net.isHost) {
      this.net.send({ type: "start", mode, diff });
    }
  }

  startSolo(diff) {
    this.net.close();
    this.mode = "solo";
    this.state = "playing";
    this.diffKey = diff;
    this.score = 0;
    this.kills = 0;
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];
    this.players = {};
    this.players.local = this.makePlayer("local", DIFFICULTIES[diff].hp, W * 0.25, "You");
    this.lastSpawn = now();
    this.spawnInitialEnemies();
  }

  startMultiplayer(mode) {
    if (!this.net.isHost || !this.net.conn?.open) {
      this.status = "请先等待玩家连接。";
      return;
    }
    this.startMatch(mode, mode === "pvp" ? "master" : "battlers", true);
  }

  spawnInitialEnemies() {
    if (this.mode === "pvp") return;
    const d = DIFFICULTIES[this.diffKey];
    for (let i = 0; i < d.yellow; i++) this.enemies.push(this.makeEnemy("yellow"));
    for (let i = 0; i < d.purple; i++) this.enemies.push(this.makeEnemy("purple"));
    for (let i = 0; i < d.green; i++) this.enemies.push(this.makeEnemy("green"));
  }

  makeEnemy(kind) {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = rand(30, W - 30); y = 25; }
    else if (edge === 1) { x = rand(30, W - 30); y = H - 25; }
    else if (edge === 2) { x = 25; y = rand(30, H - 30); }
    else { x = W - 25; y = rand(30, H - 30); }

    const stats = {
      yellow: { hp: 12, radius: 21, speed: 2.0, color: "#f9d56e" },
      purple: { hp: 6, radius: 20, speed: 1.8, color: "#9d4edd" },
      green: { hp: 8, radius: 18, speed: 2.2, color: "#06d6a0" }
    }[kind];

    return {
      kind, x, y, angle: 0, hp: stats.hp, maxHp: stats.hp,
      radius: stats.radius, speed: stats.speed, color: stats.color,
      shotAt: now() + rand(1, 3)
    };
  }

  activePlayers() {
    return Object.values(this.players).filter(p => p.alive);
  }

  targetFor(enemy) {
    const players = this.activePlayers();
    players.sort((a, b) => dist(enemy, a) - dist(enemy, b));
    return players[0] || null;
  }

  activateShield(p) {
    if (!p?.alive || p.shield > 0 || now() < p.shieldCooldownUntil) return;
    p.shield = 1;
    p.shieldUntil = now() + 3;
    p.shieldCooldownUntil = now() + 12;
  }

  damagePlayer(p, amount) {
    if (!p?.alive) return;
    if (p.shield && now() < p.shieldUntil) return;
    p.hp = Math.max(0, p.hp - amount);
    if (p.hp === 0) p.alive = false;
  }

  spawnBullet(p, strong = false) {
    this.bullets.push({
      x: p.x + Math.cos(p.angle) * 22,
      y: p.y + Math.sin(p.angle) * 22,
      angle: p.angle, speed: strong ? 12 : 10,
      radius: strong ? 8 : 5, damage: strong ? 3 : 1,
      owner: p.id, enemy: false,
      color: strong ? "#ff2e63" : "#00fff5", life: 2
    });
  }

  useSkill(skill) {
    const p = this.player;
    if (!p?.alive) return;

    if (this.net.peer && !this.net.isHost) {
      this.pendingAction = skill;
      return;
    }
    this.applySkill(p, skill);
  }

  applySkill(p, skill) {
    if (skill === "shield") {
      this.activateShield(p);
    } else if (skill === "strike" && now() >= p.strikeUntil) {
      p.strikeUntil = now() + 1.2;
      p.x = clamp(p.x + Math.cos(p.angle) * 90, p.radius, W - p.radius);
      p.y = clamp(p.y + Math.sin(p.angle) * 90, p.radius, H - p.radius);
      for (const e of this.enemies) {
        if (dist(e, p) < e.radius + 35) e.hp -= 5;
      }
      if (this.mode === "pvp") {
        for (const other of Object.values(this.players)) {
          if (other.id !== p.id && other.alive && dist(other, p) < 55) {
            this.damagePlayer(other, 5);
          }
        }
      }
    } else if (skill === "strong" && now() >= p.strongCooldownUntil) {
      p.strongCooldownUntil = now() + 5;
      this.spawnBullet(p, true);
    } else if (skill === "rocket" && now() >= p.rocketCooldownUntil) {
      p.rocketCooldownUntil = now() + 3;
      const targets = this.mode === "pvp"
        ? Object.values(this.players).filter(q => q.id !== p.id && q.alive)
        : this.enemies.filter(e => e.hp > 0);
      targets.sort((a, b) => dist(p, a) - dist(p, b));
      const target = targets[0];
      if (target) {
        this.rockets.push({
          x: p.x, y: p.y,
          angle: Math.atan2(target.y - p.y, target.x - p.x),
          speed: 8, radius: 8, damage: 3,
          owner: p.id, color: "#88aaff", life: 2
        });
      }
    }
  }

  localInput() {
    let dx = 0, dy = 0;
    if (this.touchMode) {
      dx = this.joy.dx;
      dy = this.joy.dy;
    } else {
      if (this.keys.w || this.keys.arrowup) dy--;
      if (this.keys.s || this.keys.arrowdown) dy++;
      if (this.keys.a || this.keys.arrowleft) dx--;
      if (this.keys.d || this.keys.arrowright) dx++;
      const n = Math.hypot(dx, dy);
      if (n > 1) { dx /= n; dy /= n; }
    }

    const p = this.player;
    return {
      dx, dy,
      angle: p ? Math.atan2(this.mouse.y - p.y, this.mouse.x - p.x) : 0,
      firing: this.mouse.down
    };
  }

  updatePlayer(p, input) {
    if (!p?.alive) return;

    p.angle = Number.isFinite(input.angle) ? input.angle : p.angle;
    const n = Math.hypot(input.dx, input.dy) || 1;
    p.x = clamp(p.x + input.dx / n * p.speed, p.radius, W - p.radius);
    p.y = clamp(p.y + input.dy / n * p.speed, p.radius, H - p.radius);

    if (input.firing && now() - p.lastShot > 0.14) {
      p.lastShot = now();
      this.spawnBullet(p);
    }

    if (input.action) {
      this.applySkill(p, input.action);
      input.action = "";
    }

    if (p.shield && now() > p.shieldUntil) p.shield = 0;
  }

  updateSimulation() {
    const hostSimulates = this.mode === "solo" || this.net.isHost;
    if (!hostSimulates) return;

    const localInput = this.localInput();
    this.updatePlayer(this.player, localInput);

    if (this.net.isHost && this.net.conn?.open) {
      const guest = this.players[this.net.conn.peer];
      if (guest?.input) this.updatePlayer(guest, guest.input);
    }

    if (this.mode !== "pvp") {
      if (now() - this.lastSpawn > 5 && this.enemies.length < 12) {
        this.lastSpawn = now();
        const types = ["yellow", "purple", "green"];
        const type = this.diffKey === "hell" || this.diffKey === "master"
          ? "yellow"
          : types[Math.floor(Math.random() * types.length)];
        this.enemies.push(this.makeEnemy(type));
      }

      for (const e of this.enemies) {
        const target = this.targetFor(e);
        if (!target) break;
        const a = Math.atan2(target.y - e.y, target.x - e.x);
        e.angle = a;

        if (dist(e, target) > 150) {
          e.x += Math.cos(a) * e.speed;
          e.y += Math.sin(a) * e.speed;
        } else {
          e.x -= Math.cos(a) * e.speed * 0.35;
          e.y -= Math.sin(a) * e.speed * 0.35;
        }

        if (e.kind !== "yellow" && now() > e.shotAt) {
          e.shotAt = now() + (e.kind === "green" ? 1.8 : 1.2);
          this.bullets.push({
            x: e.x, y: e.y, angle: a, speed: 6, radius: 5,
            damage: 1, owner: "enemy", enemy: true,
            color: e.kind === "green" ? "#1a3a8a" : "#c77dff", life: 3
          });
        }
      }
    }

    for (const b of this.bullets) {
      b.x += Math.cos(b.angle) * b.speed;
      b.y += Math.sin(b.angle) * b.speed;
      b.life -= 1 / 60;

      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        b.dead = true;
        continue;
      }

      if (b.enemy) {
        for (const p of Object.values(this.players)) {
          if (p.alive && dist(p, b) < p.radius + b.radius) {
            this.damagePlayer(p, b.damage);
            b.dead = true;
            break;
          }
        }
      } else if (this.mode === "pvp") {
        for (const p of Object.values(this.players)) {
          if (p.alive && p.id !== b.owner && dist(p, b) < p.radius + b.radius) {
            this.damagePlayer(p, b.damage);
            b.dead = true;
            break;
          }
        }
      } else {
        for (const e of this.enemies) {
          if (e.hp > 0 && dist(e, b) < e.radius + b.radius) {
            e.hp -= b.damage;
            b.dead = true;
            if (e.hp <= 0) {
              this.score += 100;
              this.kills++;
            }
            break;
          }
        }
      }
    }

    for (const r of this.rockets) {
      r.x += Math.cos(r.angle) * r.speed;
      r.y += Math.sin(r.angle) * r.speed;
      r.life -= 1 / 60;
      if (r.life <= 0 || r.x < 0 || r.x > W || r.y < 0 || r.y > H) {
        r.dead = true;
        continue;
      }

      const targets = this.mode === "pvp"
        ? Object.values(this.players).filter(p => p.alive && p.id !== r.owner)
        : this.enemies;

      for (const target of targets) {
        if (target.hp > 0 && dist(target, r) < (target.radius || 20) + r.radius) {
          if (this.mode === "pvp") this.damagePlayer(target, r.damage);
          else {
            target.hp -= r.damage;
            if (target.hp <= 0) {
              this.score += 100;
              this.kills++;
            }
          }
          r.dead = true;
          break;
        }
      }
    }

    this.bullets = this.bullets.filter(b => !b.dead);
    this.rockets = this.rockets.filter(r => !r.dead);
    this.enemies = this.enemies.filter(e => e.hp > 0);

    if (this.mode === "pvp" &&
        Object.values(this.players).filter(p => p.alive).length <= 1) {
      this.endMatch();
    } else if (!this.activePlayers().length) {
      this.endMatch();
    }

    if (this.net.isHost && now() - this.lastSnapshot > 0.05) {
      this.lastSnapshot = now();
      this.net.send({ type: "snapshot", snapshot: this.snapshot() });
    }
  }

  update() {
    if (this.state !== "playing") return;

    if (this.mode === "solo" || this.net.isHost) {
      this.updateSimulation();
    } else {
      const input = this.localInput();
      if (now() - this.lastInputSend > 0.04) {
        this.lastInputSend = now();
        this.net.send({
          type: "input",
          id: this.myId,
          ...input,
          action: this.pendingAction || ""
        });
        this.pendingAction = "";
      }
    }
  }

  snapshot() {
    return {
      mode: this.mode,
      score: this.score,
      players: Object.fromEntries(Object.entries(this.players).map(([id, p]) => [
        id, {
          id, name: p.name, x: p.x, y: p.y, angle: p.angle,
          hp: p.hp, maxHp: p.maxHp, alive: p.alive,
          shield: p.shield > 0, radius: p.radius
        }
      ])),
      enemies: this.enemies.map(e => ({
        kind: e.kind, x: e.x, y: e.y, angle: e.angle,
        hp: e.hp, maxHp: e.maxHp, radius: e.radius, color: e.color
      })),
      bullets: this.bullets.map(b => ({
        x: b.x, y: b.y, radius: b.radius, color: b.color
      })),
      rockets: this.rockets.map(r => ({
        x: r.x, y: r.y, angle: r.angle, radius: r.radius, color: r.color
      }))
    };
  }

  applySnapshot(s) {
    if (!s) return;
    this.mode = s.mode || this.mode;
    this.score = Number(s.score) || 0;
    this.players = s.players || {};
    this.enemies = s.enemies || [];
    this.bullets = s.bullets || [];
    this.rockets = s.rockets || [];
  }

  endMatch() {
    if (this.state === "playing") this.state = "gameover";
  }

  leaveMatch() {
    this.players = {};
    this.enemies = [];
    this.bullets = [];
    this.rockets = [];
    this.state = this.mode === "solo" ? "difficulty" : "room";
  }

  leaveRoom() {
    this.net.close();
    this.state = "menu";
    this.status = "";
  }

  draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b0c10";
    ctx.fillRect(0, 0, W, H);
    this.buttons = [];

    if (this.state === "menu") this.drawMenu();
    else if (this.state === "room") this.drawRoom();
    else if (this.state === "difficulty") this.drawDifficulty();
    else if (this.state === "shop") this.drawShop();
    else if (this.state === "playing") this.drawPlaying();
    else if (this.state === "gameover") this.drawGameOver();
  }

  drawMenu() {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63";
    ctx.font = "bold 28px Arial";
    ctx.fillText("TRIANGLE BATTLE ARENA", W / 2, H * 0.17);

    const bw = Math.min(270, W - 40), x = (W - bw) / 2;
    this.button(x, H * 0.27, bw, 44,
      this.device === "computer" ? "电脑控制 ✓" : "电脑控制",
      () => { this.device = "computer"; this.touchMode = false; }, "#ff2e63");
    this.button(x, H * 0.27 + 52, bw, 44,
      this.device === "mobile" ? "手机控制 ✓" : "手机控制",
      () => { this.device = "mobile"; this.touchMode = true; }, "#00fff5");
    this.button(x, H * 0.27 + 112, bw, 44, "单机模式",
      () => { this.state = "difficulty"; }, "#06d6a0");
    this.button(x, H * 0.27 + 164, bw, 44, "创建联机房间",
      () => this.createRoom(), "#ff9f1c");
    this.button(x, H * 0.27 + 216, bw, 44, "加入联机房间",
      () => this.joinRoom(), "#c77dff");

    ctx.fillStyle = "#aaa";
    ctx.font = "12px Arial";
    ctx.fillText(this.status, W / 2, H - 20);
  }

  drawRoom() {
    ctx.textAlign = "center";
    ctx.fillStyle = "#00fff5";
    ctx.font = "bold 25px Arial";
    ctx.fillText("联机房间", W / 2, 55);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px monospace";
    ctx.fillText(this.roomCode || "连接中…", W / 2, 85);
    ctx.fillStyle = "#aaa";
    ctx.font = "13px Arial";
    ctx.fillText(this.status, W / 2, 110);
    ctx.fillText(this.net.conn?.open ? "玩家已连接" : "等待玩家加入…", W / 2, 135);

    const x = W / 2 - 125;
    if (this.net.isHost) {
      this.button(x, H * 0.45, 250, 48, "开始合作模式",
        () => this.startMatch("coop", "battlers", true), "#06d6a0");
      this.button(x, H * 0.45 + 58, 250, 48, "开始 1v1 PVP",
        () => this.startMatch("pvp", "master", true), "#ff2e63");
    } else {
      ctx.fillStyle = "#888";
      ctx.fillText("等待房主开始游戏", W / 2, H * 0.49);
    }
    this.button(x, H * 0.45 + 118, 250, 46, "离开房间",
      () => this.leaveRoom(), "#888");
  }

  drawDifficulty() {
    ctx.textAlign = "center";
    ctx.fillStyle = "#00fff5";
    ctx.font = "bold 25px Arial";
    ctx.fillText("选择难度", W / 2, 65);

    const keys = Object.keys(DIFFICULTIES);
    const gap = 8;
    const bw = Math.min(160, (W - 40 - gap * 3) / 4);
    const total = bw * 4 + gap * 3;
    const sx = (W - total) / 2;

    keys.forEach((key, i) => {
      this.button(sx + i * (bw + gap), H * 0.3, bw, 90,
        DIFFICULTIES[key].name, () => this.startSolo(key),
        ["#06d6a0", "#ff9f1c", "#ff2e63", "#ff0000"][i]);
    });

    this.button(W / 2 - 100, H * 0.3 + 115, 200, 44, "商店",
      () => { this.state = "shop"; }, "#c77dff");
    this.button(W / 2 - 100, H * 0.3 + 168, 200, 44, "返回",
      () => { this.state = "menu"; }, "#888");

    ctx.fillStyle = "#aaa";
    ctx.font = "13px Arial";
    ctx.fillText(`分数：${this.score}`, W / 2, 100);
  }

  drawShop() {
    ctx.textAlign = "center";
    ctx.fillStyle = "#c77dff";
    ctx.font = "bold 25px Arial";
    ctx.fillText("商店", W / 2, 48);
    ctx.fillStyle = "#aaa";
    ctx.font = "13px Arial";
    ctx.fillText(`分数：${this.score}　装备：${this.equipped.length}/3`, W / 2, 75);

    const keys = Object.keys(SKILLS);
    const gap = 6;
    const bw = Math.min(140, (W - 24 - gap * 4) / 5);
    const total = bw * 5 + gap * 4;
    const sx = (W - total) / 2;

    keys.forEach((key, i) => {
      const skill = SKILLS[key];
      const owned = !!this.owned[key];
      const equipped = this.equipped.includes(key);
      const label = equipped ? `${skill.name} ✓` :
        owned ? `${skill.name} 装备` : `${skill.name} ${skill.cost}`;

      this.button(sx + i * (bw + gap), H * 0.3, bw, 100, label, () => {
        if (!owned) {
          if (this.score < skill.cost) return;
          this.score -= skill.cost;
          this.owned[key] = true;
        } else if (equipped) {
          this.equipped = this.equipped.filter(s => s !== key);
        } else if (this.equipped.length < 3) {
          this.equipped.push(key);
        }
      }, equipped ? "#06d6a0" : "#c77dff");
    });

    this.button(W / 2 - 100, H * 0.3 + 125, 200, 44, "返回",
      () => { this.state = "difficulty"; }, "#888");
  }

  drawPlaying() {
    const me = this.player;

    for (const e of this.enemies) {
      drawTriangle(e.x, e.y, e.radius, e.angle, e.color);
      drawBar(e.x, e.y, e.hp, e.maxHp);
    }

    for (const p of Object.values(this.players)) {
      if (!p?.alive) continue;
      if (p.shield) {
        ctx.strokeStyle = "#00ff88";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + 7, 0, Math.PI * 2);
        ctx.stroke();
      }
      drawTriangle(p.x, p.y, p.radius, p.angle,
        p.id === this.myId ? "#ff2e63" : "#ff8fa3");
      drawBar(p.x, p.y, p.hp, p.maxHp);
      ctx.fillStyle = "#ddd";
      ctx.font = "11px Arial";
      ctx.textAlign = "center";
      ctx.fillText(p.name, p.x, p.y - 38);
    }

    for (const b of this.bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
    }
    for (const r of this.rockets) {
      drawTriangle(r.x, r.y, r.radius, r.angle, r.color);
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "#eee";
    ctx.font = "13px Arial";
    ctx.fillText(`HP: ${me?.hp ?? 0}/${me?.maxHp ?? 0}  Marks: ${this.score}`, 10, 18);
    ctx.fillStyle = "#aaa";
    ctx.font = "11px Arial";
    ctx.fillText("WASD / 摇杆移动 · 鼠标/右半屏瞄准射击 · Q护盾 E火箭 F冲刺 C强射", 10, 38);

    if (this.touchMode) {
      const r = Math.min(W, H) * 0.12;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "#00fff5";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.joy.active ? this.joy.x : r + 20,
        this.joy.active ? this.joy.y : H - r - 20, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  drawGameOver() {
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff2e63";
    ctx.font = "bold 30px Arial";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 40);
    ctx.fillStyle = "#ddd";
    ctx.font = "16px Arial";
    ctx.fillText(`Score: ${this.score}  Kills: ${this.kills}`, W / 2, H / 2);
    this.button(W / 2 - 110, H / 2 + 28, 220, 48,
      this.mode === "solo" ? "返回难度选择" : "返回房间",
      () => this.leaveMatch(), "#00fff5");
  }
}

const game = new Game();

function frame() {
  game.update();
  game.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
